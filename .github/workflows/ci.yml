name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissão mínima do token da CI.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # REL-003 — barreira contra dependência vulnerável ENTRANDO.
  #
  # O Dependabot já abre PR de atualização, mas atualizar é sugestão: nada impedia uma dependência com
  # CVE conhecido de ser mergeada. Este job compara o que o PR acrescenta contra o banco de avisos do
  # GitHub e falha em severidade alta ou crítica.
  #
  # Só roda em pull_request porque compara duas árvores — no push para main não há base contra a qual
  # comparar, e um job que sempre passa por falta de entrada é pior que job nenhum.
  dependency-review:
    name: Dependências (CVE em novas dependências)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  backend:
    name: Backend (build, testes, arquitetura, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # `verify` roda unitários (surefire), a verificação Spring Modulith e o
      # ApplicationContextIT (Testcontainers PostgreSQL 18: migrations + wiring).
      - name: mvnw verify
        run: ./mvnw -B --no-transfer-progress verify

  frontend:
    name: Frontend (build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: lint (ESLint + fronteira de camadas)
        run: npm run lint
      - name: build
        run: npm run build
      - name: test (Vitest)
        run: npm test

  contracts:
    name: Contratos (schemas e OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar JSON Schemas e OpenAPI
        run: |
          set -e
          python3 -m pip install --quiet pyyaml
          for f in contracts/*.json; do
            echo "JSON  $f"; python3 -m json.tool "$f" > /dev/null
          done
          for f in contracts/*.yaml; do
            echo "YAML  $f"; python3 -c "import sys,yaml; yaml.safe_load(open('$f'))"
          done
          echo "Contratos válidos."

  e2e:
    name: E2E (Playwright, stack real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: brassia
          POSTGRES_USER: brassia_app
          POSTGRES_PASSWORD: brassia85!@#
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U brassia_app -d brassia"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # O perfil `local` cria o admin e a cervejaria de bootstrap, que é o que
      # dá ao E2E um usuário logável sem seed próprio.
      - name: Empacotar e subir a API
        run: |
          cd backend
          ./mvnw -B --no-transfer-progress -DskipTests package
          nohup java -jar target/*.jar --spring.profiles.active=local > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "API no ar"; exit 0
            fi
            sleep 3
          done
          echo "API não subiu"; tail -50 /tmp/api.log; exit 1

      - name: Instalar dependências
        run: |
          cd frontend && npm ci
          cd ../e2e && npm ci && npx playwright install --with-deps chromium

      - name: Rodar E2E
        run: cd e2e && npm test

      - name: Log da API quando falha
        if: failure()
        run: tail -100 /tmp/api.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  secrets:
    name: Verificação de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --redact -v --exit-code=1

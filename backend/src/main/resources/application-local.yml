# Perfil de desenvolvimento local. Credenciais aqui são descartáveis e batem
# com o compose.yaml; nunca use estes valores fora da máquina local.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/brassia}
    username: ${DB_USER:brassia_app}
    password: ${DB_PASSWORD:brassia85!@#}

server:
  # Porta padrão 8080. Se conflitar com outro app local, use SERVER_PORT=8081.
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        # Sobre HTTP local não é possível usar cookie __Host- (exige Secure).
        name: brassia_session
        secure: false

# Somente o ambiente local pode usar o adapter de arquivos em filesystem.
brassia:
  storage:
    provider: ${OBJECT_STORAGE_PROVIDER:filesystem}
    local-path: ${OBJECT_STORAGE_LOCAL_PATH:./data/objects}
  security:
    mfa:
      secret-key: ${MFA_SECRET_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    # Admin de bootstrap para desenvolvimento local (credenciais descartáveis).
    # Resolve o ciclo inicial: dá um administrador logável que pode convidar os
    # demais. Nunca habilitar/usar estes valores fora da máquina local.
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@brassia.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:admin-local-123}
      name: ${BOOTSTRAP_ADMIN_NAME:Administrador Local}
    # A SEGUNDA PESSOA — não é um administrador a mais.
    # A carga de distribuição é planejada por alguém e liberada por outro (LOG-001), e com um usuário
    # só não há caminho feliz para exercitar: o E2E alcançava a recusa e parava ali. Não há porta
    # pública para criar esta conta — o convite manda a senha por token que só sai na notificação, e o
    # SCIM exige credencial de serviço e não define senha. Credenciais descartáveis, como as de cima.
    bootstrap-checker:
      enabled: ${BOOTSTRAP_CHECKER_ENABLED:true}
      email: ${BOOTSTRAP_CHECKER_EMAIL:conferente@brassia.local}
      password: ${BOOTSTRAP_CHECKER_PASSWORD:conferente-local-123}
      name: ${BOOTSTRAP_CHECKER_NAME:Conferente Local}
    # A PESSOA DE POUCA ALÇADA — o terceiro eixo.
    # Admin e conferente têm as mesmas permissões e existem para provar "pessoas diferentes". Faltava
    # alguém para provar "permissões diferentes": sem ninguém de pouca alçada para logar, a recusa por
    # permissão só existia na API, e nenhum teste a via numa tela. Ela lê lote e custo, e não fecha
    # custo — a leitura é o contraponto, porque tela em branco não distingue recusa de defeito.
    bootstrap-operator:
      enabled: ${BOOTSTRAP_OPERATOR_ENABLED:true}
      email: ${BOOTSTRAP_OPERATOR_EMAIL:operador@brassia.local}
      password: ${BOOTSTRAP_OPERATOR_PASSWORD:operador-local-123}
      name: ${BOOTSTRAP_OPERATOR_NAME:Operador Local}
      group-code: ${BOOTSTRAP_OPERATOR_GROUP:OPERADORES_LOCAIS}
    # A PESSOA DA OUTRA CERVEJARIA — o quarto eixo.
    # Mesma alçada do admin, casa diferente: o que se prova é que a cervejaria separa, e não a permissão.
    # A associação é ESCOPADA à cervejaria vizinha; global daria acesso a todas e inverteria o teste.
    #
    # `brewery-code` PRECISA BATER com `brassia.brewery.neighbour.code` lá embaixo. Trocar um sem o outro
    # não quebra o boot: a conta simplesmente não é criada, com um aviso no log — e o teste de isolamento
    # falha depois, no login, longe da causa. Por isso as duas variáveis têm nome escopado.
    bootstrap-neighbour:
      enabled: ${BOOTSTRAP_NEIGHBOUR_USER_ENABLED:true}
      email: ${BOOTSTRAP_NEIGHBOUR_USER_EMAIL:vizinha@brassia.local}
      password: ${BOOTSTRAP_NEIGHBOUR_USER_PASSWORD:vizinha-local-123}
      name: ${BOOTSTRAP_NEIGHBOUR_USER_NAME:Vizinha Local}
      brewery-code: ${BOOTSTRAP_NEIGHBOUR_BREWERY_CODE:VIZINHA}
  brewery:
    # Cervejaria default para o login já ter uma cervejaria ativa em dev.
    bootstrap:
      enabled: ${BOOTSTRAP_BREWERY_ENABLED:true}
      code: ${BOOTSTRAP_BREWERY_CODE:MATRIZ}
      name: ${BOOTSTRAP_BREWERY_NAME:Cervejaria Matriz}
      timezone: ${BOOTSTRAP_BREWERY_TIMEZONE:America/Sao_Paulo}
    # A SEGUNDA CERVEJARIA, para o isolamento poder ser encenado pela tela.
    # O CÓDIGO PRECISA ORDENAR DEPOIS DO DA PADRÃO: a cervejaria ativa de uma sessão é a primeira por
    # código entre as acessíveis, e o admin alcança as duas. Um código antes de MATRIZ trocaria a casa
    # ativa de toda a suíte E2E, que passaria a semear numa e a ler na outra.
    neighbour:
      enabled: ${BOOTSTRAP_NEIGHBOUR_BREWERY_ENABLED:true}
      code: ${BOOTSTRAP_NEIGHBOUR_BREWERY_CODE:VIZINHA}
      name: ${BOOTSTRAP_NEIGHBOUR_BREWERY_NAME:Cervejaria Vizinha}
      timezone: ${BOOTSTRAP_NEIGHBOUR_BREWERY_TIMEZONE:America/Sao_Paulo}

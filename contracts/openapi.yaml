                 responsibleUserId, dependsOnPrevious, status, deviationHours]
      properties:
        id: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1}
        name: {type: string}
        action: {type: string, enum: [RAMP, REST, DRY_HOP, COLD_CRASH, TRANSFER, CONDITIONING]}
        condition: {type: string, enum: [TIME, GRAVITY, MANUAL]}
        conditionDays: {type: integer, nullable: true}
        targetGravity: {type: number, nullable: true}
        plannedStart: {type: string, format: date-time}
        plannedEnd: {type: string, format: date-time}
        toleranceHours: {type: integer, minimum: 0}
        responsibleUserId: {type: string, format: uuid}
        dependsOnPrevious:
          type: boolean
          description: "false = âncora com data própria; a propagação do recálculo para nela"
        status: {type: string, enum: [PLANNED, DONE]}
        executedAt: {type: string, format: date-time, nullable: true}
        deviationHours:
          type: integer
          description: "Desvio da execução em relação à janela: negativo antes, positivo depois"
        justification: {type: string, nullable: true}
    FermentationSchedule:
      type: object
      required: [id, batchId, profileId, profileVersion, steps]
      properties:
        id: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        profileId: {type: string, format: uuid}
        profileVersion: {type: integer}
        steps:
          type: array
          items: {$ref: '#/components/schemas/FermentationScheduleStep'}
    PlanFermentationSchedule:
      type: object
      required: [profileId, start, responsibleUserId]
      properties:
        profileId: {type: string, format: uuid, description: "Perfil publicado"}
        start: {type: string, format: date-time}
        responsibleUserId: {type: string, format: uuid}
        defaultDurationDays:
          type: integer
          minimum: 1
          description: "Duração de estágio cujo fim não é por tempo (padrão 3)"
        toleranceHours: {type: integer, minimum: 0, description: "Padrão 12"}
    AddScheduleStep:
      type: object
      required: [name, action, condition, plannedStart, plannedEnd, responsibleUserId]
      properties:
        name: {type: string, maxLength: 120}
        action: {type: string, enum: [RAMP, REST, DRY_HOP, COLD_CRASH, TRANSFER, CONDITIONING]}
        condition: {type: string, enum: [TIME, GRAVITY, MANUAL]}
        conditionDays: {type: integer}
        targetGravity: {type: number}
        plannedStart: {type: string, format: date-time}
        plannedEnd: {type: string, format: date-time}
        toleranceHours: {type: integer, minimum: 0}
        responsibleUserId: {type: string, format: uuid}
        dependsOnPrevious: {type: boolean}
    RescheduleStep:
      type: object
      required: [newStart]
      properties:
        newStart: {type: string, format: date-time}
        apply: {type: boolean, description: "false devolve só a prévia; nada é gravado"}
    ExecuteScheduleStep:
      type: object
      required: [executedAt]
      properties:
        executedAt: {type: string, format: date-time}
        justification: {type: string, maxLength: 300, description: "Obrigatória fora da tolerância"}
    ReschedulePreview:
      type: object
      required: [deltaHours, changes, blocked]
      properties:
        deltaHours: {type: integer}
        changes:
          type: array
          description: "Etapas que se movem, com a janela atual e a proposta"
          items:
            type: object
            properties:
              stepId: {type: string, format: uuid}
              sequence: {type: integer}
              name: {type: string}
              fromStart: {type: string, format: date-time}
              toStart: {type: string, format: date-time}
              fromEnd: {type: string, format: date-time}
              toEnd: {type: string, format: date-time}
        blocked:
          type: array
          description: "Onde a propagação parou, e por quê"
          items:
            type: object
            properties:
              stepId: {type: string, format: uuid}
              sequence: {type: integer}
              name: {type: string}
              reason: {type: string}
    YeastPolicy:
      type: object
      description: "Limites de repitch da cervejaria; campo omitido herda o padrão (10 / 21 dias / 70%)"
      properties:
        maxGeneration: {type: integer, minimum: 1}
        maxAgeDays: {type: integer, minimum: 1}
        minViabilityPercent: {type: number, minimum: 0, maximum: 100}
    YeastRecommendationFactor:
      type: object
      required: [name, withinPolicy, explanation]
      properties:
        name: {type: string, enum: [generation, age, viability]}
        withinPolicy: {type: boolean}
        explanation: {type: string, description: "Frase pronta explicando o fator"}
    YeastRecommendation:
      type: object
      required: [harvest, recommended, ageDays, factors, blockers]
      properties:
        harvest: {$ref: '#/components/schemas/YeastHarvest'}
        recommended: {type: boolean}
        ageDays: {type: integer}
        factors:
          type: array
          items: {$ref: '#/components/schemas/YeastRecommendationFactor'}
        blockers:
          type: array
          description: "Explicações dos fatores fora da política; vazio quando recomendada"
          items: {type: string}
    YeastReuse:
      type: object
      required: [policy, recommendations]
      properties:
        policy: {$ref: '#/components/schemas/YeastPolicy'}
        recommendations:
          type: array
          description: "Recomendadas primeiro; depois maior viabilidade, menor geração, mais nova"
          items: {$ref: '#/components/schemas/YeastRecommendation'}
    UseYeastHarvest:
      type: object

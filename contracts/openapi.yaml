        containerId: {type: string, format: uuid}
        plannedUnits: {type: integer, minimum: 1}
        lineEquipmentId: {type: string, format: uuid}
        plannedStart: {type: string, format: date-time}
        plannedEnd: {type: string, format: date-time}

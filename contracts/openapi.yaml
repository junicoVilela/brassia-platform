openapi: 3.1.0
info:
  title: BrassIA API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /recipes:
    get:
      operationId: listRecipes
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 0}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200': {description: Página de receitas}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRecipe'}
      responses:
        '201': {description: Receita criada (rascunho)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /recipes/{id}:
    get:
      operationId: getRecipe
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Detalhe da receita com composição}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /recipes/{id}/volumes:
    get:
      operationId: getRecipeVolumes
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Balanço de volumes (água, absorção, evaporação, perdas, volume final) e método}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /recipes/{id}/metrics:
    get:
      operationId: getRecipeMetrics
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Metas persistidas (OG, FG, ABV, IBU, cor, atenuação) com método e versão}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: calculateRecipeMetrics
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Metas calculadas e persistidas, com tolerância explícita vs as metas informadas}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /recipes/{id}/publish:
    post:
      operationId: publishRecipe
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Receita publicada (congelada)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /recipes/{id}/versions:
    post:
      operationId: createRecipeVersion
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Nova versão (rascunho) derivada da publicada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /recipes/{id}/clone:
    post:
      operationId: cloneRecipe
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name], properties: {name: {type: string, maxLength: 120}}}
      responses:
        '200': {description: Cópia independente (rascunho)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /recipes/{id}/scale:
    post:
      operationId: scaleRecipe
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, batchVolumeLiters]
              properties:
                name: {type: string, maxLength: 120}
                batchVolumeLiters: {type: number}
      responses:
        '200': {description: Receita escalada (rascunho); volume respeita a capacidade}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /recipes/{id}/compare:
    get:
      operationId: compareRecipes
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: other, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Diferenças campo a campo entre as duas receitas}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /recipes/{id}/export:
    get:
      operationId: exportRecipe
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: format, in: query, schema: {type: string, enum: [beerjson, beerxml], default: beerjson}}
      responses:
        '200': {description: Receita em BeerJSON ou BeerXML}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /recipes/import:
    post:
      operationId: importRecipe
      parameters:
        - {name: format, in: query, schema: {type: string, enum: [beerjson, beerxml], default: beerjson}}
      requestBody:
        required: true
        description: Documento BeerJSON ou BeerXML (corpo bruto)
        content:
          text/plain: {schema: {type: string}}
      responses:
        '200': {description: Receita importada + relatório de compatibilidade (campos desconhecidos)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /breweries:
    get:
      operationId: listBreweries
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 0}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200': {description: Página de cervejarias}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: registerBrewery
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterBrewery'}
      responses:
        '201': {description: Cervejaria cadastrada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /breweries/active/preferences:
    get:
      operationId: getActiveBreweryPreferences
      responses:
        '200': {description: Preferências operacionais da cervejaria ativa}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateActiveBreweryPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateBreweryPreferences'}
      responses:
        '200': {description: Preferências atualizadas (nova versão)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /breweries/active/preferences/revisions/{version}:
    get:
      operationId: getBreweryPreferencesRevision
      parameters:
        - {name: version, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Snapshot imutável de uma versão}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /catalog/ingredients:
    get:
      operationId: listIngredients
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [MALT, HOP, YEAST, SALT, ADJUNCT, PACKAGING]}}
        - {name: page, in: query, schema: {type: integer, default: 0}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200': {description: Página de ingredientes}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: registerIngredient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterIngredient'}
      responses:
        '201': {description: Ingrediente cadastrado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /catalog/ingredients/{id}:
    put:
      operationId: updateIngredient
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateIngredient'}
      responses:
        '200': {description: Ingrediente atualizado (nova versão)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /equipment:
    get:
      operationId: listEquipment
      summary: >-
        Página de equipamentos. Cada item traz `cleanliness` (CLEAN/DIRTY) e `soiledSince` (CLN-004-A):
        o estado vem na mesma consulta da página, e não item a item — o N+1 do estado ficaria invisível
        em quem lê o código, porque moraria no mapeador
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 0}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200': {description: Página de equipamentos}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: registerEquipment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterEquipment'}
      responses:
        '201': {description: Equipamento cadastrado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /equipment/{id}:
    put:
      operationId: updateEquipment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateEquipment'}
      responses:
        '200': {description: Equipamento atualizado (nova versão)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /equipment/{id}/revisions/{version}:
    get:
      operationId: getEquipmentRevision
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Snapshot imutável de uma versão}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /equipment/{id}/maintenance:
    get:
      operationId: listEquipmentMaintenance
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Janelas de manutenção do equipamento}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: scheduleEquipmentMaintenance
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleMaintenance'}
      responses:
        '201': {description: Janela agendada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /equipment/{id}/maintenance/{maintenanceId}/cancel:
    post:
      operationId: cancelEquipmentMaintenance
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: maintenanceId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Janela cancelada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /equipment/{id}/availability:
    get:
      operationId: getEquipmentAvailability
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Disponibilidade do equipamento no intervalo}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /water/sources:
    get:
      operationId: listWaterSources
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 0}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200': {description: Página de fontes de água}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: registerWaterSource
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterWaterSource'}
      responses:
        '201': {description: Fonte cadastrada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /water/sources/{id}:
    put:
      operationId: updateWaterSource
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWaterSource'}
      responses:
        '200': {description: Fonte atualizada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /water/sources/{sourceId}/reports:
    get:
      operationId: listWaterReports
      parameters:
        - {name: sourceId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Histórico de laudos (mais recente primeiro)}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: recordWaterReport
      parameters:
        - {name: sourceId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordWaterReport'}
      responses:
        '201': {description: Laudo registrado (imutável)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /water/profiles:
    get:
      operationId: listWaterProfiles
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 0}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200': {description: Página de perfis-alvo}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: registerWaterProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterWaterProfile'}
      responses:
        '201': {description: Perfil-alvo cadastrado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /water/profiles/{id}:
    put:
      operationId: updateWaterProfile
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWaterProfile'}
      responses:
        '200': {description: Perfil-alvo atualizado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /water/blends/simulate:
    post:
      operationId: simulateWaterBlend
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulateBlend'}
      responses:
        '200': {description: Resultado da mistura (balanço, entradas e método)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /brew-orders:
    get:
      operationId: listBrewOrders
      summary: Lista ordens de produção
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 0}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200': {description: Página de ordens}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createBrewOrder
      summary: Cria uma OP de receita publicada (código único + snapshot congelado)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBrewOrder'}
      responses:
        '201': {description: OP criada (DRAFT)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /brew-orders/{id}:
    get:
      operationId: getBrewOrder
      summary: Detalha uma OP com o snapshot congelado
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OP detalhada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrewOrderDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /brew-orders/{id}/release:
    post:
      operationId: releaseBrewOrder
      summary: Libera a OP (valida bloqueios; sucesso emite evento e auditoria)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReleaseBrewOrder'}
      responses:
        '200': {description: OP liberada (RELEASED)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: Bloqueada — corpo Problem Details com a lista de bloqueios
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ReleaseBlocked'}
  /brew-orders/{id}/cancel:
    post:
      operationId: cancelBrewOrder
      summary: Cancela a OP com motivo (idempotente; libera reservas na S06)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelBrewOrder'}
      responses:
        '200': {description: OP cancelada (ou já cancelada — idempotente)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /brew-orders/{id}/reserve-stock:
    post:
      operationId: reserveBrewOrderStock
      summary: "Reserva o estoque de todos os materiais da OP liberada (all-or-nothing; re-sincroniza)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "Estoque reservado (reserved=true, reservedItems=n)"}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {description: "OP não liberada ou estoque insuficiente (extensão shortfalls); nada reservado"}
  /brew-orders/{id}/start:
    post:
      operationId: startBrewOrder
      summary: "Inicia a produção da OP liberada (RELEASED → IN_PRODUCTION; cria o lote via evento)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "OP em produção (status IN_PRODUCTION)"}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /production/batches:
    get:
      operationId: listProductionBatches
      summary: Lista os lotes de produção (paginado)
      description: >-
        **Paginado desde REL-002, e a mudança foi incompatível de propósito.** A resposta deixou de ser um
        array e passou a ser um envelope com `content`.


        A listagem sem limite crescia com o histórico: 300 lotes respondiam em 40 ms e 3.000 em 319 ms —
        linear, cruzando a meta de 500 ms por volta de 4.700 lotes. A causa não era o tamanho do JSON, e
        sim um N+1: os passos vinham numa consulta por lote, então listar 3.000 disparava 3.001 consultas.
        As duas coisas foram corrigidas — paginar limita o conjunto, e os passos da página passaram a vir
        numa consulta só.


        Quebrar o contrato só é barato antes da primeira produção, que é onde o projeto está. Depois do
        primeiro cliente integrado, a mesma correção exigiria versão nova e janela de transição
        (`docs/20_RELEASE_MIGRATION.md`).
      parameters:
        - {name: page, in: query, required: false, schema: {type: integer, default: 0, minimum: 0}}
        - name: size
          in: query
          required: false
          description: >-
            Máximo 100. Pedido acima do teto é reduzido, não recusado — sem teto, `size=100000`
            reproduziria exatamente o problema que a paginação fecha
          schema: {type: integer, default: 20, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Uma página de lotes, mais recentes primeiro
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: {type: array, items: {type: object}}
                  page: {type: integer}
                  size: {type: integer}
                  totalElements:
                    type: integer
                    format: int64
                    description: >-
                      O campo que torna a interface honesta: sem ele, uma lista truncada é
                      indistinguível de uma lista completa
                  totalPages: {type: integer}
        '403': {$ref: '#/components/responses/Problem'}
  /production/batches/{id}:
    get:
      operationId: getProductionBatch
      summary: Detalhe do lote (snapshot + roteiro com status/marcos)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Lote}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /production/corrections:
    get:
      operationId: listBrewCorrections
      summary: "Correções determinísticas do dia de brassa (diluição, concentração, temperatura, volume)"
      responses:
        '200': {description: Correções disponíveis}
        '403': {$ref: '#/components/responses/Problem'}
  /production/batches/{id}/corrections/preview:
    post:
      operationId: previewBatchCorrection
      summary: "Pré-visualiza o impacto de uma correção (não persiste; nada aplicado sem confirmação)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreviewCorrection'}
      responses:
        '200': {description: Impacto calculado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /production/batches/{id}/corrections/apply:
    post:
      operationId: applyBatchCorrection
      summary: "Aplica (registra a decisão de) uma correção (CAL-002): evento + planejado vs realizado"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplyCorrection'}
      responses:
        '201': {description: Correção aplicada (registrada)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /production/batches/{id}/corrections/applied:
    get:
      operationId: listAppliedCorrections
      summary: Correções aplicadas no lote (planejado vs realizado)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Correções aplicadas}
        '403': {$ref: '#/components/responses/Problem'}
  /production/batches/{id}/measurements:
    get:
      operationId: listBatchMeasurements
      summary: Medições registradas no lote (imutáveis)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Medições do lote}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: recordBatchMeasurement
      summary: "Registra uma medição (unidade validada contra a grandeza; imutável)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordMeasurement'}
      responses:
        '201': {description: Medição registrada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /production/batches/{id}/alerts:
    get:
      operationId: listBatchAlerts
      summary: Central de alertas/ações do lote (timeline persistida)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Alertas do lote}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createBatchAlert
      summary: Cria um item na central (adição/etapa/medição/decisão)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAlert'}
      responses:
        '201': {description: Alerta criado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /production/batches/{id}/alerts/{alertId}/confirm:
    post:
      operationId: confirmBatchAlert
      summary: "Confirma um alerta/ação (idempotente; não avança etapa)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: alertId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Alerta confirmado (idempotente)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /production/batches/{id}/transfer:
    get:
      operationId: getBatchTransfer
      summary: Transferência do lote ao fermentador (204 se ainda não transferido)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Transferência}
        '204': {description: Lote ainda não transferido}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: transferBatch
      summary: "Transfere o lote ao fermentador (valida capacidade, balanço de massa e limpeza; move para FERMENTING)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferBatch'}
      responses:
        '201': {description: Lote transferido}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            Capacidade do fermentador ou balanço de massa excedido; já transferido; ou o tanque de destino
            não tem limpeza liberada (`equipment_not_clean`, CLN-004-A). Neste último caso a resposta traz
            `soiledSince` — a ação muda com ele: um tanque que esvaziou hoje precisa de um CIP; um parado
            sujo há três semanas precisa de uma conversa antes do CIP
          $ref: '#/components/responses/Problem'
  /production/batches/{id}/steps/{stepId}/complete:
    post:
      operationId: completeBatchStep
      summary: "Conclui a etapa ativa e ativa a próxima (sequencial; fora de ordem → 409)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: stepId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Etapa concluída; lote atualizado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /fermentation/profiles:
    get:
      operationId: listFermentationProfiles
      summary: Lista perfis de fermentação
      responses:
        '200':
          description: Perfis
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FermentationProfile'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createFermentationProfile
      summary: "Cria um perfil em rascunho (nova versão se o código já foi publicado)"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFermentationProfile'}
      responses:
        '201': {description: Perfil criado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /fermentation/profiles/{id}:
    get:
      operationId: getFermentationProfile
      summary: Detalha um perfil de fermentação
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FermentationProfile'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateFermentationProfile
      summary: "Atualiza um perfil em rascunho (publicado é imutável)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateFermentationProfile'}
      responses:
        '200': {description: Perfil atualizado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /fermentation/profiles/{id}/publish:
    post:
      operationId: publishFermentationProfile
      summary: "Publica o perfil (DRAFT → PUBLISHED; congela a versão)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Perfil publicado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /fermentation/readings:
    get:
      operationId: listFermentationReadings
      summary: "Série de leituras do lote (curva), opcionalmente filtrada por grandeza"
      parameters:
        - {name: batchId, in: query, required: true, schema: {type: string, format: uuid}}
        - name: kind
          in: query
          required: false
          schema: {type: string, enum: [DENSITY, TEMPERATURE, PRESSURE, PH]}
      responses:
        '200':
          description: "Leituras ordenadas por instante; cada uma traz origem (manual/sensor) e validade"
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FermentationReading'}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: recordFermentationReading
      summary: "Registra leitura de fermentação (idempotente por lote+grandeza+origem+instante)"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordFermentationReading'}
      responses:
        '200': {description: "Reenvio da mesma chave natural; nada foi duplicado"}
        '201': {description: "Leitura registrada; fora da faixa plausível vem com valid=false e motivo"}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /fermentation/batches/{batchId}/fg-stability:
    get:
      operationId: evaluateFgStability
      summary: "Avalia a estabilidade de FG do lote sob o critério do perfil da sua agenda"
      description: >
        Parecer explicável: devolve o critério aplicado e as leituras que o sustentam.
        Não encerra a fermentação nem altera o lote — a decisão é do cervejeiro.
        Só entram leituras de densidade em SG marcadas como válidas.
        O critério vem do perfil da agenda do lote; lote sem agenda responde 400.
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Parecer de estabilidade
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FgStability'}
  /fermentation/yeast/harvests:
    get:
      operationId: listYeastHarvests
      summary: Lista coletas de levedura
      parameters:
        - name: onlyAvailable
          in: query
          required: false
          description: "true restringe às aprovadas — as únicas reutilizáveis"
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Coletas
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/YeastHarvest'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: collectYeast
      summary: "Registra uma coleta de levedura (nasce em quarentena)"
      description: >
        A geração é derivada da coleta-mãe e nunca informada: sem mãe é levedura comprada
        (geração 1). Coleta-mãe indisponível (em quarentena ou reprovada) não propaga linhagem.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectYeast'}
      responses:
        '201': {description: "Coleta registrada em quarentena"}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /fermentation/yeast/harvests/{id}/genealogy:
    get:
      operationId: getYeastGenealogy
      summary: "Genealogia completa da coleta, dela até a levedura comprada"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "Linhagem da mais nova para a mais antiga"
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/YeastHarvest'}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /fermentation/batches/{batchId}/schedule:
    get:
      operationId: getFermentationSchedule
      summary: Linha do tempo de fermentação do lote
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Agenda do lote
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FermentationSchedule'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: planFermentationSchedule
      summary: "Planeja a agenda a partir de um perfil publicado"
      description: >
        Deriva as etapas dos estágios do perfil. O vínculo lote↔perfil resultante também
        define o critério de estabilidade de FG do lote. Um lote tem uma agenda só (409);
        perfil em rascunho não rege agenda (409).
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanFermentationSchedule'}
      responses:
        '201': {description: Agenda planejada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /fermentation/batches/{batchId}/schedule/steps:
    post:
      operationId: addFermentationScheduleStep
      summary: "Acrescenta etapa específica do lote (dry hop, cold crash, transferência)"
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddScheduleStep'}
      responses:
        '201': {description: Etapa acrescentada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /fermentation/batches/{batchId}/schedule/steps/{stepId}/reschedule:
    post:
      operationId: rescheduleFermentationStep
      summary: "Move a data de uma etapa; com apply=false devolve só a prévia"
      description: >
        A propagação segue apenas a cadeia de etapas encadeadas e ainda pendentes: etapa
        executada e etapa-âncora (sem dependência da anterior) não se movem e aparecem em
        `blocked` com o motivo. Nada é gravado quando apply=false.
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: stepId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RescheduleStep'}
      responses:
        '200':
          description: Prévia (ou efeito aplicado) do recálculo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReschedulePreview'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /fermentation/batches/{batchId}/schedule/steps/{stepId}/execute:
    post:
      operationId: executeFermentationStep
      summary: "Registra a execução da etapa (planejado permanece)"
      description: >
        Desvio e justificativa entram ao lado da janela planejada, que não é reescrita.
        Execução fora da tolerância exige justificativa (400 sem ela); etapa já executada
        responde 409.
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: stepId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecuteScheduleStep'}
      responses:
        '200': {description: Execução registrada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /fermentation/schedule/late-step-alerts:
    post:
      operationId: raiseLateStepAlerts
      summary: "Abre alerta na central do lote para cada etapa vencida além da tolerância"
      description: >
        Alerta é aviso: não altera setpoint, equipamento nem o estado da etapa.
      responses:
        '200':
          description: Ids dos alertas abertos
          content:
            application/json:
              schema: {type: array, items: {type: string, format: uuid}}
        '403': {$ref: '#/components/responses/Problem'}
  /fermentation/yeast/reuse:
    get:
      operationId: recommendYeastReuse
      summary: "Recomenda coletas para repitch, ordenadas e explicadas"
      description: >
        Consulta: combina geração, idade e viabilidade contra a política da cervejaria e
        devolve, por coleta, o veredito e a explicação de cada fator. Recomendar não usa nada —
        o pitch exige confirmação no endpoint da coleta. Só coletas aprovadas são candidatas.
      parameters:
        - name: strainId
          in: query
          required: false
          description: "Restringe a uma cepa; omitido considera todas"
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: "Recomendações ordenadas + a política aplicada"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YeastReuse'}
        '403': {$ref: '#/components/responses/Problem'}
  /fermentation/yeast/policy:
    get:
      operationId: getYeastPolicy
      summary: "Política de reutilização da cervejaria (padrão do domínio se não configurada)"
      responses:
        '200':
          description: Política vigente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YeastPolicy'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      operationId: saveYeastPolicy
      summary: Ajusta a política de reutilização
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YeastPolicy'}
      responses:
        '200': {description: Política salva}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /fermentation/yeast/harvests/{id}/use:
    post:
      operationId: useYeastHarvest
      summary: "Confirma o uso da coleta num lote (consome a coleta)"
      description: >
        Exige confirmação explícita e lote de destino existente. A coleta passa a USED e sai
        das disponíveis, para a mesma levedura não ser pitchada duas vezes.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UseYeastHarvest'}
      responses:
        '200': {description: Uso confirmado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /fermentation/yeast/harvests/{id}/review:
    post:
      operationId: reviewYeastHarvest
      summary: "Aprova ou reprova a coleta (decisão humana, terminal)"
      description: >
        Só aprovada fica disponível para reúso. Reprovação exige motivo e não pode ser
        revertida; coleta já revisada responde 409.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewYeastHarvest'}
      responses:
        '200': {description: Coleta revisada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/procedures:
    get:
      operationId: listCleaningProcedures
      summary: Lista POPs de limpeza/sanitização
      responses:
        '200': {description: POPs}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createCleaningProcedure
      summary: "Cria um POP em rascunho (nova versão se o código já foi publicado)"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProcedure'}
      responses:
        '201': {description: POP criado (rascunho)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/procedures/{id}:
    get:
      operationId: getCleaningProcedure
      summary: Detalhe do POP (etapas)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: POP}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateCleaningProcedure
      summary: "Edita um POP em rascunho (publicado é imutável → 409)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProcedure'}
      responses:
        '200': {description: POP atualizado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/procedures/{id}/publish:
    post:
      operationId: publishCleaningProcedure
      summary: "Publica o POP (DRAFT → PUBLISHED; congela a versão)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: POP publicado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/matrix:
    get:
      operationId: listCompatibilityRules
      summary: "Matriz de compatibilidade (regras material × sujidade × risco × produto anterior)"
      responses:
        '200':
          description: Regras cadastradas
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CompatibilityRule'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createCompatibilityRule
      summary: "Cadastra regra da matriz (POP referenciado, se houver, deve estar PUBLISHED)"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCompatibilityRule'}
      responses:
        '201': {description: Regra criada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/matrix/recommend:
    post:
      operationId: recommendCleaning
      summary: "Recomenda limpeza pelo contexto exato do material (sem herança entre materiais)"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecommendCleaning'}
      responses:
        '200':
          description: Recomendação
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompatibilityRule'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /sanitation/cycles:
    get:
      operationId: listCleaningCycles
      summary: Lista ciclos de limpeza da cervejaria
      responses:
        '200':
          description: Ciclos
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CleaningCycle'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: startCleaningCycle
      summary: "Inicia um ciclo (exige POP publicado e equipamento; congela o snapshot das faixas)"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartCleaningCycle'}
      responses:
        '201': {description: Ciclo iniciado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /sanitation/cycles/{id}:
    get:
      operationId: getCleaningCycle
      summary: Detalha um ciclo e suas etapas
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Ciclo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CleaningCycle'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /sanitation/cycles/{id}/steps:
    post:
      operationId: recordCycleStep
      summary: "Registra a execução de uma etapa; parâmetro fora da ficha é bloqueado (override exige alçada)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordCycleStep'}
      responses:
        '204': {description: Etapa registrada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/cycles/{id}/interrupt:
    post:
      operationId: interruptCleaningCycle
      summary: Interrompe o ciclo preservando o estado (retomável)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InterruptCleaningCycle'}
      responses:
        '204': {description: Ciclo interrompido}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/cycles/{id}/resume:
    post:
      operationId: resumeCleaningCycle
      summary: Retoma um ciclo interrompido
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Ciclo retomado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/cycles/{id}/complete:
    post:
      operationId: completeCleaningCycle
      summary: "Encerra a execução (exige todas as etapas concluídas)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Ciclo concluído}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/cycles/{id}/verification:
    post:
      operationId: verifyCleaningCycle
      summary: "Registra a verificação (enxágue/visual/ATP/micro) de um ciclo concluído"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CleaningVerification'}
      responses:
        '204': {description: Verificação registrada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/cycles/{id}/release:
    post:
      operationId: releaseCleaningCycle
      summary: "Libera o equipamento; exige verificação aprovada (não passa com limpeza reprovada)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Ciclo liberado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/cycles/{id}/reject:
    post:
      operationId: rejectCleaningCycle
      summary: "Reprova o ciclo (retrabalho); exige verificação registrada"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Ciclo reprovado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/cycles/{id}/consumption:
    post:
      operationId: recordCycleConsumption
      summary: "Registra/atualiza o consumo (água/energia/produto) de um ciclo com execução encerrada"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CleaningConsumption'}
      responses:
        '204': {description: Consumo registrado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/consumption/summary:
    get:
      operationId: cleaningConsumptionSummary
      summary: "Comparação consultiva de consumo por POP (read-only; não reduz parâmetros do POP)"
      parameters:
        - {name: procedureCode, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Resumo de consumo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsumptionSummary'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /suppliers:
    get:
      operationId: listSuppliers
      summary: Lista fornecedores
      responses:
        '200': {description: Fornecedores}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: registerSupplier
      summary: Cadastra um fornecedor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterSupplier'}
      responses:
        '201': {description: Fornecedor criado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /purchasing/needs:
    get:
      operationId: listPurchaseNeeds
      summary: "Necessidade de compra por ingrediente (demanda das OPs liberadas menos saldo)"
      responses:
        '200': {description: Necessidades de compra}
        '403': {$ref: '#/components/responses/Problem'}
  /purchasing/shopping-list:
    get:
      operationId: listShoppingList
      summary: "Lista de compras consolidada por fornecedor (custos apenas com purchasing.cost.read)"
      responses:
        '200': {description: Lista de compras agrupada por fornecedor}
        '403': {$ref: '#/components/responses/Problem'}
  /inventory/lots:
    get:
      operationId: listStockLots
      summary: Lista lotes de estoque
      responses:
        '200': {description: Lotes}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: receiveStockLot
      summary: Recebe um lote de insumo (bloqueado não fica disponível)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReceiveStockLot'}
      responses:
        '201': {description: Lote recebido}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /inventory/lots/{lotId}/movements:
    get:
      operationId: listStockMovements
      summary: Ledger de movimentos do lote
      parameters:
        - {name: lotId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Movimentos}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: recordStockMovement
      summary: Registra um movimento manual (consumo, devolução, perda, ajuste)
      parameters:
        - {name: lotId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordMovement'}
      responses:
        '200':
          description: Movimento registrado; saldo derivado atualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockBalance'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /inventory/lots/{lotId}/properties:
    get:
      operationId: listLotProperties
      summary: "Valores medidos do lote (COA/safra); history=true retorna todas as revisões"
      parameters:
        - {name: lotId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: history, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Valores do lote (atuais ou histórico)}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: recordLotProperties
      summary: "Vincula valores medidos ao lote (append-only; regravar cria revisão, última vale)"
      parameters:
        - {name: lotId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '201': {description: Valores vinculados}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /inventory/counts:
    get:
      operationId: listPhysicalCounts
      summary: Lista contagens físicas
      responses:
        '200': {description: Contagens}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createPhysicalCount
      summary: Registra uma contagem física (OPEN; ajustes só na aprovação)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCount'}
      responses:
        '201': {description: Contagem criada (OPEN)}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /inventory/counts/{id}:
    get:
      operationId: getPhysicalCount
      summary: Detalha uma contagem com linhas e diferenças
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Contagem}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /inventory/counts/{id}/approve:
    post:
      operationId: approvePhysicalCount
      summary: Aprova a contagem e gera os ajustes (delta = contado − saldo atual)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Contagem aprovada; ajustes lançados}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /inventory/reservations:
    post:
      operationId: reserveStock
      summary: Reserva estoque de um ingrediente por FEFO (vencido/bloqueado excluídos)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReserveStock'}
      responses:
        '200':
          description: Reserva alocada por lote
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReserveStockResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /inventory/reservations/release:
    post:
      operationId: releaseStock
      summary: "Libera as reservas de uma referência (ex.: OP cancelada)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties: {orderId: {type: string, format: uuid}}
      responses:
        '200': {description: Reservas liberadas}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /inventory/lots/{lotId}/balance:
    get:
      operationId: getStockBalance
      summary: Saldo derivado do lote (on-hand, reservado, disponível)
      parameters:
        - {name: lotId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Saldo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockBalance'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /batches/{batchId}/measurements:
    post:
      operationId: recordMeasurement
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Measurement'}
      responses:
        '201': {description: Recorded}
  /planning/schedule:
    get:
      operationId: listScheduleEntries
      summary: Agenda de produção no período (calendário)
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Entradas da agenda
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ScheduleEntry'}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createScheduleEntry
      summary: Planeja uma brassagem (receita publicada, equipamento, janela, responsável)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateScheduleEntry'}
      responses:
        '201': {description: Entrada da agenda criada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /planning/schedule/simulate:
    post:
      operationId: simulateScheduleEntry
      summary: Verifica conflito de equipamento sem persistir
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulateSchedule'}
      responses:
        '200':
          description: Resultado da simulação
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulateScheduleResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /planning/schedule/{id}/materials:
    get:
      operationId: scheduleEntryMaterials
      summary: Necessidade de materiais de uma entrada da agenda (sem reservar)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: lossPercent, in: query, required: false, schema: {type: number, minimum: 0}}
      responses:
        '200':
          description: Necessidade por ingrediente
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/MaterialLine'}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /planning/material-requirement:
    post:
      operationId: materialRequirement
      summary: Explode receita publicada em necessidade de materiais (sem reservar)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaterialRequirement'}
      responses:
        '200':
          description: Necessidade por ingrediente
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/MaterialLine'}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /packaging/plans:
    get:
      operationId: listPackagingPlans
      summary: Lista planos de envase
      parameters:
        - name: batchId
          in: query
          required: false
          description: Restringe aos planos de um lote
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Planos de envase
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PackagingPlan'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: planPackaging
      summary: "Abre um plano de envase (embalagem, quantidade, linha e janela)"
      description: >
        O volume planejado é derivado de unidades × volume da embalagem e nunca informado;
        planejar mais do que o lote comporta responde 400. Só lote em fermentação aceita plano
        (409); a embalagem precisa ser ingrediente do tipo PACKAGING com `volumeMl` declarado.


        `maxPressureBar` é opcional no cadastro da embalagem e é o que permite recusar um alvo de
        carbonatação acima do que ela suporta (PKG-002-A): lata, long neck e garrafa de champanhe têm
        limites diferentes, e sem o dado o sistema não tem como barrar o caso perigoso.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanPackaging'}
      responses:
        '201':
          description: "Plano aberto em PLANNED, com o checklist pendente"
          content:
            application/json:
              schema:
                type: object
                required: [id, plannedVolumeLiters]
                properties:
                  id: {type: string, format: uuid}
                  plannedVolumeLiters: {type: number}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /packaging/plans/{id}:
    get:
      operationId: getPackagingPlan
      summary: Plano de envase com o checklist completo
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Plano de envase
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackagingPlan'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /packaging/plans/{id}/checklist:
    post:
      operationId: confirmPackagingChecklistItem
      summary: Confirma um item do checklist de envase
      description: >
        Repetir é inócuo: a primeira confirmação é preservada, porque ela é a evidência de
        quem conferiu e quando. Plano fora de PLANNED responde 409.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item]
              properties:
                item: {type: string, enum: [CONTAINER_INSPECTED, SEAL_TEST, GAS_SUPPLY]}
      responses:
        '200': {description: Item confirmado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /packaging/plans/{id}/reserve:
    post:
      operationId: reservePackagingPlan
      summary: "Verifica linha e limpeza e reserva a embalagem"
      description: >
        Todos os bloqueios vêm juntos na extensão `blockers` (checklist pendente, linha
        desativada, manutenção agendada, conflito de agenda, linha sem limpeza liberada), para
        o operador resolver tudo de uma vez. Falta de embalagem responde 409 com a extensão
        `shortfall` e nada é reservado. Tudo num commit: recusa não deixa efeito parcial.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Plano reservado
          content:
            application/json:
              schema:
                type: object
                required: [planId, reservedUnits, unit]
                properties:
                  planId: {type: string, format: uuid}
                  reservedUnits: {type: number}
                  unit: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: "Bloqueado (`blockers`) ou embalagem insuficiente (`shortfall`)"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/PackagingReserveProblem'}
  /packaging/plans/{id}/cancel:
    post:
      operationId: cancelPackagingPlan
      summary: "Cancela o plano e devolve a embalagem reservada"
      description: >
        Terminal: cancelar de novo responde 409. O motivo é obrigatório porque a devolução
        ao estoque é auditada. A linha volta a ficar livre para outro plano na mesma janela.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 200}
      responses:
        '200': {description: Plano cancelado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /packaging/plans/{id}/execution:
    get:
      operationId: getPackagingRun
      summary: Execução registrada do envase
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Execução
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackagingRun'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: executePackaging
      summary: "Registra o envase executado (unidades, volume e rejeitos)"
      description: >
        A perda NÃO é enviada: ela é derivada de `inputVolumeLiters − envasado − rejeitado`, e é
        assim que o balanço fecha por construção. Unidades que contêm mais cerveja do que saiu do
        tanque respondem 409 `volume_balance`; a soma das execuções acima do que o lote tem
        responde 409 `batch_volume_exceeded`. Rejeito consome embalagem igual às unidades boas.
        Só plano RESERVED executa, e executar é terminal — plano executado não é cancelável.


        A quarentena (FDS-002) é verificada **aqui também**, e não só na reserva: a investigação
        quase sempre começa depois que o plano foi reservado, e é justamente o envase que ela
        precisa impedir. Lote quarentenado responde 409 `packaging_blocked` com `quarantined` (ou
        `quarantine_suspected`, quando o caminho até o lote é uma reserva de insumo).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecutePackaging'}
      responses:
        '200':
          description: Envase registrado
          content:
            application/json:
              schema:
                type: object
                required: [runId, packagedVolumeLiters, lossesLiters, containersConsumed]
                properties:
                  runId: {type: string, format: uuid}
                  packagedVolumeLiters: {type: number}
                  lossesLiters: {type: number}
                  containersConsumed: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: "Balanço, volume do lote, estado do plano ou embalagem insuficiente"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/PackagingRunProblem'}
  /packaging/plans/{id}/carbonation:
    get:
      operationId: getCarbonation
      summary: Carbonatação decidida do plano
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Decisão vigente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Carbonation'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      operationId: recordCarbonation
      summary: "Grava a carbonatação do plano (exige confirmação humana)"
      description: >
        `confirmed` falso é recusado com 400: nenhum número calculado vira decisão sozinho.
        Recalcular substitui a decisão inteira — trocar de método não deixa resíduo do anterior.
        Priming sobre CO₂ que já atinge o alvo responde 409 `over_carbonation`, porque adicionar
        açúcar ali só gera pressão que a embalagem não comporta.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordCarbonation'}
      responses:
        '200': {description: Decisão gravada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: "Plano cancelado, ou CO₂ residual já atinge o alvo (`carbonation`)"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/OverCarbonationProblem'}
  /packaging/plans/{id}/carbonation/preview:
    get:
      operationId: previewCarbonation
      summary: "Calcula e explica a carbonatação sem gravar"
      description: >
        Recomendação com entradas normalizadas, CO₂ residual, o que falta dissolver, método,
        versão da fórmula, hipóteses e alertas. O volume de cerveja vem do próprio plano.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: method, in: query, required: true, schema: {type: string, enum: [PRIMING, FORCED]}}
        - {name: targetVolumes, in: query, required: true, schema: {type: number, exclusiveMinimum: 0}}
        - name: referenceTempC
          in: query
          required: true
          description: >
            No priming, a maior temperatura que a cerveja atingiu após a fermentação primária;
            na forçada, a temperatura em que o CO₂ será aplicado.
          schema: {type: number}
        - name: primingSugar
          in: query
          required: false
          description: Obrigatório quando o método é PRIMING
          schema: {type: string, enum: [SUCROSE, DEXTROSE_MONOHYDRATE, DRY_MALT_EXTRACT]}
      responses:
        '200':
          description: Recomendação
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CarbonationRecommendation'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /packaging/label-templates:
    get:
      operationId: listLabelTemplates
      summary: "Templates de rótulo (versão vigente de cada código)"
      responses:
        '200':
          description: Templates vigentes
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LabelTemplate'}}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      operationId: saveLabelTemplate
      summary: "Salva o template, criando uma versão nova"
      description: >
        Salvar ACRESCENTA uma versão e preserva a anterior — o rótulo impresso mês passado precisa
        continuar explicável. A ordem dos campos é o layout e é preservada. O template não decide
        obrigatoriedade: isso é a regra regulatória, que vive à parte.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaveLabelTemplate'}
      responses:
        '200':
          description: Versão criada
          content:
            application/json:
              schema:
                type: object
                required: [templateId, version]
                properties:
                  templateId: {type: string, format: uuid}
                  version: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /packaging/label-templates/{code}/versions:
    get:
      operationId: listLabelTemplateVersions
      summary: Histórico de versões de um template
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Versões, da mais recente para a mais antiga
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LabelTemplate'}}
        '403': {$ref: '#/components/responses/Problem'}
  /packaging/label-rule:
    get:
      operationId: getLabelRule
      summary: Regra regulatória do rótulo
      responses:
        '200':
          description: Campos obrigatórios
          content:
            application/json:
              schema:
                type: object
                required: [requiredFields]
                properties:
                  requiredFields: {type: array, items: {$ref: '#/components/schemas/LabelFieldCode'}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      operationId: saveLabelRule
      summary: Define quais campos do rótulo são obrigatórios
      description: >
        Vive SEPARADA do template de propósito: o layout muda quando o designer quer outra arte, mas
        a obrigatoriedade é lei e não pode sumir junto. Quais campos a lei exige depende do país e
        da categoria, então a lista é da cervejaria. Exige `packaging.policy.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requiredFields]
              properties:
                requiredFields:
                  type: array
                  minItems: 1
                  items: {$ref: '#/components/schemas/LabelFieldCode'}
      responses:
        '200': {description: Regra salva}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /packaging/plans/{id}/label/preview:
    get:
      operationId: previewLabel
      summary: "Prévia do rótulo: valores, origens e o que falta"
      description: >
        Nada no rótulo é digitado — cada campo é resolvido de uma fonte rastreável (lote de produção,
        plano de envase, receita publicada, controle de frescor) e cada linha traz a origem do valor.
        Campo obrigatório sem valor entra em `missingRequired`; campo obrigatório que o layout sequer
        desenha entra em `requiredNotDrawn`. Qualquer um dos dois deixa `printable` falso.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: templateId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Prévia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LabelPreview'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /packaging/plans/{id}/label/prints:
    get:
      operationId: listLabelPrints
      summary: Impressões do plano
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Impressões, da mais recente para a mais antiga
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LabelPrint'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: printLabel
      summary: Registra uma impressão de rótulos
      description: >
        A prévia é reavaliada na impressão: rótulo incompleto responde 409 `label_not_printable`.
        **Reimpressão não é escolha de quem chama** — já existindo impressão para o plano, a próxima
        é reimpressão e o motivo passa a ser obrigatório (400 sem ele). Cada tiragem guarda a versão
        do template usada, para o rótulo antigo continuar explicável depois do layout mudar.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId, quantity]
              properties:
                templateId: {type: string, format: uuid}
                quantity: {type: integer, minimum: 1}
                reason: {type: string, maxLength: 200, description: Obrigatório a partir da segunda tiragem}
      responses:
        '200':
          description: Impressão registrada
          content:
            application/json:
              schema:
                type: object
                required: [printId, reprint, quantity]
                properties:
                  printId: {type: string, format: uuid}
                  reprint: {type: boolean}
                  quantity: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: "Rótulo incompleto (`label`) ou regra regulatória ausente"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/LabelNotPrintableProblem'}
  /packaging/shelf-life-policy:
    get:
      operationId: getShelfLifePolicy
      summary: Política de vida útil da cervejaria
      responses:
        '200':
          description: Faixas de TPO e os dias que sustentam
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShelfLifePolicy'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      operationId: saveShelfLifePolicy
      summary: Configura as faixas de TPO e a validade que cada uma sustenta
      description: >
        Os números vêm da cervejaria, não do sistema: TPO é o que mais empurra o envelhecimento,
        mas traduzir ppb em dias depende do estilo, da estocagem e do padrão de frescor da casa.
        Uma faixa mais suja não pode prometer mais dias que uma mais limpa (400), e o pior caso
        não pode render mais que a última faixa. Exige `packaging.policy.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShelfLifePolicy'}
      responses:
        '200': {description: Política salva}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /packaging/plans/{id}/freshness:
    get:
      operationId: getFreshness
      summary: Oxigênio e validade do envase
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Evidência, recomendação e override lado a lado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Freshness'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      operationId: recordFreshness
      summary: "Registra DO/TPO, purga e vedação, e recomenda a validade"
      description: >
        O TPO medido é confrontado com as faixas da política da casa, e a recomendação sai
        explicada — qual faixa pegou, quanto do oxigênio veio do espaço livre, se a purga foi
        conferida e se a vedação passou. Purga não conferida e vedação reprovada NÃO mudam o
        número: viram ressalvas (`caveats`), porque evidência incompleta reduz a confiança, não a
        validade. Sem política configurada a medição é gravada e `recommendation` vem nulo.
        Só plano com envase executado aceita medição (409); TPO abaixo do DO responde 400.
        Remedir substitui o registro e derruba um override anterior — a evidência mudou.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordFreshness'}
      responses:
        '200':
          description: Evidência gravada e recomendação explicada
          content:
            application/json:
              schema:
                type: object
                required: [freshness]
                properties:
                  freshness: {$ref: '#/components/schemas/Freshness'}
                  recommendation:
                    allOf: [{$ref: '#/components/schemas/ShelfLifeRecommendation'}]
                    nullable: true
                    description: Nulo quando a cervejaria não tem política de vida útil
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /packaging/plans/{id}/freshness/override:
    post:
      operationId: overrideShelfLife
      summary: Sobrepõe a validade recomendada
      description: >
        O motivo é obrigatório: é ele que explica, depois, uma data que a evidência não sustentava.
        O recomendado NUNCA é apagado — os dois ficam lado a lado, e o override é auditado com
        quem, quando, por quê e se estende além do recomendado.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shelfLifeDays, reason]
              properties:
                shelfLifeDays: {type: integer, minimum: 1}
                reason: {type: string, maxLength: 200}
      responses:
        '200': {description: Validade sobreposta}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /gas/cylinders:
    get:
      operationId: listGasCylinders
      summary: Lista cilindros de gás
      responses:
        '200':
          description: Cilindros
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/GasCylinder'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: registerGasCylinder
      summary: Cadastra um cilindro
      description: >
        O conteúdo é rastreado por massa, não por pressão: em cilindro de CO₂ com fase líquida o
        manômetro fica praticamente constante enquanto houver líquido. Cilindro cadastrado sem
        gás nasce vazio.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterGasCylinder'}
      responses:
        '201': {description: Cilindro cadastrado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /gas/cylinders/{id}:
    get:
      operationId: getGasCylinder
      summary: Cilindro com aptidão para alocação
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Cilindro
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GasCylinder'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /gas/cylinders/{id}/block:
    post:
      operationId: setGasCylinderBlock
      summary: Bloqueia ou desbloqueia o cilindro
      description: >
        Bloquear exige motivo e o cilindro precisa estar desconectado (409). Desbloquear NÃO
        requalifica: um cilindro com requalificação vencida continua sem poder ser alocado.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked]
              properties:
                blocked: {type: boolean}
                reason: {type: string, maxLength: 200, description: "Obrigatório ao bloquear"}
      responses:
        '200': {description: Situação atualizada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /gas/cylinders/{id}/requalification:
    post:
      operationId: requalifyGasCylinder
      summary: Registra nova requalificação do cilindro
      description: "O vencimento precisa ser futuro (400); não altera bloqueio nem conteúdo."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dueOn]
              properties:
                dueOn: {type: string, format: date}
      responses:
        '200': {description: Requalificação registrada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /gas/cylinders/{id}/refill:
    post:
      operationId: refillGasCylinder
      summary: Recarrega o cilindro com a massa aferida
      description: "Cilindro conectado ou bloqueado não é recarregado (409); a massa não passa da capacidade (400)."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentKg]
              properties:
                contentKg: {type: number, minimum: 0}
      responses:
        '200': {description: Cilindro recarregado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /gas/components:
    get:
      operationId: listGasComponents
      summary: Lista reguladores e manifolds
      parameters:
        - name: kind
          in: query
          required: false
          schema: {type: string, enum: [REGULATOR, MANIFOLD]}
      responses:
        '200':
          description: Componentes da rede
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/GasComponent'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: registerGasComponent
      summary: Cadastra regulador ou manifold
      description: >
        Regulador nunca é ajustado acima da própria pressão máxima; manifold não tem pressão
        ajustada (400 nos dois casos).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterGasComponent'}
      responses:
        '201': {description: Componente cadastrado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /gas/components/{id}:
    put:
      operationId: updateGasComponent
      summary: Atualiza nome e pressões do componente
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, maxPressureBar]
              properties:
                name: {type: string, maxLength: 120}
                maxPressureBar: {type: number, exclusiveMinimum: 0}
                setPressureBar: {type: number, nullable: true}
      responses:
        '200': {description: Componente atualizado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /gas/components/{id}/active:
    post:
      operationId: setGasComponentActive
      summary: Ativa ou desativa o componente
      description: "Componente desativado vira impedimento na conexão, não erro silencioso."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: {type: boolean}
      responses:
        '200': {description: Situação atualizada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /gas/connections:
    get:
      operationId: listGasConnections
      summary: Lista conexões de gás
      parameters:
        - name: onlyOpen
          in: query
          required: false
          description: "true exclui as desconectadas"
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Conexões
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/GasConnection'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: connectGas
      summary: "Monta a linha: cilindro → regulador → (manifold) → ponto de uso"
      description: >
        A recusa lista todos os impedimentos na extensão `blockers` (cilindro vencido, bloqueado,
        vazio ou em uso; regulador/manifold inexistente ou desativado; ponto ocupado; pressão de
        trabalho acima do teto da rede). O teto da rede é o menor limite entre os componentes e
        fica congelado na conexão. A linha nasce em PENDING_TEST e não serve antes do teste
        de vazamento aprovado.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectGas'}
      responses:
        '201': {description: "Linha montada, pendente de teste de vazamento"}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: "Impedimentos da conexão (`blockers`)"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/GasConnectionProblem'}
  /gas/connections/{id}:
    get:
      operationId: getGasConnection
      summary: Conexão com leituras de pressão e consumo
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Conexão detalhada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GasConnectionDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /gas/connections/{id}/leak-test:
    post:
      operationId: recordGasLeakTest
      summary: Registra o teste de vazamento da linha
      description: >
        É o teste aprovado que libera a linha para servir; reprovado a bloqueia e exige
        observação (400 sem ela). Linha bloqueada só volta a servir com um novo teste aprovado.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GasLeakTest'}
      responses:
        '200': {description: Teste registrado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /gas/connections/{id}/pressure:
    post:
      operationId: recordGasPressure
      summary: Registra a pressão medida na linha
      description: >
        A medição é evidência e é preservada mesmo quando denuncia sobrepressão. Leitura acima do
        teto da rede marca `overPressure` e leva a conexão para BLOCKED — só um novo teste de
        vazamento aprovado devolve a linha ao serviço. Conexão que não está servindo responde 409.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bar]
              properties:
                bar: {type: number, exclusiveMinimum: 0}
                tempC: {type: number, nullable: true}
      responses:
        '200':
          description: Leitura registrada
          content:
            application/json:
              schema:
                type: object
                required: [readingId, overPressure, status]
                properties:
                  readingId: {type: string, format: uuid}
                  overPressure: {type: boolean}
                  status: {type: string, enum: [SERVING, BLOCKED]}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /gas/connections/{id}/consumption:
    post:
      operationId: recordGasConsumption
      summary: Registra consumo de gás da linha
      description: >
        Só linha servindo consome (409). Consumir mais do que há no cilindro é erro de registro
        (400), não saldo negativo.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kg]
              properties:
                kg: {type: number, exclusiveMinimum: 0}
                reason: {type: string, maxLength: 200}
      responses:
        '200': {description: Consumo registrado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /gas/connections/{id}/disconnect:
    post:
      operationId: disconnectGas
      summary: Desconecta a linha e devolve o cilindro
      description: "Terminal (409 ao repetir). O cilindro volta a AVAILABLE, ou EMPTY se acabou o gás."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 200}
      responses:
        '200': {description: Linha desconectada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /gas/tubing:
    get:
      operationId: listGasTubing
      summary: Catálogo de tubos de serviço
      responses:
        '200':
          description: Tubos com resistência e vazão de referência
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/GasTubing'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: registerGasTubing
      summary: Cadastra ou atualiza um tubo do catálogo
      description: >
        Os números vêm da ficha do fabricante, não do sistema. Material e diâmetro interno são a
        identidade do tubo: recadastrar a mesma combinação só atualiza resistência e vazão de
        referência. A vazão de referência fica ao lado da resistência porque é ela que permite
        escalar corretamente para outra vazão.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterGasTubing'}
      responses:
        '201': {description: Tubo cadastrado ou atualizado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /gas/service-lines:
    get:
      operationId: listServiceLines
      summary: Lista linhas de serviço
      responses:
        '200':
          description: Linhas de serviço
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ServiceLine'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: registerServiceLine
      summary: Cadastra uma linha de serviço num ponto de uso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, pointOfUseEquipmentId]
              properties:
                code: {type: string, maxLength: 40}
                name: {type: string, maxLength: 120}
                pointOfUseEquipmentId: {type: string, format: uuid}
      responses:
        '201': {description: "Linha cadastrada, ainda sem montagem aplicada"}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /gas/service-lines/{id}:
    get:
      operationId: getServiceLine
      summary: Linha de serviço com o histórico de montagens
      description: "A revisão anterior é preservada: ela explica a cerveja servida ontem."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Linha e revisões, da mais recente para a mais antiga
          content:
            application/json:
              schema:
                type: object
                required: [line, revisions]
                properties:
                  line: {$ref: '#/components/schemas/ServiceLine'}
                  revisions:
                    type: array
                    items: {$ref: '#/components/schemas/ServiceLineRevision'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /gas/service-lines/{id}/balance:
    get:
      operationId: balanceServiceLine
      summary: "Calcula o balanceamento da linha (recomendação, nada é aplicado)"
      description: >
        A pressão de serviço NÃO é escolha livre: ela sai do equilíbrio de carbonatação na
        temperatura informada — servir a outra pressão faz o barril ganhar ou perder CO₂ ao longo
        do tempo. O que sobra dela, depois de vencer o desnível e a pressão residual da torneira, é
        o que a linha dissipa por atrito. A vazão escala a resistência (escoamento laminar).
        O resultado é recomendação: **nenhuma válvula ou regulador é ajustado pelo sistema**, e
        todo retorno traz o aviso `manual_adjustment_only`. Montagem impossível vem com
        `feasible: false` e `no_balance_possible`; pressão acima do teto da rede de gás do ponto vem
        com `above_network_limit`.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: targetCo2Volumes, in: query, required: true, schema: {type: number, exclusiveMinimum: 0}}
        - {name: servingTempC, in: query, required: true, schema: {type: number}}
        - name: elevationMeters
          in: query
          required: true
          description: "Positivo = torneira acima do barril; pode ser negativo"
          schema: {type: number}
        - {name: residualPressureBar, in: query, required: true, schema: {type: number, minimum: 0}}
        - {name: targetFlowLpm, in: query, required: true, schema: {type: number, exclusiveMinimum: 0}}
        - {name: resistanceId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Recomendação com método, limites e avisos de segurança
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineBalance'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /gas/service-lines/{id}/revisions:
    post:
      operationId: applyServiceLineRevision
      summary: "Aplica a montagem à linha, gerando uma revisão"
      description: >
        Acrescenta uma revisão e preserva a anterior — a montagem física de ontem é a única
        evidência de por que a cerveja de ontem saiu como saiu. O comprimento montado pode divergir
        do recomendado; o desvio é registrado em vez de corrigido.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplyServiceLineRevision'}
      responses:
        '200':
          description: Revisão aplicada
          content:
            application/json:
              schema:
                type: object
                required: [revision, recommendedLengthMeters, lengthDeviationMeters]
                properties:
                  revision: {type: integer}
                  recommendedLengthMeters: {type: number}
                  lengthDeviationMeters: {type: number}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /metrology/instruments:
    get:
      tags: [Metrologia]
      summary: Lista instrumentos com a aptidão derivada na data da consulta (MTR-001)
      responses:
        '200':
          description: Instrumentos
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Instrument'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Metrologia]
      summary: Cadastra instrumento com faixa, resolução e precisão
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterInstrument'}
      responses:
        '201':
          description: Instrumento cadastrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instrument'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /metrology/instruments/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Metrologia]
      summary: Instrumento
      responses:
        '200':
          description: Instrumento
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instrument'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Metrologia]
      summary: Corrige o cadastro; mudar a faixa de instrumento crítico é recusado
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AmendInstrument'}
      responses:
        '200':
          description: Instrumento atualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instrument'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /metrology/instruments/{id}/block:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Metrologia]
      summary: Bloqueia o instrumento; exige motivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 200}
      responses:
        '200':
          description: Instrumento bloqueado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instrument'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /metrology/instruments/{id}/unblock:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Metrologia]
      summary: Desbloqueia o instrumento
      responses:
        '200':
          description: Instrumento desbloqueado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instrument'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /metrology/instruments/{id}/retire:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Metrologia]
      summary: Baixa do parque; estado terminal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 200}
      responses:
        '200':
          description: Instrumento baixado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instrument'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /metrology/instruments/{id}/critical-use:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Metrologia]
      summary: Designa uso em ponto crítico; designar exige instrumento apto
      description: >-
        Instrumento vencido, reprovado, bloqueado ou sem calibração é recusado com 409
        `instrument_not_fit`, trazendo a aptidão e o vencimento na extensão `instrument`.
        Remover a designação é sempre permitido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [criticalUse]
              properties:
                criticalUse: {type: boolean}
      responses:
        '200':
          description: Designação alterada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instrument'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /metrology/instruments/{id}/calibrations:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Metrologia]
      summary: Histórico de certificados, do mais recente ao mais antigo
      description: Histórico imutável — vencer não apaga certificado.
      responses:
        '200':
          description: Certificados
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Calibration'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Metrologia]
      summary: Registra certificado de calibração
      description: >-
        O vencimento vem do certificado, não de regra fixa de meses. Padrão fora da validade na
        data de execução é recusado com 409 `standard_expired`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordCalibration'}
      responses:
        '201':
          description: Calibração registrada; devolve o instrumento com a aptidão recalculada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instrument'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /metrology/standards:
    get:
      tags: [Metrologia]
      summary: Padrões de referência, marcando os vencidos
      responses:
        '200':
          description: Padrões
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CalibrationStandard'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Metrologia]
      summary: Cadastra padrão de referência
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterStandard'}
      responses:
        '201':
          description: Padrão cadastrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalibrationStandard'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /metrology/standards/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Metrologia]
      summary: Renova o certificado do padrão
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenewStandard'}
      responses:
        '200':
          description: Padrão renovado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalibrationStandard'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /metrology/corrections:
    get:
      tags: [Metrologia]
      summary: Correções aplicadas a um instrumento (MTR-002)
      parameters:
        - {name: instrumentId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Correções, da mais recente para a mais antiga
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ReadingCorrection'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Metrologia]
      summary: Corrige uma leitura sem alterar o valor bruto
      description: >-
        Dois passos independentes: temperatura, pelo hub `calculator`, e a curva do certificado.
        Ao menos um precisa se aplicar. Não há endpoint de alteração — corrigir de novo cria outro
        registro, porque o bruto e o histórico de como o número foi obtido são imutáveis.
        Leitura fora da faixa conferida pelo certificado é recusada com 409 `outside_curve_range`
        em vez de extrapolada. Instrumento fora de aptidão não impede a correção: entra como
        ressalva e derruba `trustworthy`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CorrectReading'}
      responses:
        '201':
          description: Correção registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadingCorrection'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/control-plans:
    get:
      tags: [Qualidade]
      summary: Planos de controle (QLT-001)
      responses:
        '200':
          description: Planos
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ControlPlan'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Qualidade]
      summary: Cria plano como rascunho
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateControlPlan'}
      responses:
        '201':
          description: Plano criado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlPlan'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/control-plans/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Qualidade]
      summary: Plano de controle
      responses:
        '200':
          description: Plano
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlPlan'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Qualidade]
      summary: Corrige o rascunho; publicado é imutável
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AmendControlPlan'}
      responses:
        '200':
          description: Plano atualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlPlan'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/control-plans/{id}/points:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Qualidade]
      summary: Inclui ponto de controle no rascunho
      description: >-
        Ao menos um limite (mínimo ou máximo). Limite unilateral é caso normal — "O₂ ≤ 50 ppb" não
        tem piso. A ação é obrigatória: ponto sem ação é observação, não controle.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddControlPoint'}
      responses:
        '201':
          description: Ponto incluído; devolve o plano
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlPlan'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/control-plans/{id}/points/{pointId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: pointId, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [Qualidade]
      summary: Remove ponto do rascunho
      responses:
        '200':
          description: Ponto removido
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlPlan'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/control-plans/{id}/publish:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Qualidade]
      summary: Publica o plano, congelando a versão
      description: Plano sem ponto não publica. A partir daqui ele julga medição e não muda mais.
      responses:
        '200':
          description: Plano publicado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlPlan'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/control-plans/{id}/new-version:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Qualidade]
      summary: Nova versão a partir de uma publicada
      description: >-
        Os pontos são copiados com identidade nova, para que medições antigas continuem
        referenciando os limites da versão que as julgou.
      responses:
        '201':
          description: Rascunho da versão seguinte
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlPlan'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/control-plans/{id}/measurements:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Qualidade]
      summary: Medições do plano, da mais recente para a mais antiga
      responses:
        '200':
          description: Medições
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/QualityMeasurement'}}
        '403': {$ref: '#/components/responses/Problem'}
  /quality/measurements:
    post:
      tags: [Qualidade]
      summary: Registra medição contra um ponto do plano
      description: >-
        Fora da faixa abre desvio com a severidade do ponto, devolvido na mesma resposta com a ação
        prescrita. Rascunho não julga (409 `plan_not_published`). Ponto crítico exige instrumento
        apto, verificado pela porta publicada da metrologia (409 `instrument_not_fit`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordQualityMeasurement'}
      responses:
        '201':
          description: Medição registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeasurementOutcome'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/deviations:
    get:
      tags: [Qualidade]
      summary: Desvios em aberto, dos mais severos e recentes primeiro
      responses:
        '200':
          description: Desvios
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Deviation'}}
        '403': {$ref: '#/components/responses/Problem'}
  /quality/non-conformities:
    get:
      tags: [Qualidade]
      summary: Não conformidades e o tratamento (QLT-002)
      responses:
        '200':
          description: Não conformidades
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/NonConformity'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Qualidade]
      summary: Abre não conformidade
      description: >-
        Desvio é só uma das origens — NC também nasce de reclamação, auditoria e fornecedor.
        Origem `DEVIATION` exige apontar um desvio existente. Os prazos seguem a ordem das fases.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenNonConformity'}
      responses:
        '201':
          description: Não conformidade aberta
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NonConformity'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/non-conformities/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Qualidade]
      summary: Não conformidade
      responses:
        '200':
          description: Não conformidade
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NonConformity'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /quality/non-conformities/{id}/containment:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Qualidade]
      summary: Registra a contenção — o que se fez de imediato
      description: Primeira fase; fora de ordem responde 409 `nc_phase_out_of_order`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: {type: string, maxLength: 1000}
      responses:
        '200':
          description: Contida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NonConformity'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/non-conformities/{id}/investigation:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Qualidade]
      summary: Registra causa raiz e método
      description: Exige contenção registrada. O método é obrigatório junto da causa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rootCause, method]
              properties:
                rootCause: {type: string, maxLength: 1000}
                method: {type: string, maxLength: 200}
      responses:
        '200':
          description: Investigada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NonConformity'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/non-conformities/{id}/actions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Qualidade]
      summary: Planeja ação corretiva ou preventiva
      description: >-
        Exige investigação registrada. Corretiva trata a ocorrência; preventiva trata a causa.
        Aceito também depois de uma verificação ineficaz, que é quando ação nova precisa existir.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanCapaAction'}
      responses:
        '201':
          description: Ação planejada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NonConformity'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/non-conformities/{id}/actions/{actionId}/complete:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: actionId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Qualidade]
      summary: Conclui uma ação
      responses:
        '200':
          description: Ação concluída
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NonConformity'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/non-conformities/{id}/verification:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Qualidade]
      summary: Verifica a eficácia da ação
      description: >-
        Exige ao menos uma ação concluída. Resultado **ineficaz devolve à fase de ação** em vez de
        permitir encerrar: fechar com verificação negativa registraria uma solução que não existiu.
        A evidência é obrigatória nos dois resultados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effective, evidence]
              properties:
                effective: {type: boolean}
                evidence: {type: string, maxLength: 1000}
      responses:
        '200':
          description: Verificação registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NonConformity'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quality/non-conformities/{id}/close:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Qualidade]
      summary: Encerra a não conformidade
      description: >-
        Exige verificação eficaz (409 `verification_required`). Encerra também o desvio que a
        originou, fechando o ciclo aberto em QLT-001. Alçada própria (`quality.nc.close`).
      responses:
        '200':
          description: Encerrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NonConformity'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sensory/sessions:
    get:
      tags: [Sensorial]
      summary: Sessões sensoriais (SEN-001)
      responses:
        '200':
          description: Sessões
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SensorySession'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Sensorial]
      summary: Cria sessão como rascunho
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSensorySession'}
      responses:
        '201':
          description: Sessão criada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorySession'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sensory/sessions/attributes:
    get:
      tags: [Sensorial]
      summary: Atributos da ficha e seus rótulos
      responses:
        '200':
          description: Atributos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: {$ref: '#/components/schemas/SensoryAttribute'}
                    label: {type: string}
        '403': {$ref: '#/components/responses/Problem'}
  /sensory/sessions/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Sensorial]
      summary: Sessão
      description: >-
        As amostras saem **sem o lote** enquanto a sessão não é encerrada — a cegueira é garantida
        na resposta, não na tela.
      responses:
        '200':
          description: Sessão
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorySession'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Sensorial]
      summary: Corrige o rascunho
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, scheduledFor]
              properties:
                purpose: {type: string, maxLength: 200}
                scheduledFor: {type: string, format: date}
      responses:
        '200':
          description: Sessão atualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorySession'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sensory/sessions/{id}/samples:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Sensorial]
      summary: Acrescenta amostra com código cego sorteado pelo sistema
      description: >-
        O código cego **não vem do cliente**: é sorteado com três dígitos aleatórios, porque código
        sequencial vazaria a ordem de preparo. O mesmo lote pode entrar mais de uma vez — duplicata
        cega mede a consistência do painel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId]
              properties:
                batchId: {type: string, format: uuid}
                note: {type: string, maxLength: 500, nullable: true}
      responses:
        '201':
          description: Amostra incluída
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorySession'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sensory/sessions/{id}/samples/{sampleId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: sampleId, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [Sensorial]
      summary: Remove amostra do rascunho
      responses:
        '200':
          description: Amostra removida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorySession'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sensory/sessions/{id}/open:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Sensorial]
      summary: Abre a sessão para o painel
      description: Sessão sem amostra não abre.
      responses:
        '200':
          description: Sessão aberta
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorySession'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sensory/sessions/{id}/close:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Sensorial]
      summary: Encerra a sessão e revela o resultado
      responses:
        '200':
          description: Sessão encerrada; as amostras passam a trazer o lote
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorySession'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sensory/sessions/{id}/evaluations:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Sensorial]
      summary: Envia a ficha do provador
      description: >-
        Só com a sessão aberta (409 `session_not_open`) e uma ficha por provador e amostra (409
        `already_evaluated`). A ficha é **imutável**: não há endpoint de alteração, porque bastaria
        esperar o fechamento, ver o resultado e reescrevê-la.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitSensoryEvaluation'}
      responses:
        '201':
          description: Ficha registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorySession'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sensory/sessions/{id}/results:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Sensorial]
      summary: Resultado consolidado
      description: >-
        Recusado com 409 `results_not_available` enquanto a sessão não é encerrada — é o critério
        da história. Ver a nota alheia antes de dar a sua faz o painel convergir por contágio.
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensoryResults'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sanitation/cleaning-policy:
    get:
      tags: [Limpeza e sanitização]
      summary: Política de limpeza da cervejaria (PRM-001)
      responses:
        '200':
          description: Política
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CleaningPolicy'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Limpeza e sanitização]
      summary: Ajusta a validade da liberação de CIP
      description: >-
        `validityHours` nulo remove o prazo e a liberação volta a **não expirar por tempo** — que é
        o comportamento anterior à PRM-001. Fecha o débito PKG-001-A.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                validityHours: {type: integer, minimum: 1, maximum: 8760, nullable: true}
      responses:
        '200':
          description: Política ajustada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CleaningPolicy'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /gas/policy:
    get:
      tags: [Gases e rede de CO₂]
      summary: Política de gases (PRM-001)
      responses:
        '200':
          description: Política
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GasPolicy'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Gases e rede de CO₂]
      summary: Ajusta a periodicidade de requalificação
      description: >-
        Com periodicidade, requalificar sem informar data deriva o vencimento; a data informada
        sempre vence sobre a política. Nulo volta a exigir a data. Fecha o débito GAS-001-B.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requalificationMonths: {type: integer, minimum: 1, maximum: 240, nullable: true}
      responses:
        '200':
          description: Política ajustada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GasPolicy'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /metrology/calibration-policy:
    get:
      tags: [Metrologia]
      summary: Periodicidade de calibração por tipo (PRM-001)
      responses:
        '200':
          description: Política
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalibrationPolicy'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Metrologia]
      summary: Substitui a política inteira
      description: >-
        Tipo fora do mapa deixa de ter periodicidade e o vencimento volta a vir do certificado.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalibrationPolicy'}
      responses:
        '200':
          description: Política ajustada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalibrationPolicy'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /quality/capa-policy:
    get:
      tags: [Qualidade]
      summary: Prazos do CAPA por severidade (PRM-001)
      responses:
        '200':
          description: Política
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapaPolicy'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Qualidade]
      summary: Substitui a política inteira
      description: >-
        Severidade fora do mapa volta a exigir prazos informados na abertura da não conformidade.
        Os prazos seguem a ordem das fases. Fecha o débito QLT-002-A.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CapaPolicy'}
      responses:
        '200':
          description: Política ajustada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapaPolicy'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /sensory/policy:
    get:
      tags: [Sensorial]
      summary: Escala da ficha sensorial (PRM-001)
      responses:
        '200':
          description: Política
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensoryPolicy'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Sensorial]
      summary: Ajusta a escala da ficha
      description: >-
        A escala é **congelada em cada sessão** quando ela é criada: mudar o parâmetro não
        reinterpreta sessão nenhuma. Uma nota 8 dada numa sessão de escala 10 não vira 8 de 50.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [maxScore]
              properties:
                maxScore: {type: integer, minimum: 3, maximum: 100}
      responses:
        '200':
          description: Política ajustada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensoryPolicy'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /packaging/finished-lots:
    get:
      tags: [Envase]
      summary: Lotes de produto acabado (TRC-001-B)
      description: >-
        O que saiu da linha, identificado — o objeto que um recall recolhe. Nasce automaticamente da
        execução do envase, no mesmo commit: **não há comando de criação**, porque criar um à mão
        seria afirmar que existe cerveja envasada que nenhuma execução registrou.


        `units` conta **apenas as unidades boas**: rejeito consumiu embalagem e não virou produto.
        A validade não vive aqui — ela vem da evidência de oxigênio (FSL-001), por plano, e pode ser
        sobreposta com justificativa; duplicá-la criaria uma segunda verdade.
      parameters:
        - {name: batchId, in: query, required: false, schema: {type: string, format: uuid},
           description: "Filtra pelos lotes de produto acabado de um lote de produção."}
      responses:
        '200':
          description: Lotes de produto acabado
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FinishedLot'}}
        '403': {$ref: '#/components/responses/Problem'}
  /traceability/genealogy:
    get:
      tags: [Rastreabilidade]
      summary: Genealogia de um nó (TRC-001)
      description: >-
        Grafo derivado das ligações que cada módulo já registra: insumo reservado, ordem, lote,
        coleta de levedura, plano e execução de envase. **Nada é materializado** — o grafo é lido
        na hora, porque uma cópia envelheceria a cada envase.


        Duas leituras que a resposta obriga a fazer. `strength` distingue `CONFIRMED` (fato
        registrado) de `INTENDED` (intenção — a reserva de insumo diz qual lote foi separado para a
        OP, não qual foi ao moinho). E `gaps` lista os elos que **deveriam existir e não existem**,
        com o motivo: hoje são o blend de lotes (TRC-001-A), o lote de produto acabado e seu destino
        (TRC-001-B) e o consumo de insumo por lote no dia de brassa (TRC-001-C).


        `truncated` avisa que o corte de profundidade escondeu parte do grafo. Num recall, um
        resultado que parece completo sem ser é pior do que um resultado declaradamente parcial.
      parameters:
        - {name: nodeType, in: query, required: true,
           schema: {type: string, enum: [STOCK_LOT, BREW_ORDER, BATCH, YEAST_HARVEST, PACKAGING_PLAN, PACKAGING_RUN, FINISHED_LOT, SHIPMENT]}}
        - {name: nodeId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: direction, in: query, required: false,
           description: "BACKWARD responde de onde veio; FORWARD, para onde foi.",
           schema: {type: string, enum: [BACKWARD, FORWARD, BOTH], default: BOTH}}
        - {name: depth, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10, default: 6}}
      responses:
        '200':
          description: Genealogia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Genealogy'}
        '400':
          description: "`depth_exceeded` — profundidade acima do teto de 10 saltos"
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_node` — o nó não existe nesta cervejaria. Não é o mesmo que um nó sem elos."
          content:
            application/problem+json:
              schema: {type: object}
  /food-safety/allergens:
    get:
      tags: [Segurança de alimentos]
      summary: Vocabulário de alergênicos da cervejaria (FDS-001)
      description: >-
        A lista é **da casa**, não da plataforma. Embutir uma relação regulatória no código seria
        congelar uma norma que muda e difere por país, e quem responde por ela é quem assina o
        rótulo. Enquanto a cervejaria não cadastra nenhum alergênico, a matriz não está em uso e a
        troca de produto não é avaliada — mesmo princípio da validade do CIP (PRM-001).
      responses:
        '200':
          description: Alergênicos cadastrados
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Allergen'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Segurança de alimentos]
      summary: Cadastrar alergênico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: {type: string, maxLength: 40, description: "Normalizado em caixa alta; GLUTEN e gluten são o mesmo."}
                name: {type: string, maxLength: 120, description: "O nome vai impresso no rótulo."}
      responses:
        '201':
          description: Alergênico cadastrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allergen'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /food-safety/matrix:
    get:
      tags: [Segurança de alimentos]
      summary: Matriz de alergênicos (FDS-001)
      description: >-
        Os três eixos numa leitura só — ingrediente, equipamento e POP —, porque é assim que a
        matriz é usada: ninguém confere um ingrediente isolado, confere o cruzamento. Em
        `ingredients`, `declared` distingue **declarado isento** (declarado, sem alergênico) de
        **não declarado** (ninguém respondeu). Tratar o segundo como o primeiro é o erro que
        imprime "não contém glúten" numa cerveja de cevada.
      responses:
        '200':
          description: Matriz
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AllergenMatrix'}
        '403': {$ref: '#/components/responses/Problem'}
  /food-safety/ingredients/{ingredientId}/allergens:
    put:
      tags: [Segurança de alimentos]
      summary: Declarar alergênicos de um ingrediente
      description: >-
        Declarar é responder **por inteiro**: a lista enviada passa a ser a vigente, e lista vazia
        é a afirmação "declarado isento". Sem esse comando, "tirei o glúten deste insumo" não teria
        como ser dito, e a matriz só cresceria.
      parameters:
        - {name: ingredientId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AllergenDeclarationRequest'}
      responses:
        '200': {description: Declaração registrada}
        '400':
          description: "`unknown_allergen` — código fora do vocabulário da cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
  /food-safety/equipment/{equipmentId}/dedication:
    put:
      tags: [Segurança de alimentos]
      summary: Declarar equipamento dedicado
      description: >-
        Equipamento é **compartilhado por omissão** — é o estado natural de quase toda cervejaria, e
        é o que torna a troca de produto uma decisão de segurança. Declarar dedicação afirma o
        contrário. Lista vazia é a linha *livre de alergênicos*, a mais restritiva que existe:
        nenhum POP a resgata, porque ali a garantia é o alergênico nunca ter entrado.
      parameters:
        - {name: equipmentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AllergenDeclarationRequest'}
      responses:
        '200': {description: Dedicação registrada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Segurança de alimentos]
      summary: Devolver o equipamento ao compartilhado
      parameters:
        - {name: equipmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Dedicação removida}
        '403': {$ref: '#/components/responses/Problem'}
  /food-safety/procedures/{procedureCode}/allergens:
    put:
      tags: [Segurança de alimentos]
      summary: Declarar o que um POP remove
      description: >-
        Eficácia declarada do procedimento de limpeza. Referencia o POP por **código**, não por
        versão, pelo mesmo motivo da matriz de compatibilidade (CLN-002): a eficácia é do
        procedimento, não da revisão do texto. Sem declaração, o POP limpa sujidade e não responde
        por alergênico — que é o padrão até alguém afirmar o contrário.
      parameters:
        - {name: procedureCode, in: path, required: true, schema: {type: string, maxLength: 40}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AllergenDeclarationRequest'}
      responses:
        '200': {description: Eficácia registrada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /food-safety/batches/{batchId}/allergens:
    get:
      tags: [Segurança de alimentos]
      summary: Perfil de alergênicos de um lote (FDS-001)
      description: >-
        **Derivado**, não guardado: é a soma das declarações dos ingredientes da receita publicada
        do lote, lida no momento da pergunta. Materializá-lo criaria uma segunda verdade que
        continuaria dizendo "isento" depois de alguém declarar o alergênico do malte — o mesmo
        motivo pelo qual a genealogia (TRC-001) também é derivada.


        `complete` é o campo que decide: só um perfil completo autoriza afirmar o que a cerveja
        contém — ou não contém. É ele que libera o campo de alergênicos no rótulo (PKG-004).
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AllergenProfile'}
        '403': {$ref: '#/components/responses/Problem'}
  /food-safety/changeover:
    get:
      tags: [Segurança de alimentos]
      summary: Avaliar troca de produto num equipamento (FDS-001)
      description: >-
        Responde se o produto que entra pode ocupar o equipamento depois do que saiu. O envase já
        recusa a reserva insegura por conta própria (PKG-001); esta consulta existe para perguntar
        **antes**, que é quando ainda dá para escolher outra linha ou outro POP.


        A carga residual é a **diferença** entre os perfis, não o perfil anterior: se os dois lados
        têm o mesmo alergênico, não há troca a fazer, e POP exigido sem motivo é POP que se aprende
        a ignorar. Quem sabe qual foi o uso anterior é quem agenda, por isso ele é parâmetro.
      parameters:
        - {name: equipmentId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: incomingBatchId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: previousBatchId, in: query, required: false, schema: {type: string, format: uuid},
           description: "Ausente quando não houve uso anterior: equipamento novo não tem o que trocar."}
        - {name: previousUseAt, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: at, in: query, required: false, schema: {type: string, format: date-time},
           description: "Instante de referência; padrão é agora."}
      responses:
        '200':
          description: Veredito
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeoverVerdict'}
        '403': {$ref: '#/components/responses/Problem'}
  /traceability/quarantines:
    get:
      tags: [Rastreabilidade]
      summary: Quarentenas da cervejaria (FDS-002)
      parameters:
        - {name: onlyOpen, in: query, required: false, schema: {type: boolean, default: false},
           description: "Liberar não apaga: a quarentena encerrada continua legível."}
      responses:
        '200':
          description: Quarentenas
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Quarantine'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Rastreabilidade]
      summary: Abrir quarentena
      description: >-
        Bloqueia o nó e **tudo o que descende dele**, sem que ninguém precise bloquear os
        descendentes: o alcance é derivado do grafo no momento de cada pergunta. Um envase criado
        depois da abertura já nasce bloqueado — uma lista de descendentes congelada na abertura não
        o conheceria, e contenção que envelhece é contenção furada.


        Uma quarentena aberta por nó: a segunda partiria a investigação em duas, e liberar uma delas
        daria a impressão de que o lote foi liberado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeType, nodeId, reason]
              properties:
                nodeType:
                  type: string
                  enum: [STOCK_LOT, BREW_ORDER, BATCH, YEAST_HARVEST, PACKAGING_PLAN, PACKAGING_RUN, FINISHED_LOT, SHIPMENT]
                nodeId: {type: string, format: uuid}
                reason: {type: string, maxLength: 500, description: "Contenção sem motivo não é investigação."}
      responses:
        '201':
          description: Quarentena aberta
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Quarantine'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_node` — o nó não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
        '409':
          description: "`already_quarantined` — já há quarentena aberta para o nó; `quarantineId` acompanha"
          content:
            application/problem+json:
              schema: {type: object}
  /traceability/quarantines/{id}:
    get:
      tags: [Rastreabilidade]
      summary: Quarentena e o que ela alcança hoje (FDS-002)
      description: >-
        O alcance é recalculado a cada leitura. Cada nó atingido vem com `suspected`: verdadeiro
        quando o caminho até ele passa por uma aresta de **intenção** — hoje a reserva de insumo,
        que registra o lote separado para a OP e não o que foi ao moinho. Bloqueia igual; não afirma
        o mesmo. `truncated` avisa que o corte de profundidade escondeu parte do alcance.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: depth, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10, default: 6}}
      responses:
        '200':
          description: Quarentena com alcance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuarantineDetail'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_quarantine` — não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
  /traceability/quarantines/{id}/release:
    post:
      tags: [Rastreabilidade]
      summary: Liberar quarentena (alçada própria)
      description: >-
        Exige a permissão `traceability.quarantine.release`, **separada** da de abrir: quem contém
        não é necessariamente quem decide que a investigação terminou. A justificativa é obrigatória
        e é a outra metade da alçada — liberar é afirmar que o produto pode seguir.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justification]
              properties:
                justification: {type: string, maxLength: 500}
      responses:
        '200': {description: Quarentena liberada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_quarantine` — não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
        '409':
          description: "`conflict` — a quarentena já foi liberada"
          content:
            application/problem+json:
              schema: {type: object}
  /packaging/shipments:
    get:
      tags: [Envase]
      summary: Expedições registradas (TRC-001-D)
      parameters:
        - {name: finishedLotId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Expedições
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Shipment'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Envase]
      summary: Registrar saída de um lote de produto acabado
      description: >-
        Fecha a metade de fora da fábrica, aberta desde a TRC-001: sem destino, um recall identifica
        a origem e não alcança ninguém.


        **Fatia mínima, de propósito.** Não há pedido, nota nem cliente cadastrado — distribuição
        comercial é assunto das sprints 19 e 20, e antecipá-la aqui criaria um cadastro de clientes
        pela porta dos fundos. O destino é texto de quem expediu.


        Duas recusas, e as duas existem por causa do recall: não se expede mais do que o lote tem
        (409 `shipment_exceeds_lot`), e lote em quarentena não sai (409 `packaging_blocked`) — a
        metade da contenção que faltava, porque até aqui a quarentena impedia envasar e deixava
        passar o embarque.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [finishedLotId, destination, units, shippedOn]
              properties:
                finishedLotId: {type: string, format: uuid}
                destination: {type: string, maxLength: 200}
                contact: {type: string, maxLength: 200, description: "Opcional; ausente vira lacuna no dossiê."}
                units: {type: integer, minimum: 1}
                shippedOn: {type: string, format: date}
                note: {type: string, maxLength: 500}
      responses:
        '201':
          description: Expedição registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shipment'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: "`shipment_exceeds_lot` ou `packaging_blocked` (lote em quarentena)"
          content:
            application/problem+json:
              schema: {type: object}
  /packaging/shipments/{shipmentId}/reversal:
    post:
      tags: [Envase]
      summary: Estornar expedição registrada errada (FDS-003-A)
      description: >-
        O caminho de volta de um registro errado — não é devolução nem transferência entre destinos, que
        são movimentação comercial e dependem de cliente e pedido (sprints 19 e 20).


        **A linha permanece.** Apagar tornaria indistinguível "nunca houve expedição" de "houve e foi
        estornada", e a segunda precisa ser demonstrável, inclusive para quem recebeu a comunicação de um
        recall baseado nela. Estornada, ela sai do escopo do recall e o saldo sem destino do lote volta a
        mostrar a cerveja que a expedição errada escondia.


        O motivo é obrigatório e o domínio recusa evasiva curta: o histórico precisa distinguir erro de
        digitação, destino trocado e carga que não saiu — as três exigem reações diferentes. Alçada
        própria (`packaging.shipment.reverse`), separada de registrar.
      parameters:
        - {name: shipmentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        '200':
          description: Expedição estornada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shipment'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: "`shipment_already_reversed`"
          content:
            application/problem+json:
              schema: {type: object}
  /traceability/recalls:
    get:
      tags: [Rastreabilidade]
      summary: Recalls da cervejaria (FDS-003)
      responses:
        '200':
          description: Recalls
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Recall'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Rastreabilidade]
      summary: Abrir recall
      description: >-
        Deriva o escopo do grafo (TRC-001) e materializa **uma linha por destino alcançado**, tudo no
        mesmo commit: um recall sem a lista de quem avisar é um recall que ninguém executa.


        A divisão entre o que é derivado e o que é guardado é a decisão da história. O **escopo** é
        recalculado a cada leitura — "escopo reproduzível" é isto: a mesma origem, a mesma
        profundidade e o mesmo grafo respondem a mesma coisa. A **comunicação** é guardada, porque
        avisar um cliente é fato sobre o que a cervejaria fez, e derivá-lo apagaria a prova.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeType, nodeId, reason]
              properties:
                nodeType:
                  type: string
                  enum: [STOCK_LOT, BREW_ORDER, BATCH, YEAST_HARVEST, PACKAGING_PLAN, PACKAGING_RUN, FINISHED_LOT, SHIPMENT]
                nodeId: {type: string, format: uuid}
                reason: {type: string, maxLength: 1000}
      responses:
        '201':
          description: Recall aberto
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recall'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_node` — o nó não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
  /traceability/recalls/{id}:
    get:
      tags: [Rastreabilidade]
      summary: Dossiê do recall (FDS-003)
      description: >-
        As duas metades juntas e distinguíveis: `notifications` é o que foi comunicado (guardado),
        `scope` é o alcance de hoje (derivado). `newDestinations` são expedições que hoje estão no
        escopo e não estavam na abertura — o lote saiu depois, e elas aparecem separadas em vez de
        entrar caladas entre os avisados. `gaps` são lotes do escopo sem expedição registrada: caixas
        que ninguém sabe onde estão, e sem as quais a cobertura mediria só o que se conhece.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: depth, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10, default: 6}}
      responses:
        '200':
          description: Dossiê
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecallDossier'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_recall`"
          content:
            application/problem+json:
              schema: {type: object}
  /traceability/recalls/{id}/notifications/{notificationId}:
    post:
      tags: [Rastreabilidade]
      summary: Registrar a comunicação de um destino
      description: >-
        O canal é obrigatório: "avisamos" sem dizer como não é prova de nada. A mesma comunicação não
        se registra duas vezes, senão o dossiê passa a contar avisos que não houve.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: {type: string, maxLength: 40, description: "telefone, e-mail, visita…"}
                note: {type: string, maxLength: 500}
      responses:
        '200': {description: Comunicação registrada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: "`conflict` — recall encerrado, ou destino já comunicado"
          content:
            application/problem+json:
              schema: {type: object}
  /traceability/recalls/{id}/close:
    post:
      tags: [Rastreabilidade]
      summary: Encerrar o recall
      description: >-
        Exige que **todos os destinos tenham comunicação registrada** (409
        `recall_has_pending_notifications`). Encerrar com cliente pendente declararia terminada uma
        operação que deixou cerveja na prateleira de quem não foi avisado — e o dossiê diria isso
        para sempre. Quem precisa encerrar sem ter falado registra a comunicação com o canal e a
        observação do que aconteceu; o que não se pode é omitir.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary]
              properties:
                summary: {type: string, maxLength: 1000}
      responses:
        '200': {description: Recall encerrado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: "`recall_has_pending_notifications` — `pending` acompanha"
          content:
            application/problem+json:
              schema: {type: object}
  /traceability/recall-drills:
    get:
      tags: [Rastreabilidade]
      summary: Simulados de recall (FDS-004)
      responses:
        '200':
          description: Simulados
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/RecallDrill'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Rastreabilidade]
      summary: Iniciar simulado
      description: >-
        **Treinar, não recolher.** O simulado não cria expedição, não move saldo, não abre quarentena
        e não gera pendência de comunicação: lê o mesmo grafo que o recall leria e cronometra a casa
        respondendo "onde está".


        O relógio que começa aqui é o da **cervejaria**, não o do servidor. Derivar o escopo leva
        milissegundos e não diz nada; o que a norma cobra é quantas horas a equipe levou para
        localizar o produto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeType, nodeId]
              properties:
                nodeType:
                  type: string
                  enum: [STOCK_LOT, BREW_ORDER, BATCH, YEAST_HARVEST, PACKAGING_PLAN, PACKAGING_RUN, FINISHED_LOT, SHIPMENT]
                nodeId: {type: string, format: uuid}
                note: {type: string, maxLength: 500}
      responses:
        '201':
          description: Simulado iniciado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecallDrill'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_node` — o nó não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
  /traceability/recall-drills/{id}:
    get:
      tags: [Rastreabilidade]
      summary: Relatório do simulado (FDS-004)
      description: >-
        Enquanto o simulado corre, os números vêm do grafo — são o **alvo** que a equipe está
        tentando localizar, e mudam se alguém expedir no meio do exercício, o que é a verdade. Depois
        de encerrado, vêm congelados: aquele foi o resultado daquele dia, e recalculá-lo responderia
        sobre outro.


        `findings` são as lacunas viradas do avesso — lote sem expedição vira "registre para onde
        ele foi", destino sem contato vira "cadastre com quem falar". É o que transforma o simulado
        em exercício útil: o relatório não diz só que a cobertura foi de 75%, diz o que fazer para
        ela ser maior.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: depth, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10, default: 6}}
      responses:
        '200':
          description: Relatório
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecallDrillReport'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_drill`"
          content:
            application/problem+json:
              schema: {type: object}
  /traceability/recall-drills/{id}/finish:
    post:
      tags: [Rastreabilidade]
      summary: Encerrar simulado e medir
      description: >-
        `unitsLocated` é **declarado por gente**, não contado pelo sistema: o sistema sabe quantas
        unidades deveriam estar em cada destino, e o simulado existe justamente para descobrir que às
        vezes elas não estão. Contar sozinho daria 100% sempre e não mediria nada.


        Localizar mais do que saiu é recusado (400): percentual acima de 100% é sinal de erro de
        contagem, não de excelência.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitsLocated, summary]
              properties:
                unitsLocated: {type: integer, minimum: 0}
                summary: {type: string, maxLength: 1000}
                correctiveActions:
                  type: string
                  maxLength: 2000
                  description: >-
                    Texto livre, mantido para o simulado que não gerou ação. **Não pode vir junto com
                    `nonConformityId`** (400): ação escrita como texto E como item de CAPA deixaria quem
                    lê sem saber qual é a de verdade.
                nonConformityId:
                  type: string
                  format: uuid
                  description: >-
                    A não conformidade onde as ações viram itens de CAPA (FDS-004-A). **O simulado não
                    abre NC sozinho** — isso exigiria o sistema decidir a severidade, e o quanto uma
                    cobertura de 75% é grave depende do produto e de quem audita.


                    A NC precisa já estar **investigada**: o CAPA recusa planejar ação antes de conhecer
                    a causa (409), e o simulado não fura a ordem das fases — planejar solução antes de
                    saber o porquê é o que o CAPA existe para impedir.
                capaActions:
                  type: array
                  description: >-
                    Ações a planejar na NC, com tipo, dono e prazo — é o dono que distingue uma ação de
                    uma intenção. Texto livre no relatório não aparece em lista nenhuma, e seis meses
                    depois o próximo simulado encontra a mesma lacuna.
                  items:
                    type: object
                    required: [kind, description, owner, dueOn]
                    properties:
                      kind: {type: string, enum: [CORRECTIVE, PREVENTIVE]}
                      description: {type: string, maxLength: 1000}
                      owner: {type: string, maxLength: 120}
                      dueOn: {type: string, format: date}
      responses:
        '200': {description: Simulado encerrado}
        '400':
          description: "Resumo ausente, ou unidades localizadas acima do escopo"
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: "`conflict` — o simulado já foi encerrado"
          content:
            application/problem+json:
              schema: {type: object}
  /production/batches/{id}/consumption/proposal:
    get:
      tags: [Produção]
      summary: Proposta de consumo do dia de brassa (TRC-001-C)
      description: >-
        O que a OP tem reservado, lote a lote, para o operador confirmar ou corrigir. Propor a
        reserva torna o registro barato no caso comum — na maioria dos dias a brassagem usa o que
        foi separado. O que não se pode é o sistema **assumir** a proposta: quem trocou de lote
        porque o reservado acabou precisa poder dizer isso, e é essa divergência que o registro
        existe para capturar.


        Depois do registro a proposta vem vazia, com `alreadyRegistered` verdadeiro: a reserva já
        virou consumo.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Proposta
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrewConsumptionProposal'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /production/batches/{id}/consumption:
    post:
      tags: [Produção]
      summary: Registrar o consumo do dia de brassa (TRC-001-C)
      description: >-
        Transforma a reserva — intenção — no fato de que aquele malte entrou nesta cerveja. É o que
        faz a aresta da genealogia passar de `INTENDED` a `CONFIRMED` e o custo realizado (CST-001)
        somar o preço do lote certo.


        All-or-nothing: ou o dia de brassa inteiro é registrado, ou nada é — consumo pela metade
        daria custo pela metade e genealogia pela metade. Lançar duas vezes é recusado (409), porque
        dobraria consumo e custo; corrigir um consumo errado é assunto de ajuste de estoque, que tem
        comando e rastro próprios.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [lotId, quantity, unit]
                    properties:
                      lotId: {type: string, format: uuid}
                      quantity: {type: number, exclusiveMinimum: 0}
                      unit: {type: string}
      responses:
        '200': {description: Consumo registrado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            `brew_consumption_shortfall` — declarado acima do que o lote tem, com a falta lote a
            lote em `shortfalls`; ou `conflict`, quando o consumo desta brassagem já foi registrado.
          content:
            application/problem+json:
              schema: {type: object}
  /costing/batch-costs:
    get:
      tags: [Custos]
      summary: Custos de lote já fechados (CST-001)
      responses:
        '200':
          description: Custos fechados
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/BatchCost'}}
        '403': {$ref: '#/components/responses/Problem'}
  /costing/batches/{batchId}:
    get:
      tags: [Custos]
      summary: Custo realizado de um lote (CST-001)
      description: >-
        Responde o custo **fechado** quando existe e o custo **de agora** quando não existe, e diz
        em qual dos dois casos está — a diferença muda como o número deve ser lido. Enquanto ninguém
        fechou, ele ainda muda porque a produção ainda muda: um envase a mais altera o custo por
        litro.


        Cada parcela traz a origem por extenso (`source`), que é o critério da história: um total
        sem origem é um número que ninguém explica seis meses depois. O custo do insumo sai do
        **preço do lote consumido**, não de média — o que só é possível desde que a brassagem passou
        a confirmar o que usou (TRC-001-C).


        `incomplete` e `gaps` andam junto com o total: hoje mão de obra e utilidade não têm fonte, e
        somá-las como zero seria mentir por omissão.
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Custo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchCost'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_batch` — o lote não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
  /costing/labor-rate:
    get:
      tags: [Custos]
      summary: Custo da hora de trabalho da casa (CST-001-A)
      description: >-
        `costPerHour` nulo é resposta legítima: a cervejaria que nunca definiu a taxa não tem mão de obra
        no custo, e o custeio declara isso como **lacuna** em vez de somar zero — um total que soma zero
        mente por omissão.
      responses:
        '200':
          description: Taxa vigente
          content:
            application/json:
              schema:
                type: object
                properties:
                  costPerHour: {type: number, nullable: true}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Custos]
      summary: Definir o custo da hora
      description: >-
        **Uma taxa por cervejaria, não uma por pessoa.** Custo de mão de obra por lote é custo médio da
        hora produtiva — salário, encargos e ociosidade diluídos. Uma taxa por pessoa faria o mesmo lote
        sair mais caro na semana em que o cervejeiro sênior trabalhou, o que descreve a escala e não o
        produto.


        Alçada `costing.labor-rate.manage`, separada de apontar hora: apontar é trabalho do dia, definir
        quanto a hora vale é decisão de gestão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [costPerHour]
              properties:
                costPerHour: {type: number, exclusiveMinimum: 0}
      responses:
        '200': {description: Taxa definida}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /production/batches/{id}/labor:
    get:
      tags: [Produção]
      summary: Apontamentos de hora do lote (CST-001-A)
      description: >-
        Quem lê o custo precisa ver de onde a parcela de mão de obra saiu. `manHours` é duração ×
        pessoas — é essa coluna que vira dinheiro no custeio.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Apontamentos, do mais antigo para o mais novo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string, format: uuid}
                    activity: {type: string}
                    startedAt: {type: string, format: date-time}
                    endedAt: {type: string, format: date-time}
                    people: {type: integer}
                    manHours: {type: number}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Produção]
      summary: Apontar horas trabalhadas no lote (CST-001-A)
      description: >-
        A hora é da produção; o dinheiro é do custeio. Separar permite ajustar a taxa sem reescrever
        apontamento, e evita que quem registra seis horas de brassa precise conhecer moeda para fazê-lo.


        `people` importa: duas pessoas por três horas custam **seis horas-homem**, e omitir a contagem
        perderia justamente a metade que a cervejaria paga.


        Lote cancelado não recebe apontamento — ninguém trabalhou nele. Lote encerrado recebe: limpeza e
        fechamento acontecem depois de o lote acabar.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity, startedAt, endedAt, people]
              properties:
                activity:
                  type: string
                  maxLength: 120
                  description: >-
                    Texto e não enum: a divisão de trabalho de uma cervejaria de três pessoas não é a de
                    uma de trinta, e um enum imporia a de quem escreveu o código
                startedAt: {type: string, format: date-time}
                endedAt: {type: string, format: date-time}
                people: {type: integer, minimum: 1}
      responses:
        '201': {description: Apontamento registrado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /costing/batches/{batchId}/variance:
    get:
      tags: [Custos]
      summary: Planejado versus real do lote (CST-002)
      description: >-
        Explica a diferença entre o custo que se esperava e o que aconteceu, separando **preço** de
        **consumo** — e a conta fecha: `priceVariance + consumptionVariance = actualCost −
        plannedCost`, exatamente. O campo `reconciles` vai no contrato para quem consome poder
        conferir isso em vez de confiar.


        **A plataforma não tem custo padrão**, e esta consulta não inventa um. A base de preço é o
        que a ordem *separou*: lotes concretos a preços concretos, lidos dos movimentos de reserva
        que sobrevivem no ledger mesmo depois de liberados pelo consumo. A base de quantidade é a
        explosão da receita que a ordem congelou.


        **Sem base confiável, declara em vez de comparar.** Receita republicada depois da ordem,
        insumo que a ordem não separou, consumo ainda não confirmado, lote ainda não transferido —
        cada um vira lacuna em `gaps`, e o insumo correspondente sai do dinheiro (`comparable`
        falso) em vez de virar uma variação inteira de preço.


        `plannedQuantity` nulo e zero são coisas diferentes: nulo é "não se sabe o que a receita
        pedia"; zero é "não pedia nada e a brassagem usou assim mesmo".


        Sempre derivada, inclusive com o custo já fechado: o custo é a resposta daquele dia, a
        explicação é sobre os fatos, e os fatos continuam sendo corrigidos depois.
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Planejado versus real
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchVariance'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_batch` — o lote não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
  /costing/batches/{batchId}/close:
    post:
      tags: [Custos]
      summary: Fechar o custo do lote
      description: >-
        Congela o número com o que está somado agora, incluindo as lacunas. É um ato com autor:
        alguém olha o total, aceita o que ficou de fora e assina. Terminar de produzir e terminar de
        apurar são coisas diferentes, e por isso o custo não fecha sozinho quando o lote termina.


        Fechar duas vezes é recusado (409): custo fechado é evidência, e evidência que se sobrescreve
        não é evidência. Refazer é assunto de estorno, que ainda não existe.
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 500}
      responses:
        '200':
          description: Custo fechado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchCost'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: "`conflict` — o custo deste lote já foi fechado"
          content:
            application/problem+json:
              schema: {type: object}
  /reporting/saved-reports:
    get:
      tags: [Relatórios]
      summary: Relatórios salvos (RPT-003)
      responses:
        '200':
          description: Definições da cervejaria
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SavedReport'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Relatórios]
      summary: Definir um relatório salvo
      description: >-
        A definição registra **versão, filtros, tenant, fuso, formato e retenção** — o tenant vem da
        sessão, não do corpo, e é o que impede definir relatório para outra cervejaria.


        **Destinatários são usuários da plataforma, não e-mails digitados.** Não há campo de endereço
        livre, e é deliberado: só de usuário se sabe a alçada. Mandar para um endereço que ninguém
        verificou seria entregar dado da fábrica a quem quer que o tenha digitado.


        O **proprietário técnico** é quem responde pela execução: é a alçada dele, resolvida a cada
        execução, que decide se o relatório sai.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedReportRequest'}
      responses:
        '201':
          description: Definição criada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedReport'}
        '400':
          description: "`bad_request` — fuso desconhecido, retenção fora da faixa ou nome em branco"
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: "`conflict` — já existe relatório com este nome na cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
  /reporting/saved-reports/{reportId}:
    get:
      tags: [Relatórios]
      summary: Uma definição
      parameters:
        - {name: reportId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Definição
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedReport'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_saved_report`"
          content:
            application/problem+json:
              schema: {type: object}
    put:
      tags: [Relatórios]
      summary: Redefinir filtros, periodicidade, retenção e destinatários
      description: >-
        **Sobe a versão da definição.** Sem isso, uma execução de março e uma de agosto diriam ter
        saído da mesma definição depois de alguém trocar os filtros no meio, e o relatório antigo
        passaria a mentir sobre a própria origem. Dono e tipo não se redefinem — mudá-los seria
        outro relatório.
      parameters:
        - {name: reportId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters: {type: object, additionalProperties: {type: string}}
                timezone: {type: string}
                schedule: {type: string, enum: [MANUAL, DAILY, WEEKLY, MONTHLY]}
                retentionDays: {type: integer, minimum: 1, maximum: 3650}
                recipients: {type: array, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Definição atualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedReport'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: "`conflict` — a definição foi alterada por outra pessoa"
          content:
            application/problem+json:
              schema: {type: object}
  /reporting/saved-reports/{reportId}/active:
    post:
      tags: [Relatórios]
      summary: Ativar ou suspender a programação
      parameters:
        - {name: reportId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: {type: boolean}
      responses:
        '200':
          description: Definição atualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedReport'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /reporting/saved-reports/{reportId}/runs:
    get:
      tags: [Relatórios]
      summary: Execuções de um relatório salvo
      parameters:
        - {name: reportId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Execuções, da mais recente para a mais antiga
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ReportRun'}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Relatórios]
      summary: Executar agora
      description: >-
        **Roda com a autorização efetiva do proprietário técnico**, resolvida neste instante — não a
        de quem apertou o botão, não a que ele tinha quando salvou, e nunca um privilégio de sistema.
        Um administrador que dispare o relatório de outra pessoa recebe o que a alçada *daquela
        pessoa* permite: pedir a execução não é uma forma de ler o que não se pode ler.


        Dono sem a alçada não faz a execução falhar — faz a execução **recusar** (`REFUSED`), com o
        motivo registrado. Falhar em silêncio deixaria a fábrica achando que o relatório continua
        indo.
      parameters:
        - {name: reportId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Execução (bem-sucedida ou recusada)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportRun'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /reporting/saved-reports/runs/{runId}/deliveries:
    post:
      tags: [Relatórios]
      summary: Registrar a entrega a um destinatário
      description: >-
        **Idempotente por (execução, destinatário).** Reentregar atualiza a linha e conta a
        tentativa; em nenhum caso refaz o relatório. É o que impede uma falha parcial de envio de
        reenviar para quem já tinha recebido — e de gerar dado novo, que é o pior dos dois.
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId, delivered]
              properties:
                recipientId: {type: string, format: uuid}
                delivered: {type: boolean}
                detail: {type: string, maxLength: 500}
      responses:
        '200':
          description: Execução com as entregas atualizadas
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportRun'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /reporting/saved-reports/runs/{runId}/link:
    post:
      tags: [Relatórios]
      summary: Emitir link temporário de download
      description: >-
        Emite um token com prazo, **pessoal**, para quem é destinatário ou dono. Ter alçada de gerir
        relatórios não dá acesso ao conteúdo: gerir a programação e ler o que ela produziu são
        coisas diferentes. O link nunca vive mais do que o artefato.
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Token e prazo
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  expiresAt: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '410':
          description: A execução não produziu artefato, ou ele já expirou
  /reporting/downloads/{token}:
    get:
      tags: [Relatórios]
      summary: Abrir um link temporário
      description: >-
        O token diz **qual** artefato; a sessão diz **quem**. Um link que autenticasse sozinho
        viraria uma senha em texto claro no corpo de um e-mail, repassável a qualquer um.


        Cada abertura é auditada. Token vencido, token de outra pessoa e token inexistente respondem
        a mesma coisa — a diferença entre eles só interessa a quem está testando tokens.
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: O artefato, como anexo
          content:
            application/json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
        '410':
          description: Este link não vale mais
  /reporting/dashboard:
    get:
      tags: [Relatórios]
      summary: Painel operacional (RPT-002)
      description: >-
        Produção, estoque, qualidade, fermentação e custo num painel só. Cada indicador chega com
        **definição, período e destino de drill-down** — não por convenção da tela, mas porque o
        domínio recusa construir um indicador sem os três. "Indicador sem definição" está listado
        como risco da sprint, e a forma de um risco desses não voltar é tornar impossível criar o
        objeto errado.


        **Quem define é quem mede.** O que conta como "desvio em aberto" é assunto da qualidade; o
        painel só coleta. Cada módulo contribui pelos próprios dados através de uma porta federada,
        e um módulo novo aparece no painel sem que o painel mude.


        `from` nulo num indicador significa **posição**, não ausência: estoque vencendo é a foto do
        instante `to`, não um acumulado do intervalo. O campo `positional` diz isso de forma direta.


        `drillDown` traz recurso e filtro, **não rota** — a rota é da interface, e mudá-la não pode
        obrigar o backend a mudar junto.
      parameters:
        - name: from
          in: query
          required: false
          schema: {type: string, format: date-time}
          description: "Início do período; padrão, 30 dias antes de `to`."
        - name: to
          in: query
          required: false
          schema: {type: string, format: date-time}
          description: "Fim do período, exclusivo; padrão, agora."
      responses:
        '200':
          description: Painel do período
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
        '400':
          description: "`bad_request` — o início do período é depois do fim"
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
  /reporting/batches/{batchId}:
    get:
      tags: [Relatórios]
      summary: Relatório do lote (RPT-001)
      description: >-
        O dossiê do lote num documento só: plano, execução, qualidade, custo e genealogia. É
        **consolidação, não cálculo** — nada aqui soma o que outro módulo já não somou. Recalcular
        custo ou rendimento criaria uma segunda aritmética que um dia divergiria da primeira, e a
        divergência apareceria justamente no documento levado a auditor.


        **Derivado, sem tabela.** O relatório é montado a cada pedido, e por isso `generatedAt` vai
        no corpo: o mesmo lote responde diferente amanhã, e um documento impresso sem data seria
        indefensável.


        **Seção que não pôde ser preenchida vira lacuna nomeada em `gaps`.** Silêncio num documento
        que sai da casa é lido como "não houve" — e "não houve" é forte demais para se afirmar por
        omissão. Lote sem medição de qualidade diz `unmeasured`, que não é o mesmo que aprovado;
        genealogia com elo faltando ou truncada diz que o relatório não prova rastreabilidade.
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Relatório do lote
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchReport'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_batch` — o lote não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
  /reporting/batches/{batchId}/export:
    post:
      tags: [Relatórios]
      summary: Exportar o relatório do lote
      description: >-
        Devolve o mesmo documento com `Content-Disposition: attachment` e **registra a exportação na
        auditoria**.


        É POST, e não GET, porque não é só leitura: exportar tira o documento de dentro do sistema, e
        a partir dali ele vive num e-mail, num pen drive, na mão de um auditor — nada o traz de
        volta. Por isso também é alçada separada da leitura: quem lê na tela não necessariamente
        pode levar embora.


        O registro sai depois de o relatório existir; exportação recusada não deixa rastro de
        exportação, porque auditar uma que falhou seria afirmar que o documento saiu.


        **O formato é negociado pelo `Accept` (RPT-001-A).** JSON continua sendo o padrão — quem já
        integra recebe o mesmo corpo de antes, porque trocar o padrão quebraria integração por causa de
        acabamento. `Accept: application/pdf` devolve o documento impresso, com layout simples e **sem
        identidade visual**: marca é acabamento, e esperar por ela mantinha a cervejaria sem nada para
        mandar ao auditor. A auditoria registra qual formato saiu.
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
        - name: Accept
          in: header
          required: false
          schema: {type: string, enum: [application/json, application/pdf]}
          description: "`application/pdf` para o documento impresso; ausente ou JSON devolve o dossiê."
      responses:
        '200':
          description: Documento para download
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchReport'}
            application/pdf:
              schema:
                type: string
                format: binary
                description: >-
                  Cabeçalho, dados e rodapé. As lacunas vêm no topo, logo abaixo do cabeçalho: quem
                  imprime precisa ver o que o relatório NÃO prova antes de mandá-lo a um cliente que vai
                  lê-lo como se provasse tudo — num papel, o rodapé é onde a informação morre.
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /utilities/indicators:
    get:
      tags: [Utilidades]
      summary: Água, energia e CO₂ por litro envasado (UTL-001)
      description: >-
        Indicador **derivado**, sem tabela própria: soma as medições que já existem — o consumo do
        ciclo de limpeza (CLN-005) e o CO₂ pesado na conexão de gás (GAS-001) — e divide pelos
        litros que o envase produziu no período. Guardá-lo criaria uma terceira verdade que
        envelheceria a cada ciclo lançado com atraso; o mesmo período responde o mesmo enquanto os
        fatos não mudarem, e muda quando eles mudam.


        **Medido e estimado não viram um número só.** Um indicador que mistura leitura de
        instrumento com conta de padeiro não prova nada a auditor nenhum: `measuredPerLiter` é o que
        se leva a auditoria, `perLiter` é o total para quem quiser somar os dois sabendo o que fez.


        **Período sem envase não tem indicador, e não tem zero** (`perLiter` nulo): a fábrica que
        limpou tanque sem produzir cerveja gastou água, e dizer "0 L/L" seria chamá-la de eficiente.
        Pela mesma razão, utilidade que ninguém mediu não aparece zerada — ela não aparece.


        `coverage` diz por que parte da fábrica o número fala ("12 de 15 ciclos"), e é declarada por
        quem mede, não estimada aqui. Sem cobertura declarada, `fullyMeasured` é falso: não saber
        quanto foi medido não é o mesmo que ter medido tudo. O CO₂ é esse caso hoje (UTL-001-A) —
        não existe consumo esperado de gás contra o qual comparar.
      parameters:
        - name: from
          in: query
          required: false
          schema: {type: string, format: date-time}
          description: "Início do período; padrão, 30 dias antes de `to`."
        - name: to
          in: query
          required: false
          schema: {type: string, format: date-time}
          description: "Fim do período, exclusivo; padrão, agora."
      responses:
        '200':
          description: Indicadores do período
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UtilityReport'}
        '400':
          description: "`bad_request` — o início do período é depois do fim"
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
  /knowledge/documents:
    get:
      tags: [Conhecimento]
      summary: Documentos indexados que esta pessoa pode ver (RAG-001)
      description: >-
        Lista vigentes e substituídos. Não filtra por vigência de propósito: quem administra a base precisa
        ver o histórico para saber o que foi substituído e quando. Filtra por **permissão**, que é o filtro
        que não se negocia — documento cuja permissão exigida a pessoa não tem não aparece, nem pelo
        título: um título de laudo já é informação.
      responses:
        '200':
          description: Documentos visíveis
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/KnowledgeDocument'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Conhecimento]
      summary: Indexar documento na base de conhecimento (RAG-001)
      description: >-
        Corta o texto em trechos recuperáveis e, se já houver versão vigente com o mesmo `code`, **encerra
        a vigência dela no dia anterior** a `effectiveFrom` — no mesmo comando e na mesma transação.


        A simultaneidade é o ponto: duas versões vigentes do mesmo documento no mesmo dia fariam a
        recuperação devolver respostas conflitantes sem meio de escolher qual vale, e é durante essa janela
        que alguém consulta.


        **A versão anterior não é apagada.** Ela continua recuperável para pergunta sobre o passado — o que
        a ficha dizia quando o lote foi produzido. O que muda é até quando ela valeu.


        `version` não é informada: é derivada da maior já indexada para o `code`. Deixar quem chama
        escolher abriria a porta para duas "versão 3" do mesmo documento, e a citação deixaria de
        identificar qual respondeu.


        **`requiredPermission` é atributo do documento**, não verificação que a borda faz e a busca confia.
        É o que faz o filtro valer quando a recuperação for chamada de um job ou de um evento, onde não
        existe borda HTTP nenhuma para verificar nada.


        Indexação recebe **texto**, não arquivo binário. O original vive onde `sourceUri` aponta; extrair
        texto de PDF está fora do escopo desta história.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IndexDocument'}
      responses:
        '201':
          description: Documento indexado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeDocument'}
        '400':
          description: "`bad_request` — sem texto indexável, ou campo fora do contrato"
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
  /knowledge/search:
    get:
      tags: [Conhecimento]
      summary: Recuperar trechos de documento por pergunta (RAG-001)
      description: >-
        Busca textual do PostgreSQL com dicionário português sem acento (ver
        `docs/adr/0015-knowledge-retrieval.md`), filtrada por cervejaria, permissão e vigência **dentro da
        própria consulta**.


        Filtrar dentro, e não depois, é o que faz o limite de resultados significar algo: filtrar depois
        devolveria três trechos de dez porque sete eram invisíveis, e a resposta sairia pobre sem que nada
        explicasse por quê. É também o que garante o critério da história por construção — não existe
        caminho em que trecho de documento sem permissão chegue à memória do processo.


        Os termos da pergunta são combinados em **OU**, não em E: exigir todos faria uma pergunta mais
        detalhada recuperar menos, e um procedimento que fala de "torque" e "aperto" deixaria de ser achado
        por não usar a palavra "parafuso". O ranqueamento põe na frente quem casa mais termos.


        **Lista vazia é resposta legítima** e significa "não há fonte na base para isto" — diferente de
        erro. Sem fonte, quem consome declara a limitação em vez de inventar.


        **O texto devolvido é dado não confiável** (`untrusted: true`): foi escrito por fabricante,
        laboratório ou fornecedor e pode conter instrução endereçada ao modelo. Quem consome trata como
        conteúdo sobre o qual raciocinar, nunca como ordem a seguir.
      parameters:
        - name: question
          in: query
          required: true
          schema: {type: string}
          description: "A pergunta, em linguagem natural."
        - name: onDate
          in: query
          required: false
          schema: {type: string, format: date}
          description: >-
            Data de referência da vigência; padrão, hoje. Serve à pergunta sobre o passado: o que o
            documento dizia quando o lote foi produzido.
        - name: equipmentId
          in: query
          required: false
          schema: {type: string, format: uuid}
          description: >-
            Restringe ao que se refere a este equipamento **e** ao que não se refere a equipamento nenhum:
            um procedimento geral responde sobre a bomba tanto quanto o manual dela.
      responses:
        '200':
          description: Trechos recuperados, do mais para o menos relevante
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Evidence'}}
        '403': {$ref: '#/components/responses/Problem'}
  /ai/copilot/ask:
    post:
      tags: [IA]
      summary: Perguntar ao copiloto com base nas fontes indexadas (RAG-002)
      description: >-
        Recupera trechos da base de conhecimento, pergunta ao modelo e devolve a resposta com **a fonte de
        cada afirmação separada do que foi inferido**.


        **Sem fonte, o modelo não é chamado.** Recuperação vazia devolve `answered: false` com a limitação
        declarada e `consultedSources: 0`. Um modelo que não é perguntado não pode inventar resposta — a
        garantia é estrutural, não confiança no comportamento dele — e ainda não custa nada.


        **Toda citação é conferida contra os trechos que foram ao prompt.** Documento que não estava entre as
        fontes, número de trecho que não existe e frase que não está no trecho são descartados, e o motivo vai
        em `discarded`. Formato válido não é conteúdo verdadeiro: um JSON impecável pode citar um manual
        inexistente ou atribuir a um manual real uma frase que ele nunca disse, e nenhum validador de schema
        vê a diferença.


        **Quem afirma tem de sustentar.** Se o modelo devolve `answered: true` e nenhuma citação confere, a
        resposta é descartada — o texto dele **não** é apresentado com ressalva, porque uma afirmação sem
        fonte conferida não deve circular. Devolver `answered: false` sem citação é legítimo: declinar
        corretamente não é falha.


        **Prompt injection.** O trecho de documento vai no turno do usuário, rotulado como dado; a instrução
        do sistema é escrita por nós. A garantia não é o modelo obedecer a essa separação: é que nesta
        chamada não existe ferramenta a conceder e o contrato de resposta **não tem campo de comando** —
        propor comando é AIA-003, com confirmação humana e nova autorização. Um comando que o modelo tente
        devolver é campo desconhecido e faz a resposta ser recusada inteira (`502`).


        Duas pessoas podem receber respostas legitimamente diferentes para a mesma pergunta: a recuperação
        filtra pelas permissões de quem perguntou.


        `ai.answer.ask` é permissão própria e crítica — cada pergunta custa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string, maxLength: 1000}
                onDate:
                  type: string
                  format: date
                  description: >-
                    Vigência das fontes; hoje quando ausente. Serve à pergunta sobre o passado — o que o
                    documento dizia quando o lote foi produzido.
                equipmentId:
                  type: string
                  format: uuid
                  nullable: true
                  description: "Restringe às fontes daquele equipamento e às que não são de equipamento nenhum."
      responses:
        '200':
          description: >-
            Resposta do copiloto. `answered: false` é resposta legítima — sem fonte, ou sem sustentação — e
            não erro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroundedAnswer'}
        '400': {$ref: '#/components/responses/Problem'}
        '402':
          description: "`ai_budget_exceeded` — o orçamento do mês foi esgotado"
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
        '501':
          description: "`ai_provider_disabled` — não há provedor configurado nesta instalação"
          content:
            application/problem+json:
              schema: {type: object}
        '502':
          description: >-
            `ai_response_rejected` — a resposta do modelo não satisfez o contrato e foi recusada inteira.
            É também o que acontece quando ele tenta devolver um comando.
          content:
            application/problem+json:
              schema: {type: object}
        '503':
          description: "`ai_provider_unavailable` — o provedor não respondeu em nenhum dos modelos"
          content:
            application/problem+json:
              schema: {type: object}
  /ai/copilot/batches/{batchId}/assessment:
    parameters:
      - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [IA]
      summary: Avaliar o risco de um lote a partir dos fatos calculados (AIA-002)
      description: >-
        **O modelo não produz número nenhum.** Os serviços de domínio calculam, cada número recebe um
        identificador e uma origem, e o modelo recebe a lista de fatos para interpretar. Ele não soma, não
        divide, não estima e não converte unidade — tudo que precisaria ser calculado já veio pronto de quem
        responde por aquele cálculo.


        De onde vem cada fato: volume e estado da **produção**; OG, FG, ABV, IBU e cor do motor de cálculo da
        **receita**; medições, desvios e não conformidades da **qualidade**; total e custo por litro do
        **custeio**. Perda percentual e proporção dentro da faixa são derivados calculados no domínio — de
        propósito, para que o modelo não precise dividir nada.


        **Todo número que o modelo escrever é conferido contra os fatos que a própria afirmação cita.** Não
        contra todos os fatos: um teste pegou "o lote perdeu 45 L" passando porque 45 era o IBU previsto da
        receita — número existente, assunto errado, afirmação errada por 35 litros. Amarrar o número aos fatos
        citados fecha essa porta, e a consequência é que **afirmação sem `factRefs` não pode conter número**.


        A recusa é por afirmação, não pela avaliação inteira: a frase com número inventado sai e o motivo vai
        em `discarded`; as outras ficam. `usable: false` significa que nada resistiu à conferência — e os
        `facts` continuam na resposta, porque são do domínio e valem independentemente do que o modelo disse.


        **Não propõe ação.** O schema da resposta do modelo não tem campo de comando: propor comando é AIA-003,
        com confirmação humana e nova autorização. Aqui o produto é entendimento.


        `ai.assessment.batch` é permissão própria e crítica — avaliar um lote lê custo, qualidade e produção
        dele, e quem pode perguntar sobre um manual não necessariamente pode ler o custo de um lote.
      responses:
        '200':
          description: >-
            Avaliação. `usable: false` é resposta legítima — nada do que o modelo escreveu resistiu à
            conferência — e não erro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchAssessment'}
        '402':
          description: "`ai_budget_exceeded` — o orçamento do mês foi esgotado"
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: >-
            `unknown_batch` — o lote não existe nesta cervejaria. A resposta é a mesma para "não existe" e
            "existe em outra cervejaria": distinguir as duas contaria que ele existe em algum lugar.
          content:
            application/problem+json:
              schema: {type: object}
        '501':
          description: "`ai_provider_disabled` — não há provedor configurado nesta instalação"
          content:
            application/problem+json:
              schema: {type: object}
        '502':
          description: "`ai_response_rejected` — a resposta do modelo não satisfez o contrato"
          content:
            application/problem+json:
              schema: {type: object}
        '503':
          description: "`ai_provider_unavailable` — o provedor não respondeu em nenhum dos modelos"
          content:
            application/problem+json:
              schema: {type: object}
  /ai/proposals:
    get:
      tags: [IA]
      summary: Propostas de comando do copiloto e as decisões tomadas (AIA-003)
      description: >-
        As propostas da cervejaria, das mais recentes para as mais antigas, com a decisão de cada uma quando
        houve. `ai.command.read` é alçada de auditoria: deixa ver o que foi proposto e quem consentiu, sem
        deixar propor nem confirmar nada.


        Cada item traz `requiredPermission` e `canConfirm`. O segundo é conveniência de apresentação — a
        verificação que vale é a do aceite, feita no domínio contra as permissões de então; o primeiro existe
        para que a interface possa dizer *qual* alçada falta, porque desabilitar o botão sem nomear a permissão
        deixa quem lê sem o que fazer a respeito.
      responses:
        '200':
          description: Propostas da cervejaria.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CommandProposal'}
        '403': {$ref: '#/components/responses/Problem'}
  /ai/proposals/batches/{batchId}:
    parameters:
      - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [IA]
      summary: Pedir ao copiloto propostas de comando para um lote (AIA-003)
      description: >-
        **A proposta não é um comando.** Ela é gravada pendente e espera a decisão de uma pessoa; nada no
        sistema muda por causa dela. É a única história da sprint que grava tabela, e por um motivo preciso: a
        proposta tem de sobreviver entre o instante em que a IA sugere e o instante em que alguém decide, para
        que exista onde registrar quem consentiu.


        **A allowlist é fechada.** O modelo só pode propor `CLOSE_BATCH_COST`, `OPEN_NON_CONFORMITY` ou
        `SCHEDULE_CLEANING_CYCLE`, cada uma com o conjunto exato de parâmetros que exige — nenhum faltando e
        nenhum a mais. Ação fora da lista não sobrevive ao contrato de resposta; parâmetro inesperado faz a
        proposta ser descartada em vez de guardada, porque proposta malformada guardada é proposta que alguém
        acaba confirmando. O caso concreto: o modelo mandando a concentração do sanitizante junto, que é
        justamente o parâmetro químico que o POP dita e ninguém inventa.


        **Pedir não exige a alçada do comando**, e não deve: pedir uma sugestão sobre o que fazer é diferente de
        fazer, e quem não pode fechar custo ainda precisa poder descobrir que o custo está aberto para pedir a
        quem pode. `ai.command.propose` é crítica e não dá direito de confirmar nada.


        Lista vazia é resposta legítima. Um copiloto que sempre encontra algo a fazer ensina a ser ignorado.
      responses:
        '200':
          description: >-
            Propostas gravadas, pendentes de decisão. Pode ser vazia — e ser vazia não é falha.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CommandProposal'}
        '402':
          description: "`ai_budget_exceeded` — o orçamento do mês foi esgotado"
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_batch` — o lote não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
        '501':
          description: "`ai_provider_disabled` — não há provedor configurado nesta instalação"
          content:
            application/problem+json:
              schema: {type: object}
        '502':
          description: "`ai_response_rejected` — a resposta do modelo não satisfez o contrato"
          content:
            application/problem+json:
              schema: {type: object}
        '503':
          description: "`ai_provider_unavailable` — o provedor não respondeu em nenhum dos modelos"
          content:
            application/problem+json:
              schema: {type: object}
  /ai/proposals/{proposalId}/acceptance:
    parameters:
      - {name: proposalId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [IA]
      summary: Confirmar uma proposta — exige a alçada do comando proposto (AIA-003)
      description: >-
        **A permissão exigida aqui é a do comando, não a de propor.** `CLOSE_BATCH_COST` exige
        `costing.cost.close`; `OPEN_NON_CONFORMITY` exige `quality.nc.manage`; `SCHEDULE_CLEANING_CYCLE` exige
        `sanitation.cycle.execute`. Ela é conferida no instante do aceite, contra as permissões de *quem está
        confirmando* — quem propôs pode ter perdido a alçada, e quem confirma pode nunca tê-la tido. Sem essa
        separação, "propor" seria um caminho lateral para fazer pela IA o que a pessoa não pode fazer pela porta
        da frente.


        A verificação mora no caso de uso e não na borda HTTP, para valer para qualquer chamador que apareça
        depois — inclusive um que não passe por requisição nenhuma.


        **O corpo não traz ação nem parâmetros.** Eles vêm da proposta gravada. É o que impede confirmar uma
        coisa na tela e executar outra no servidor.


        **A proposta vence em 12 horas.** Ela foi feita sobre os fatos de um instante — custo incompleto,
        medição fora da faixa, tanque sujo — e aceitá-la dias depois é agir sobre um retrato antigo, convincente
        justamente porque parece atual. Doze horas cobrem um turno e a leitura do turno seguinte, e não cobrem o
        fim de semana.


        **O aceite EXECUTA o comando na mesma transação, para as ações que têm porta publicada** (fechar
        custo e iniciar ciclo de limpeza). Se o comando falhar, a decisão é desfeita junto: consentimento
        gravado sem o efeito que ele autorizou faria alguém acreditar que o custo foi fechado.


        **Abrir não conformidade continua sendo um passo manual**, e o campo `executedOnConfirm` diz qual é
        qual. Executá-la exigiria inventar prazos de contenção, investigação e verificação — regra de negócio
        que não se deduz da proposta — e o modelo de dados não liga não conformidade a lote. Registrado no
        STATUS da sprint.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProposalDecision'}
      responses:
        '200':
          description: Decisão registrada, com quem consentiu e quando.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandProposal'}
        '403':
          description: >-
            Falta a alçada do comando proposto — a resposta nomeia qual permissão é. Ter
            `ai.command.propose` não basta.
          content:
            application/problem+json:
              schema: {type: object}
        '404':
          description: >-
            `unknown_proposal` — a proposta não existe nesta cervejaria. Mesma resposta para "não existe" e
            "existe em outra": distinguir contaria que ela existe em algum lugar.
          content:
            application/problem+json:
              schema: {type: object}
        '409':
          description: >-
            `proposal_not_pending` — já houve decisão, normalmente porque outra pessoa decidiu primeiro. A
            resposta diz qual foi, porque quem chegou depois precisa saber o que já valeu. Decisão é
            definitiva: reabrir apagaria a decisão de alguém.
          content:
            application/problem+json:
              schema: {type: object}
        '410':
          description: >-
            `proposal_expired` — o prazo venceu. 410 e não 409 porque tentar de novo a *mesma* proposta é
            justamente o que não se deve fazer: o caminho é pedir outra, sobre os fatos de agora.
          content:
            application/problem+json:
              schema: {type: object}
  /ai/proposals/{proposalId}/rejection:
    parameters:
      - {name: proposalId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [IA]
      summary: Descartar uma proposta — exige apenas poder vê-la (AIA-003)
      description: >-
        **Recusar não exige a alçada do comando, e a assimetria é deliberada.** Dizer "não" a uma sugestão não
        altera nada no sistema. Se exigisse alçada, propostas pendentes acumulariam até vencer — e uma tela
        cheia de pendências treina quem a lê a ignorar a tela inteira, inclusive as que valem. Proposta
        pendente parece decisão adiada, não decisão tomada.


        Vale para proposta vencida também: se não valesse, a lista nunca se limparia.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProposalDecision'}
      responses:
        '200':
          description: Recusa registrada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandProposal'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_proposal` — a proposta não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
        '409':
          description: "`proposal_not_pending` — já houve decisão"
          content:
            application/problem+json:
              schema: {type: object}
  /ai/gateway:
    get:
      tags: [IA]
      summary: Disponibilidade, custo do mês e últimas chamadas do copiloto (AIA-001)
      description: >-
        O estado do gateway de modelos: se há provedor, quais modelos serão tentados e em que ordem,
        quanto do orçamento do mês já foi, e o que aconteceu nas últimas chamadas.


        **`enabled: false` é estado normal, não erro.** Uma instalação sem provedor de IA opera
        inteira — nenhuma recomendação é gerada e nenhum custo é lançado. É o default do produto.


        **`models` é ordenada:** o primeiro é o modelo preferido, os seguintes são o fallback
        tentado quando o provedor falha. Vazia quando não há provedor.


        **`budget.version` é para devolver.** Ela viaja para o cliente e volta em
        `PUT /ai/gateway/budget`: é assim que a alteração de uma pessoa não sobrescreve, sem aviso,
        a de outra. `0` significa que a cervejaria ainda não definiu teto próprio e está sob o
        padrão da instalação.


        **`recent` traz sucesso e falha, e nunca conteúdo.** Uma resposta recusada por formato
        aparece com custo — foi gerada, logo foi cobrada —, e é essa combinação que faz o total do
        mês corresponder ao gasto real. Prompt, resposta e trecho de documento não saem do backend
        em nenhum campo: são a parte sensível, e explicar custo e disponibilidade não precisa deles.
      responses:
        '200':
          description: Estado do gateway
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiGatewayStatus'}
        '403': {$ref: '#/components/responses/Problem'}
  /ai/gateway/probe:
    post:
      tags: [IA]
      summary: Verificar a conectividade do copiloto (AIA-001)
      description: >-
        Faz a menor chamada possível que ainda atravessa provedor, orçamento, contrato de resposta e
        registro de custo. Serve para separar em segundos as quatro causas de "a IA não respondeu",
        que pedem providências diferentes.


        **É POST porque gasta.** Uma verificação não é consulta: ela chama o modelo de verdade, é
        cobrada de verdade e gera linha no ledger como qualquer outra chamada. Tem permissão própria
        (`ai.gateway.probe`), separada da de consultar.


        Os status de erro dizem de quem é a providência: `501` provedor desligado (decisão de
        instalação, nada a repetir), `503` provedor fora do ar (transitório), `402` orçamento
        esgotado (subir o teto ou aguardar o mês) e `502` resposta fora do contrato (repetir não
        resolve — o prompt ou o schema precisa mudar).
      responses:
        '200':
          description: O modelo respondeu dentro do contrato
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProbeResult'}
        '402':
          description: "`ai_budget_exceeded` — o orçamento do mês foi esgotado; acompanha `monthlyLimit` e `spent`"
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
        '501':
          description: "`ai_provider_disabled` — não há provedor configurado nesta instalação"
          content:
            application/problem+json:
              schema: {type: object}
        '502':
          description: "`ai_response_rejected` — a resposta não satisfez o contrato e foi recusada inteira"
          content:
            application/problem+json:
              schema: {type: object}
        '503':
          description: "`ai_provider_unavailable` — o provedor não respondeu em nenhum dos modelos"
          content:
            application/problem+json:
              schema: {type: object}
  /ai/gateway/budget:
    put:
      tags: [IA]
      summary: Redefinir o teto de gasto mensal com IA (AIA-001)
      description: >-
        O teto é o freio contra custo imprevisível: uma chamada custa frações de centavo e um laço
        que erra chama mil vezes. Acima do teto as chamadas são recusadas **antes** de gastar.


        **Baixar o teto abaixo do que já foi gasto é permitido** e para as chamadas do resto do mês —
        é o freio funcionando, não um erro de entrada.


        `version` vem da leitura anterior (`GET /ai/gateway`). Divergência devolve `409` em vez de
        sobrescrever: teto de gasto é decisão, e passar por cima da decisão de alguém sem que ela
        saiba é pior do que pedir para tentar de novo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monthlyLimit, version]
              properties:
                monthlyLimit:
                  type: number
                  minimum: 0
                  description: "Teto do mês na moeda configurada da instalação."
                version:
                  type: integer
                  format: int64
                  description: "Versão lida; `0` quando ainda não havia teto próprio."
      responses:
        '200':
          description: Teto redefinido
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiBudget'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: "`ai_budget_stale` — o teto foi alterado por outra pessoa"
          content:
            application/problem+json:
              schema: {type: object}
  /sensors/devices:
    get:
      tags: [Sensores]
      summary: Dispositivos cadastrados nesta cervejaria (INT-001)
      responses:
        '200':
          description: Dispositivos
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SensorDevice'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Sensores]
      summary: Cadastrar dispositivo (INT-001)
      description: >-
        O dispositivo define **o que se espera receber**: grandeza, unidade e frequência.


        Deixar isso na mensagem seria confiar no que o dispositivo diz sobre si mesmo a cada envio, e um
        firmware atualizado que passasse a mandar Fahrenheit sem avisar trocaria a escala da série
        histórica inteira sem nenhum sinal. A mensagem que discorda do cadastro é **recusada, não
        convertida**.


        `expectedIntervalSeconds` é a régua do atraso: uma leitura que demora mais que isso para chegar é
        sinalizada como atrasada. Ausente, o atraso é medido e informado mas não julgado — afirmar atraso
        sem régua seria inventar um limiar.


        `code` é a identidade externa do aparelho — o que o firmware envia e o que está na etiqueta. É
        normalizado para maiúsculas: `ispindel-01` e `ISPINDEL-01` são o mesmo aparelho para quem instalou,
        e sem normalizar viram dois cadastros, duas séries e nenhuma completa.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterSensorDevice'}
      responses:
        '201':
          description: Dispositivo cadastrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorDevice'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /sensors/devices/{deviceId}/status:
    post:
      tags: [Sensores]
      summary: Pausar, retomar ou revogar dispositivo (INT-001)
      description: >-
        **A alçada depende do destino.** Pausar e retomar exigem `sensor.device.manage`; revogar exige
        `sensor.device.revoke`. Pausar é manutenção — o dispositivo volta com a mesma identidade e a mesma
        série. Revogar diz que aquela identidade não é mais confiável, e por isso é **terminal**: não há
        transição de saída, e o caminho de volta é cadastrar outro dispositivo.


        `expectedVersion` é bloqueio otimista: dois operadores decidindo o destino do mesmo dispositivo ao
        mesmo tempo não podem terminar com um deles achando que revogou algo que o outro reativou.
      parameters:
        - {name: deviceId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeSensorDeviceStatus'}
      responses:
        '200':
          description: Estado alterado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorDevice'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_sensor_device` — não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
        '409':
          description: >-
            `conflict` — versão desatualizada, transição inválida, ou dispositivo revogado
          content:
            application/problem+json:
              schema: {type: object}
  /sensors/readings:
    post:
      tags: [Sensores]
      summary: Receber leitura de um dispositivo (INT-001)
      description: >-
        **201 para leitura nova, 200 para repetida.** A distinção é a resposta certa a um reenvio: o
        dispositivo que não recebeu o ACK e tentou de novo fez a coisa certa, e responder erro o ensinaria
        a continuar tentando. O 200 diz "está registrado, pode parar" sem criar uma segunda linha, e
        devolve a leitura **original** — não a recém-montada —, preservando o `receivedAt` do primeiro
        envio.


        **A idempotência é decidida pela restrição única `(device_id, message_id)`**, não por uma consulta
        prévia. Verificar antes e inserir depois deixa uma janela entre as duas operações, e é exatamente
        nela que cai o reenvio de um gateway que despachou a mesma mensagem duas vezes em milissegundos —
        o cenário para o qual a idempotência existe.


        `messageId` é carimbado pelo dispositivo e **não** é hash do conteúdo: um hash trataria duas
        medições legitimamente idênticas — sensor parado, mesmo segundo, mesmo valor — como repetição, e
        descartaria uma leitura verdadeira.


        **Qualidade e atraso são sinalizados, nunca motivo de recusa.** Recusar uma leitura ruim não deixa
        "nada": deixa um buraco na curva, indistinguível de "o sensor não mediu". O que **é** recusado é o
        que não corresponde ao cadastro (grandeza ou unidade divergente, `400`) e o dispositivo que não
        está aceitando leituras (`409`) — erro de configuração e de estado não descrevem medição nenhuma.


        Não há `receivedAt` no corpo, de propósito: o instante de recebimento é nosso, e aceitá-lo do
        dispositivo permitiria a ele mascarar o próprio atraso.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IngestSensorReading'}
      responses:
        '201':
          description: Leitura nova registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorIngestResponse'}
        '200':
          description: Mensagem já registrada; devolve a leitura original sem criar outra
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorIngestResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_sensor_device` — não cadastrado nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
        '409':
          description: "`sensor_device_inactive` — dispositivo pausado ou revogado"
          content:
            application/problem+json:
              schema: {type: object}
  /sensors/devices/{deviceCode}/payload:
    post:
      tags: [Sensores]
      summary: Receber payload no formato do fabricante (INT-006)
      description: >-
        O corpo é **opaco**: é o que o aparelho mandou, e quem sabe interpretá-lo é o `payloadFormat`
        cadastrado no dispositivo. Um endpoint só, adivinhando o formato pelo conteúdo, acertaria quase
        sempre e erraria em silêncio quando dois fabricantes usassem o mesmo nome de campo com significados
        diferentes.


        **O formato é atributo do cadastro, não da mensagem.** Deixar o payload declarar o próprio formato
        seria confiar num campo que o firmware preenche — e uma atualização que mudasse a declaração passaria
        a ser interpretada de outro jeito sem que ninguém decidisse isso.


        **O dispositivo vem da URL, não do payload.** O `deviceId` de dentro da mensagem é informação do
        fabricante e serve para conferência; deixá-lo escolher permitiria a um gateway gravar na série de
        outro aparelho da mesma cervejaria.


        A tradução converte para o formato canônico (`contracts/sensor-reading.schema.json`) e delega a
        gravação ao caso de uso de INT-001 — com a idempotência, a qualidade e o atraso que já estavam lá.
        **As chaves das leituras derivam do identificador da mensagem**, então reenviar a mensagem inteira é
        reconhecido como repetição; uma chave sorteada por leitura faria do adapter o furo por onde a
        idempotência vaza.


        Sempre **202**: uma mensagem pode virar mais de uma leitura, e quem responde por criada ou repetida é
        cada leitura derivada. Um 201 prometeria uma criação que nem sempre houve.
      parameters:
        - {name: deviceCode, in: path, required: true, schema: {type: string, maxLength: 40}}
      requestBody:
        required: true
        description: O corpo como o aparelho manda. Formatos aceitos - CANONICAL, ISPINDEL, TILT
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '202':
          description: Mensagem traduzida; uma resposta por leitura derivada
          content:
            application/json:
              schema:
                type: object
                properties:
                  readings:
                    type: array
                    items: {$ref: '#/components/schemas/SensorIngestResponse'}
        '400':
          description: >-
            Campo obrigatório ausente, valor não numérico, ou mensagem sem a grandeza que o dispositivo
            está cadastrado para medir. O erro nomeia o CAMPO — quem configura um gateway precisa saber
            qual está errado
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_sensor_device`"
          content:
            application/problem+json:
              schema: {type: object}
        '409':
          description: "`sensor_device_inactive`"
          content:
            application/problem+json:
              schema: {type: object}
  /sensors/devices/{deviceId}/readings:
    get:
      tags: [Sensores]
      summary: Leituras de um dispositivo numa janela (INT-001)
      description: >-
        **A janela é por instante de medição, não de chegada.** Quem pergunta "o que aconteceu no tanque
        entre 8h e 12h" quer os fatos daquele intervalo, não as mensagens que chegaram nele. Uma leitura
        das 9h represada por queda de rede e entregue às 14h pertence à janela da manhã — filtrar pela
        chegada a esconderia justamente de quem investiga por que a curva tem um buraco.


        Ausentes, `from` e `to` cobrem as últimas 24 horas. Uma série de sensor não tem fim, e um endpoint
        sem recorte padrão fica lento em produção três meses depois de entrar no ar.
      parameters:
        - {name: deviceId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, default: 500, maximum: 1000}}
      responses:
        '200':
          description: Leituras, da mais recente para a mais antiga
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SensorReading'}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_sensor_device` — não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
  /integration/webhooks:
    get:
      tags: [Integrações]
      summary: Webhooks configurados nesta cervejaria (INT-002)
      responses:
        '200':
          description: Assinaturas. Nunca inclui o segredo — só a dica dele
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/WebhookSubscription'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Integrações]
      summary: Criar webhook (INT-002)
      description: >-
        **Devolve o segredo uma única vez.** Mesmo raciocínio de uma API key: ele precisa chegar a quem vai
        configurar o outro lado, e depois disso não há motivo legítimo para lê-lo de volta. Manter um
        caminho de leitura seria manter uma porta que só serve para vazar. Quem o perde cria outro webhook.


        O segredo é **gerado pelo servidor**, não recebido: aceitá-lo do cliente significaria aceitar
        "senha123" com aparência de configuração legítima, e a assinatura HMAC só prova alguma coisa
        enquanto o segredo é imprevisível.


        **Só `https`.** A assinatura protege a integridade do corpo, não o sigilo dele: um webhook em HTTP
        puro entrega em texto claro o que aconteceu na cervejaria para qualquer um no caminho.


        `events` é uma **allowlist fechada** (ver `/integration/webhooks/event-types`). Publicar "todo
        evento de domínio" pareceria flexível e seria o contrário — cada evento novo vazaria para fora sem
        ninguém decidir que deveria.


        Esta é a operação **crítica** da história: ela aponta um fluxo de dados da cervejaria para um
        endereço de fora. Por isso exige `integration.webhook.manage`, enquanto pausar e revogar, que
        *interrompem* esse fluxo, exigem apenas `integration.webhook.read`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWebhook'}
      responses:
        '201':
          description: Criado. O campo `secret` não volta a aparecer em nenhuma outra resposta
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedWebhook'}
        '400':
          description: "`bad_request` — destino não-https, sem evento, ou tipo fora da allowlist"
          content:
            application/problem+json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Problem'}
  /integration/webhooks/event-types:
    get:
      tags: [Integrações]
      summary: Tipos de evento que podem ser assinados (INT-002)
      description: >-
        A allowlist fechada. O nome externo é separado do nome da classe de domínio de propósito: renomear
        `BrewOrderReleased` é refatoração nossa e não pode quebrar o endpoint de um cliente.
      responses:
        '200':
          description: Nomes externos estáveis
          content:
            application/json:
              schema: {type: array, items: {type: string}}
        '403': {$ref: '#/components/responses/Problem'}
  /integration/webhooks/{subscriptionId}/status:
    post:
      tags: [Integrações]
      summary: Pausar, reativar ou revogar webhook (INT-002)
      description: >-
        **Pausar e revogar exigem só leitura; reativar exige `integration.webhook.manage`.** A assimetria é
        deliberada: uma alçada difícil para "parar de mandar" produziria o incentivo errado exatamente no
        momento em que se descobre que o destino foi comprometido. Reativar volta a mandar dados para fora,
        e por isso tem a alçada de criar.


        **Pausar não descarta a fila.** Diz "pare de me mandar coisa nova", não "esqueça o que já
        aconteceu" — descartar entregas pendentes faria uma pausa de cinco minutos para manutenção perder
        eventos em silêncio.


        Revogar é **terminal**: nada mais é entregue, inclusive o que estava na fila, e não há transição de
        volta.
      parameters:
        - {name: subscriptionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeWebhookStatus'}
      responses:
        '200':
          description: Estado alterado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSubscription'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_webhook_subscription` — não existe nesta cervejaria"
          content:
            application/problem+json:
              schema: {type: object}
        '409':
          description: "`conflict` — versão desatualizada ou transição inválida"
          content:
            application/problem+json:
              schema: {type: object}
  /integration/webhooks/{subscriptionId}/deliveries:
    get:
      tags: [Integrações]
      summary: Entregas recentes de um webhook (INT-002)
      description: >-
        É onde se vê o que falhou, quantas vezes e por quê.


        **Entrega `EXHAUSTED` não é apagada.** Uma entrega que desiste em silêncio é a pior forma de falha
        de integração: o outro lado nunca soube do evento, e nós também não sabemos que ele não soube. A
        linha fica, com o último erro e a contagem.
      parameters:
        - {name: subscriptionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
      responses:
        '200':
          description: Entregas, da mais recente para a mais antiga
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/WebhookDelivery'}}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: "`unknown_webhook_subscription`"
          content:
            application/problem+json:
              schema: {type: object}
  /integration/scan:
    get:
      tags: [Integrações]
      summary: Resolver um código lido de etiqueta (INT-003)
      description: >-
        **O código não concede acesso, e essa é a história.** Ele carrega apenas *o quê* — tipo e
        identificador —, nunca um token, uma assinatura ou uma credencial. A razão é física: um QR colado
        num tanque é legível por qualquer pessoa que entre na sala, fotografável de longe e copiável para
        outra etiqueta. Qualquer segredo impresso nele é um segredo público.


        Ler o código é fazer uma pergunta que **ainda precisa ser autorizada**: a sessão é exigida antes de
        tudo, e a permissão é verificada *depois* de interpretar o código — porque só aí se sabe qual
        permissão é. A alçada exigida é a do **tipo apontado** (`equipment.read`, `production.batch.read`,
        `planning.order.read`, `packaging.plan.read`), a mesma de quem chega pelo menu.


        Código legível por alguém sem a alçada responde **403**, não uma lista vazia nem 404. A pessoa
        apontou a câmera para uma etiqueta real; a resposta honesta é que ela não pode ver aquilo, não que
        aquilo não existe.


        **Este endpoint é um roteador, não uma porta.** Ele não carrega o recurso: quem responde pelo
        equipamento, pelo lote, pela OP e pela embalagem são os módulos donos deles, e é lá que a cervejaria
        e o estado são verificados. Duplicar a verificação aqui criaria uma segunda autoridade sobre a mesma
        pergunta — e duas autoridades divergem com o tempo.


        **Formato:** `brassia://<tipo>/<identificador>`, com segmentos extras ignorados. O esquema já
        existia nas etiquetas de envase (PKG-004), que imprimem
        `brassia://lote/<código>/envase/<plano>` — a tolerância ao sufixo é o que permite ler as etiquetas
        já coladas em vez de invalidá-las.


        É `GET` porque ler não altera nada, e é isso que permite ao QR conter um link que o aplicativo de
        câmera do telefone abre sozinho — sem instalar nada e sem biblioteca de leitura do nosso lado.
      parameters:
        - name: code
          in: query
          required: true
          schema: {type: string, maxLength: 200}
          example: brassia://equipamento/TANQUE-01
      responses:
        '200':
          description: Código reconhecido e autorizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScanResolution'}
        '403':
          description: >-
            O código é válido, mas falta a permissão do tipo apontado. Dito assim de propósito — mandar
            para uma tela vazia faria quem leu procurar o problema na etiqueta
          content:
            application/problem+json:
              schema: {type: object}
        '422':
          description: >-
            `unknown_scan_code` — conteúdo ilegível, tipo desconhecido ou identificador inválido. A mensagem
            é a mesma para todos os motivos: distingui-los ensinaria quais tipos existem a quem sonda
          content:
            application/problem+json:
              schema: {type: object}
  /digital-twin/profiles:
    post:
      tags: [Perfil aprendido]
      summary: Calcular uma versão do perfil aprendido de uma receita (DTW-001)
      description: >-
        **A amostra é informada, não descoberta.** Parece limitação e é propriedade: quem conhece a operação
        pode excluir o lote em que a bomba falhou, e o perfil registra exatamente quais lotes entraram — o
        que torna a exclusão visível em vez de silenciosa. Um cálculo sobre "todos os lotes" esconderia essa
        decisão dentro de uma consulta.


        **Nenhum número é recalculado.** Volume planejado, transferido e perda vêm das consultas publicadas
        da produção; recalcular criaria uma segunda opinião sobre o mesmo fato. Este endpoint *resume*.


        **Lote sem transferência é excluído, nunca contado como zero.** Um lote que ainda está fervendo não
        rendeu 0% — ele ainda não rendeu. Contá-lo como zero arrastaria a média para baixo e, pior,
        encolheria a faixa, dando aparência de certeza a um número envenenado. O mesmo vale para lote de
        outra receita ou de outra cervejaria.


        **A versão é derivada**, nunca informada: deixar o cliente escolher abriria a porta para duas
        "versão 3" do mesmo perfil. E versão nova nunca sobrescreve a anterior — um perfil calculado em maio
        guiou decisões em maio.


        Exige `digitaltwin.profile.compute`, separada de ler: **calcular escolhe a amostra, e a amostra
        decide o número.**
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputeLearnedProfile'}
      responses:
        '201':
          description: Versão nova do perfil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LearnedProfile'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422':
          description: >-
            `empty_learning_sample` — nenhum dos lotes informados serve. 422 e não 400: a requisição está
            bem formada, o que não serve é a amostra, e a distinção importa para quem opera
          content:
            application/problem+json:
              schema: {type: object}
  /digital-twin/profiles/{recipeId}:
    get:
      tags: [Perfil aprendido]
      summary: Perfil vigente de uma receita (DTW-001)
      description: >-
        **204 quando não há perfil.** Um corpo vazio ou um perfil de zeros diria que a receita foi analisada
        e não rendeu nada — que é diferente de nunca ter sido analisada.
      parameters:
        - {name: recipeId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Perfil vigente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LearnedProfile'}
        '204': {description: Esta receita ainda não tem perfil}
        '403': {$ref: '#/components/responses/Problem'}
  /digital-twin/profiles/{recipeId}/history:
    get:
      tags: [Perfil aprendido]
      summary: Histórico de versões do perfil (DTW-001)
      description: >-
        É onde se vê o perfil mudar conforme a operação muda. Versões antigas nunca são sobrescritas nem
        apagadas.
      parameters:
        - {name: recipeId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Da versão mais recente para a mais antiga
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LearnedProfile'}}
        '403': {$ref: '#/components/responses/Problem'}
  /digital-twin/control-charts:
    post:
      tags: [Perfil aprendido]
      summary: Carta de controle de uma grandeza ao longo de vários lotes (SPC-001)
      description: >-
        **Limite de controle não é especificação, e a diferença não é de fórmula — é de origem.**


        *Especificação* vem de uma **decisão**: o estilo pede FG entre 1.010 e 1.014, o cliente aceita no
        máximo 50 ppb de oxigênio. Está no plano de controle da qualidade e não se calcula, se escolhe.


        *Controle* vem de **observação**: é o que este processo, com este equipamento e esta equipe, produz
        quando nada de anormal acontece. Calcula-se do histórico e não se escolhe.


        As duas combinações que a confusão esconde são as que importam. **Sob controle e fora de
        especificação**: o processo é estável e está estavelmente errado — nenhum ponto dispara alarme e a
        cerveja está fora do prometido. **Fora de controle e dentro de especificação**: tudo passa na
        inspeção e o processo está mudando — é o aviso que chega antes do problema, e é justamente ele que
        se perde quando se usa o limite da especificação como limite de controle.


        Por isso **a resposta não tem campo para especificação**: os limites vêm calculados da própria
        série, e não há como injetar um número escolhido.


        **A série atravessa os lotes**, ordenada pelo instante da medição: uma carta é sobre o *processo*,
        e o momento em que ele muda cai entre dois lotes tanto quanto dentro de um.


        Três sinais são procurados: ponto além de 3σ; **sete pontos seguidos do mesmo lado da linha
        central** (deslocamento — nenhum precisa estar perto de um limite, e é o caso que a inspeção ponto a
        ponto não pega); e **sete pontos seguidos subindo ou descendo** (tendência — o aviso mais
        antecipado, geralmente antes de qualquer ponto sair da faixa).


        É `POST` e não `GET` por causa do tamanho da amostra: dezenas de lotes numa query string estouram
        limite de URL em produção. Nada é gravado — uma carta é leitura da série que já existe.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnalyzeControlChart'}
      responses:
        '200':
          description: A carta, com limites calculados e sinais encontrados
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlChart'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422':
          description: >-
            `insufficient_control_history` — menos de 20 medições. Recusar é melhor que devolver limites
            frouxos: limites sobre cinco pontos passam qualquer coisa, e um controle que nunca dispara
            parece um processo saudável. Ou `mixed_units_in_series` — converter em silêncio pertence a quem
            registrou a medição, não a quem lê a série
          content:
            application/problem+json:
              schema: {type: object}
  /experiments:
    get:
      tags: [Experimentos]
      summary: Lista experimentos de lote dividido (EXP-001)
      parameters:
        - {name: recipeId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Experimentos da cervejaria, mais recentes primeiro
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Experiment'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Experimentos]
      summary: Planeja um lote dividido (EXP-001)
      description: >-
        **Exatamente um fator pode diferir entre controle e variante.** Com dois fatores diferentes,
        qualquer resultado tem duas explicações e nenhuma pode ser descartada — o experimento produz uma
        conclusão que parece conhecimento e não é. Por isso o plano é recusado na criação, em vez de
        aceito com um aviso que se perde.


        Os fatores **iguais** também são declarados. "O resto ficou igual" é a afirmação sobre a qual toda
        a conclusão se apoia, e sem os iguais registrados ninguém pode conferi-la meses depois.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanExperiment'}
      responses:
        '201':
          description: Experimento planejado, já com as limitações do desenho
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            `experiment_pair_already_active` — o mesmo par de lotes já está em outro experimento em
            andamento. Dois experimentos sobre o mesmo par testam variáveis diferentes nos mesmos lotes,
            e aí nenhuma das duas está isolada
          content:
            application/problem+json:
              schema: {type: object}
        '422':
          description: >-
            `confounded_experiment` — mais de um fator difere, ou nenhum difere. Ou
            `invalid_experiment_subject` — os lotes são de outra receita, e a diferença medida seria das
            receitas e não do fator isolado
          content:
            application/problem+json:
              schema: {type: object}
  /experiments/{experimentId}:
    get:
      tags: [Experimentos]
      summary: Um experimento (EXP-001)
      parameters:
        - {name: experimentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: O experimento
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /experiments/{experimentId}/start:
    post:
      tags: [Experimentos]
      summary: Inicia o experimento (EXP-001)
      parameters:
        - {name: experimentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Experimento em andamento
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /experiments/{experimentId}/conclusion:
    post:
      tags: [Experimentos]
      summary: Registra a leitura do experimento (EXP-001)
      description: >-
        **Não há campo de limitações neste contrato, e é deliberado.** Elas são derivadas do desenho do
        experimento e vão na resposta sempre. Limitação que depende de alguém lembrar de escrevê-la some
        justamente quando o resultado agrada.


        Exige `experiment.plan.conclude`, separada de planejar: concluir define o que a cervejaria vai
        passar a acreditar sobre a própria receita.
      parameters:
        - {name: experimentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConcludeExperiment'}
      responses:
        '200':
          description: Experimento concluído, com as limitações que a conclusão carrega
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /experiments/{experimentId}/abandon:
    post:
      tags: [Experimentos]
      summary: Abandona o experimento (EXP-001)
      description: >-
        Não apaga: um experimento abandonado é informação — alguém já tentou isto e parou. Apagar faria a
        próxima pessoa repetir a mesma tentativa sem saber que ela existiu.
      parameters:
        - {name: experimentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Experimento abandonado, preservado no histórico
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /blends:
    get:
      tags: [Blend e reprocesso]
      summary: Lista operações de união e divisão (BLD-001)
      responses:
        '200':
          description: Operações da cervejaria, mais recentes primeiro
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/BlendOperation'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Blend e reprocesso]
      summary: Simula uma união ou divisão (BLD-001)
      description: >-
        **O balanço fecha aqui, não na execução.** Simular é o único momento barato: depois de mover
        cerveja entre tanques, descobrir que faltam 40 litros não desfaz a mistura.


        Entrada tem de igualar saída mais a perda declarada, com tolerância de 0,10 L — que é o limite da
        instrumentação, não folga para erro. Exigir igualdade exata recusaria operações corretas por
        arredondamento e treinaria quem opera a inflar a perda até a conta passar, destruindo o valor do
        próprio campo.


        A simulação é gravada: uma proposta que some não pode ser aprovada depois.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulateBlendOperation'}
      responses:
        '201':
          description: Simulação registrada. Nada foi movido
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlendOperation'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422':
          description: >-
            `unbalanced_blend` — a conta não fecha; a resposta traz as três parcelas e a diferença, porque
            a correção é aritmética. Ou `unknown_blend_batch` — um dos lotes não existe nesta cervejaria
          content:
            application/problem+json:
              schema: {type: object}
  /blends/{operationId}:
    get:
      tags: [Blend e reprocesso]
      summary: Uma operação (BLD-001)
      parameters:
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: A operação
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlendOperation'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /blends/{operationId}/approval:
    post:
      tags: [Blend e reprocesso]
      summary: Aprova a operação (BLD-001)
      description: >-
        Exige `blend.operation.approve`, permissão crítica. Aprovar é separado de executar porque são
        decisões de pessoas diferentes em momentos diferentes: uma autoriza misturar, a outra abre a
        válvula.
      parameters:
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Operação aprovada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlendOperation'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /blends/{operationId}/execution:
    post:
      tags: [Blend e reprocesso]
      summary: Executa a operação (BLD-001)
      description: >-
        **Irreversível, e é aqui que a genealogia passa a valer.** A partir da execução, um recall que
        alcança qualquer um dos lotes alcança os demais — ninguém dispara esse recálculo: ele é
        consequência da aresta de genealogia existir.


        Antes disso nenhuma cerveja se tocou, e uma aresta prematura faria o recall exagerar. Recall que
        exagera é descartado por quem o recebe, o que o torna tão inútil quanto um que falta.


        Exige `blend.operation.execute`, permissão crítica.
      parameters:
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Operação executada; a genealogia passou a valer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlendOperation'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            `illegal_blend_transition` — tipicamente outra pessoa já executou. Insistir significaria
            misturar a cerveja duas vezes
          content:
            application/problem+json:
              schema: {type: object}
  /blends/{operationId}/discard:
    post:
      tags: [Blend e reprocesso]
      summary: Descarta a operação (BLD-001)
      description: >-
        Executada não se descarta: a cerveja já está misturada, e apagar deixaria dois lotes com volume
        alterado e nenhuma explicação.
      parameters:
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Operação descartada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlendOperation'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /field-feedback/complaints:
    get:
      tags: [Feedback de campo]
      summary: Lista reclamações de campo (FLD-001)
      description: >-
        A resposta **não contém dado pessoal** — nem no detalhe, nem na lista. Nome, telefone e endereço
        vêm de `/contact`, com permissão própria e leitura auditada.
      parameters:
        - {name: batchId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Reclamações da cervejaria, mais recentes primeiro
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FieldComplaint'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Feedback de campo]
      summary: Registra uma reclamação (FLD-001)
      description: >-
        **A severidade e a categoria determinam o que o caso vai exigir**, e a lista não é escolhida por
        quem registra. Corpo estranho e alegação de mal-estar exigem quarentena e investigação de causa
        mesmo classificados com severidade baixa — quem registra pode subestimar por não querer alarmar,
        e uma exigência que dependesse só da severidade cairia junto com essa classificação.


        O contato é **opcional**: reclamação anônima é reclamação. Exigir identificação para registrar um
        corpo estranho coletaria dado desnecessário e perderia o relato de quem não quis se identificar.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterComplaint'}
      responses:
        '201':
          description: Reclamação registrada, já com as ações que ela exige
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldComplaint'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422':
          description: '`unknown_complaint_batch` — o lote não existe nesta cervejaria'
          content:
            application/problem+json:
              schema: {type: object}
  /field-feedback/complaints/{complaintId}:
    get:
      tags: [Feedback de campo]
      summary: Uma reclamação (FLD-001)
      parameters:
        - {name: complaintId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: A reclamação, sem dado pessoal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldComplaint'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /field-feedback/complaints/{complaintId}/analysis:
    post:
      tags: [Feedback de campo]
      summary: Coloca a reclamação em análise (FLD-001)
      parameters:
        - {name: complaintId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Em análise
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldComplaint'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /field-feedback/complaints/{complaintId}/actions/{action}/fulfillment:
    post:
      tags: [Feedback de campo]
      summary: Registra que a ação exigida foi atendida (FLD-001)
      description: >-
        Exige `referenceId` apontando para o que foi criado — a quarentena, a investigação. Sem ela, a
        afirmação "atendida" não teria contra o que ser conferida.
      parameters:
        - {name: complaintId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: action, in: path, required: true,
           schema: {type: string, enum: [QUARANTINE, ROOT_CAUSE_ANALYSIS]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [referenceId]
              properties:
                referenceId: {type: string, format: uuid}
      responses:
        '200':
          description: Ação registrada como atendida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldComplaint'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /field-feedback/complaints/{complaintId}/actions/{action}/waiver:
    post:
      tags: [Feedback de campo]
      summary: Dispensa a ação exigida (FLD-001)
      description: >-
        A dispensa é legítima — às vezes o corpo estranho era do copo do consumidor —, mas custa uma
        justificativa que diga por quê. Sem o mínimo, a dispensa seria indistinguível de esquecimento, e o
        histórico mostraria dezenas de reclamações graves "sem quarentena" sem dizer se alguém decidiu
        isso ou se ninguém olhou. A justificativa vai inteira para a auditoria.
      parameters:
        - {name: complaintId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: action, in: path, required: true,
           schema: {type: string, enum: [QUARANTINE, ROOT_CAUSE_ANALYSIS]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justification]
              properties:
                justification: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Dispensa registrada, com autor e data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldComplaint'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /field-feedback/complaints/{complaintId}/closure:
    post:
      tags: [Feedback de campo]
      summary: Encerra a reclamação (FLD-001)
      description: >-
        **Recusado enquanto houver ação exigida sem destino.** É o que impede uma reclamação de corpo
        estranho de ser encerrada como "cliente contatado, caso resolvido" no dia em que se está com
        pressa — que é exatamente o dia em que isso acontece.
      parameters:
        - {name: complaintId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Reclamação encerrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldComplaint'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422':
          description: >-
            `pending_required_actions` — a resposta lista quais faltam, porque as duas saídas legítimas
            são opostas: atender, ou dispensar por escrito
          content:
            application/problem+json:
              schema: {type: object}
  /field-feedback/complaints/{complaintId}/contact:
    get:
      tags: [Feedback de campo]
      summary: Dados pessoais de quem reclamou (FLD-001)
      description: >-
        Endpoint próprio e permissão crítica própria (`feedback.contact.read`). Quem analisa off-flavor
        precisa do lote, da armazenagem e da amostra — não do endereço do consumidor; uma permissão única
        faria todo analista ler dado pessoal de graça, todo dia.


        **Cada chamada é auditada**, inclusive quando não há contato: registrar só o acerto deixaria de
        fora quem varre reclamações procurando dados.


        Depois do apagamento devolve os campos vazios com `erased: true`, e não 404 — distinguir "nunca
        houve contato" de "os dados foram apagados" é um fato que precisa ser demonstrável, inclusive para
        quem pediu o apagamento.
      parameters:
        - {name: complaintId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: O contato, ou o registro de que ele foi apagado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComplainantContact'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Feedback de campo]
      summary: Apaga os dados pessoais a pedido (FLD-001)
      description: >-
        Esvazia o contato e **preserva a reclamação**. É o desenho inteiro da história: a investigação de
        um corpo estranho precisa durar anos, o telefone de quem ligou não. Exige
        `feedback.contact.erase`.
      parameters:
        - {name: complaintId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Dados pessoais apagados; a reclamação permanece}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /optimizations:
    get:
      tags: [Otimização assistida]
      summary: Lista corridas de otimização (OPT-001)
      parameters:
        - {name: recipeId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Corridas da cervejaria, mais recentes primeiro
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/OptimizationRun'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Otimização assistida]
      summary: Executa uma otimização (OPT-001)
      description: >-
        **Um objetivo por vez.** Custo, disponibilidade e alvo técnico se contradizem — otimizar os três
        entregaria uma média ponderada por pesos que ninguém escolheu, apresentada como ótimo.


        **Restrições descartam; o objetivo ordena.** Uma alternativa que viola qualquer restrição é
        eliminada antes de qualquer score. Somá-la ao score com peso alto pareceria equivalente e não é:
        um peso é sempre comprável por um ganho maior, e aí o resultado sai como ótimo tendo quebrado o
        que não podia.


        **Responde 201 mesmo sem solução.** Inviabilidade é resultado, não erro: a corrida aconteceu, ficou
        registrada, e o corpo diz quais restrições se contradizem. Um 4xx faria a tela tratá-la como falha
        e perder a informação que a torna acionável.


        A entrada é a **versão publicada** da receita. Otimizar rascunho apontaria para uma composição que
        muda enquanto se otimiza.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OptimizeRequest'}
      responses:
        '201':
          description: Corrida registrada — com alternativas, ou com a inviabilidade explicada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OptimizationRun'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422':
          description: '`unpublished_recipe` — a receita não tem versão publicada'
          content:
            application/problem+json:
              schema: {type: object}
  /optimizations/{runId}:
    get:
      tags: [Otimização assistida]
      summary: Uma corrida (OPT-001)
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: A corrida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OptimizationRun'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /optimizations/{runId}/explanation:
    post:
      tags: [Otimização assistida]
      summary: Anexa a explicação em linguagem natural (OPT-001)
      description: >-
        **Rota separada, e só recebe texto.** A explicação chega depois do resultado existir e não tem por
        onde alterar o score. Gerá-la dentro da otimização deixaria a fronteira dependendo de disciplina de
        quem escreve o código, em vez da forma do contrato — e ninguém saberia qual dos dois produziu a
        recomendação.
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [explanation]
              properties:
                explanation: {type: string, maxLength: 4000}
      responses:
        '200':
          description: Explicação anexada; nenhum score muda
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OptimizationRun'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /optimizations/{runId}/application:
    post:
      tags: [Otimização assistida]
      summary: Registra que uma alternativa virou versão de receita (OPT-001)
      description: >-
        **Recebe o id de uma versão já criada — não cria nada.** Nenhuma solução é aplicada sem revisão: a
        versão nova nasce no módulo de receita, por uma pessoa, e aqui fica só o ponteiro. Se o otimizador
        pudesse escrever na receita, "revisado" viraria um campo que alguém marca em vez de um ato que
        alguém pratica.


        Permissão crítica: mesmo sendo um ponteiro, ela declara que aquela alternativa passou a valer.
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipeVersionId]
              properties:
                recipeVersionId: {type: string, format: uuid}
      responses:
        '200':
          description: Aplicação registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OptimizationRun'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: '`illegal_optimization_state` — já aplicada, ou corrida inviável'
          content:
            application/problem+json:
              schema: {type: object}
  /crm/customers:
    get:
      tags: [CRM]
      summary: Clientes da cervejaria (CRM-001)
      parameters:
        - name: onlyActive
          in: query
          schema: {type: boolean, default: true}
          description: Cliente desativado continua existindo; ele só sai da lista padrão.
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CrmCustomer'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [CRM]
      summary: Cadastrar cliente
      description: >-
        **`taxId` não é validado** (DEC-CRM-002). Cliente estrangeiro não tem CNPJ, e recusar cadastro por
        formato seria a plataforma decidindo com quem a cervejaria pode vender. O cadastro também costuma
        nascer antes de o documento chegar, e travar aqui empurraria o vendedor a inventar um número — o
        que é pior que campo vazio, porque parece preenchido.


        Único **por cervejaria** quando existe, garantido por índice parcial: dois clientes sem documento
        não são duplicata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalName]
              properties:
                legalName: {type: string, maxLength: 200}
                tradeName: {type: string, maxLength: 200, nullable: true}
                taxId: {type: string, maxLength: 40, nullable: true}
      responses:
        '201':
          description: Cliente criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: '`crm_duplicate_tax_id` — o documento já está cadastrado nesta cervejaria'
          content:
            application/problem+json:
              schema: {type: object}
  /crm/customers/{id}:
    get:
      tags: [CRM]
      summary: Um cliente
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Cliente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CrmCustomer'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: >-
            `crm_not_found` — **e também quando o cliente é de outra cervejaria**. Distinguir os dois
            casos confirmaria que o identificador existe em algum lugar, o que é um oráculo de existência
            atravessando a fronteira entre cervejarias.
          content:
            application/problem+json:
              schema: {type: object}
    put:
      tags: [CRM]
      summary: Renomear cliente
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalName]
              properties:
                legalName: {type: string, maxLength: 200}
                tradeName: {type: string, maxLength: 200, nullable: true}
      responses:
        '200': {description: Cliente renomeado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /crm/customers/{id}/active:
    put:
      tags: [CRM]
      summary: Ativar ou desativar cliente
      description: >-
        **Não existe DELETE de cliente.** Remover deixaria pedido e expedição apontando para o nada, e é o
        histórico de expedição que um recall percorre para saber a quem avisar. Desativar tira das listas
        de venda e mantém o passado legível.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: {type: boolean}
      responses:
        '200': {description: Situação alterada}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /crm/customers/{id}/contacts:
    get:
      tags: [CRM]
      summary: Contatos do cliente
      description: >-
        A permissão vem **por finalidade**, e não como um indicador único. Um só booleano obrigaria a tela
        a escolher qual finalidade representar, e ela escolheria errado metade das vezes.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Contatos
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CrmContact'}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [CRM]
      summary: Cadastrar contato
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 160}
                email: {type: string, format: email, maxLength: 254, nullable: true}
                phone: {type: string, maxLength: 40, nullable: true}
                role: {type: string, maxLength: 80, nullable: true}
      responses:
        '201':
          description: Contato criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /crm/customers/contacts/{contactId}/consents:
    post:
      tags: [CRM]
      summary: Registrar decisão de consentimento (CRM-001)
      description: >-
        **`decidedAt` é obrigatório e vem de fora.** Deixar o servidor carimbar o instante transformaria
        "ela aceitou na segunda, registramos na quarta" em "ela aceitou na quarta", e o livro passaria a
        contar a história da digitação em vez da do mundo.


        **`purpose` só aceita finalidade que se apoia em consentimento.** `TRANSACTIONAL` se apoia em
        contrato e é recusada com 400: registrá-la daria a entender que o aviso de entrega depende de
        consentimento, e abriria a porta para alguém revogá-lo — a cervejaria ficaria proibida de cumprir
        o que vendeu.


        **Revogar não apaga.** O livro só cresce, e é isso que responde à pergunta da auditoria: *ela
        aceitava quando mandamos aquilo?*
      parameters:
        - name: contactId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, granted, decidedAt, source]
              properties:
                purpose: {type: string, enum: [MARKETING, SURVEY]}
                granted: {type: boolean}
                decidedAt: {type: string, format: date-time}
                source:
                  type: string
                  maxLength: 200
                  description: >-
                    Como se sabe que ela decidiu. Obrigatório: consentimento que não se consegue
                    demonstrar vale o mesmo que nenhum.
      responses:
        '204': {description: Decisão registrada}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: '`crm_contact_anonymized` — não há a quem pedir consentimento'
          content:
            application/problem+json:
              schema: {type: object}
  /crm/customers/contacts/{contactId}/anonymize:
    post:
      tags: [CRM]
      summary: Anonimizar contato a pedido do titular
      description: >-
        **Irreversível, e com alçada própria** (`crm.contact.anonymize`, crítica): apagar uma pessoa não é
        o mesmo ato de cadastrar um contato.


        **Apaga a pessoa e mantém a casca.** O identificador continua existindo, e com ele continuam as
        expedições e os pedidos que apontam para cá — a diferença entre "esta entrega foi para alguém que
        pediu para ser esquecido" e um buraco no histórico que ninguém sabe explicar.


        **O histórico de consentimento fica.** Parece contraditório apagar a pessoa e manter o que ela
        decidiu, mas é o contrário: é o registro de que ela pediu para sair, e sem ele a cervejaria não
        demonstra que atendeu ao pedido.


        Depois disso o contato não recebe nada, **nem transacional**: a base contratual autoriza mandar o
        aviso de entrega, ela não cria um endereço para onde mandar.
      parameters:
        - name: contactId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Contato anonimizado}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: '`crm_contact_anonymized` — já foi anonimizado'
          content:
            application/problem+json:
              schema: {type: object}
  /crm/retention-policy:
    get:
      tags: [CRM]
      summary: Prazo de guarda de dado pessoal (CRM-001)
      description: >-
        `daysAfterLastInteraction` nulo significa que **a casa não decidiu** — e, enquanto não decidir,
        nada expira. Não anonimizar por falta de decisão é reversível; anonimizar cedo demais não é.
      responses:
        '200':
          description: Política vigente
          content:
            application/json:
              schema:
                type: object
                properties:
                  daysAfterLastInteraction: {type: integer, nullable: true}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [CRM]
      summary: Definir o prazo de retenção
      description: >-
        Alçada `crm.retention.manage`, **crítica e separada do cadastro**: quem atende o balcão não
        deveria conseguir encurtar o prazo de guarda da base inteira.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [daysAfterLastInteraction]
              properties:
                daysAfterLastInteraction: {type: integer, exclusiveMinimum: 0}
      responses:
        '200': {description: Prazo definido}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /sales/products:
    get:
      tags: [Vendas]
      summary: Produtos da cervejaria (SAL-001)
      parameters:
        - name: onlyActive
          in: query
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: Produtos
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SalesProduct'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Vendas]
      summary: Cadastrar produto
      description: >-
        **Produto não é lote.** "IPA lata 473 ml" é identidade comercial: existe antes da primeira brassa,
        sobrevive a todos os lotes e é o que aparece numa lista de preço. Se fossem a mesma coisa, cada
        envase criaria um item de catálogo novo e a lista de preço precisaria ser refeita a cada brassa.


        O `sku` é normalizado para maiúsculas — `ipa-473` e `IPA-473` são o mesmo código no mundo real — e
        é único por cervejaria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, recipeId, containerId]
              properties:
                sku: {type: string, maxLength: 40}
                name: {type: string, maxLength: 160}
                recipeId: {type: string, format: uuid}
                containerId: {type: string, format: uuid}
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: '`sales_duplicate_code` — o SKU já existe nesta cervejaria (extensão `conflictingCode`)'
          content:
            application/problem+json:
              schema: {type: object}
  /sales/products/{id}:
    put:
      tags: [Vendas]
      summary: Renomear produto
      description: O SKU não muda — é a identidade que o pedido antigo carrega. O nome é apresentação.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 160}
      responses:
        '200': {description: Produto renomeado}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /sales/products/{id}/active:
    put:
      tags: [Vendas]
      summary: Descontinuar ou restaurar produto
      description: >-
        **Não existe DELETE.** Pedido antigo aponta para o produto, e um pedido cujo item não existe mais
        é um histórico que ninguém consegue explicar.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: {type: boolean}
      responses:
        '200': {description: Situação alterada}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /sales/channels:
    get:
      tags: [Vendas]
      summary: Canais de venda (SAL-001)
      parameters:
        - name: onlyActive
          in: query
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: Canais
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SalesChannel'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Vendas]
      summary: Cadastrar canal
      description: >-
        **Canal é cadastro, e não lista fixa.** A segmentação de uma cervejaria que vende no próprio
        taproom e para dois distribuidores não é a de uma que exporta e atende rede de supermercado. Uma
        lista fixa no código exigiria migration para a cervejaria poder vender por um canal a mais.


        É o canal que faz a mesma cerveja ter preços diferentes sem que isso seja inconsistência.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: {type: string, maxLength: 30}
                name: {type: string, maxLength: 120}
      responses:
        '201':
          description: Canal criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /sales/channels/{id}/active:
    put:
      tags: [Vendas]
      summary: Ativar ou desativar canal
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: {type: boolean}
      responses:
        '200': {description: Situação alterada}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /sales/products/{id}/prices:
    get:
      tags: [Vendas]
      summary: Linha do tempo de preço do produto num canal (SAL-001)
      description: >-
        Devolve **todas as vigências**, e não só o preço atual. Um pedido feito em março tem que continuar
        explicável em dezembro, e isso exige saber quanto o produto custava em março — guardar só o preço
        vigente transformaria todo pedido antigo num número sem origem.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: channelId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Vigências, em ordem cronológica
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SalesPriceSchedule'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Vendas]
      summary: '"A partir deste dia, passa a custar isto"'
      description: >-
        **Fecha sozinho o preço em aberto, na véspera.** Exigir que o operador encerre o antigo à mão
        antes de abrir o novo criaria uma janela em que o produto não tem preço, e o erro apareceria como
        "produto sem preço" num dia de venda.


        **`validFrom` vem de fora e não é carimbado pelo servidor:** um preço combinado para valer no
        primeiro dia do mês que vem precisa poder ser cadastrado hoje, e um que já valia desde a semana
        passada precisa poder ser regularizado.


        **A invariante é uma só: em qualquer dia, no máximo um preço por produto e canal.** Duas vigências
        sobrepostas fariam "quanto custa hoje?" ter duas respostas, e o sistema escolheria uma pela ordem
        em que leu as linhas — o pedido sairia com um valor e a fatura com outro. A garantia é a restrição
        de exclusão `ex_sales_price_no_overlap` no banco, e não só a checagem do domínio.


        **A moeda não muda no meio da linha do tempo**, senão "aumentou ou baixou?" deixa de ter resposta.


        A plataforma **não calcula imposto** — motor fiscal está fora do escopo. `taxIncluded` registra se
        o número já o contém, para que ninguém compare preço com imposto contra preço sem.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, amount, currency, taxIncluded, validFrom]
              properties:
                channelId: {type: string, format: uuid}
                amount:
                  type: number
                  exclusiveMinimum: 0
                  description: >-
                    Positivo. Preço zero é brinde ou é engano, e os dois pedem tratamento oposto — brinde
                    é desconto no pedido, onde fica registrado que alguém decidiu dar.
                currency: {type: string, pattern: '^[A-Z]{3}$'}
                taxIncluded: {type: boolean}
                validFrom: {type: string, format: date}
      responses:
        '204': {description: Preço vigente a partir da data}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            `sales_price_overlap` — já existe vigência no período (extensão `from` com a data, que é a
            informação que resolve o problema) — ou `sales_currency_mismatch`, quando a linha do tempo já
            está em outra moeda.
          content:
            application/problem+json:
              schema: {type: object}
  /packaging/finished-lots/{id}/release:
    post:
      tags: [Envase]
      summary: Liberar lote acabado para venda (SAL-001-B)
      description: >-
        **Liberação é ato assinado, e não dedução.** A alternativa considerada era derivar "liberado" de
        "não há não conformidade nem desvio em aberto"; foi recusada porque um lote **nunca medido**
        passaria como liberado, e porque a auditoria que pergunta *"quem liberou este lote?"* receberia
        "o sistema deduziu".


        **Alçada `quality.lot.release`, crítica.** Planejar e executar envase não dá o direito de afirmar
        que a cerveja pode ir ao cliente. O registro mora em envase porque é estado do lote — se morasse
        em qualidade, a expedição precisaria consultar o outro módulo e fecharia ciclo (ADR-0016).


        **Não há revogação.** Lote liberado que depois se mostra problemático é caso de quarentena ou
        recall, que alcançam por herança e deixam rastro do porquê. Apagar a liberação faria sumir o fato
        de que alguém a assinou.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  description: >-
                    Opcional. O ato já é a afirmação, e exigir texto faria o operador escrever "ok" para
                    poder seguir — pior que campo vazio, porque parece justificativa.
      responses:
        '204': {description: Lote liberado}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            `lot_already_released` — com as extensões `releasedBy` e `releasedAt`, porque quem recebeu a
            recusa precisa saber que já está liberado e por quem.
          content:
            application/problem+json:
              schema: {type: object}
  /packaging/finished-lots/{id}/sale-status:
    get:
      tags: [Envase]
      summary: Estado de venda do lote (SAL-001-B)
      description: >-
        **Vendável = liberado pela qualidade + dentro da validade + sem quarentena.** Decisão do
        mantenedor em 2026-08-15, respondendo a `DUV-SAL-001`.


        O impedimento vem **nomeado**, e não como um booleano: falta de assinatura, validade vencida e
        quarentena levam a três ações diferentes, e "não disponível" faria o operador ligar para a
        qualidade perguntar o motivo.


        A ordem dos impedimentos não é acidental: quarentena primeiro, porque é a mais grave e um lote em
        quarentena não é caso de correr atrás de assinatura; depois a liberação, que é ação de alguém; por
        último a validade, que é fato consumado.


        `shelf_life_unknown` é impedimento de verdade: **validade desconhecida não é validade em dia**.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Estado de venda
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LotSaleStatus'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /sales/products/{id}/sellable-lots:
    get:
      tags: [Vendas]
      summary: Lotes que dá para prometer deste produto (SAL-001-B)
      description: >-
        **Só os vendáveis.** Misturar o que não pode ser vendido com um aviso ao lado convida ao erro de
        clicar no primeiro da lista. Para saber por que um lote específico não está aqui, consulte
        `/packaging/finished-lots/{id}/sale-status`.


        O produto é o par (receita, embalagem), e é assim que ele encontra os lotes: o lote acabado sabe
        de que lote de produção veio, e o lote de produção sabe a receita.


        **Quem compõe as três condições é o módulo de envase**, que já tem lote, validade e quarentena ao
        alcance. Se vendas compusesse, precisaria depender de três módulos para responder uma pergunta só.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Lotes vendáveis hoje
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SellableLot'}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /sales/orders:
    get:
      tags: [Vendas]
      summary: Pedidos (SAL-002)
      responses:
        '200':
          description: Pedidos
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SalesOrder'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Vendas]
      summary: Registrar pedido, reservando lote (SAL-002)
      description: >-
        **O pedido nasce confirmado, com estoque reservado.** Não há rascunho: um pedido que não reservou
        nada não segura lote, e chamar isso de pedido faria a cervejaria contar como vendido o que outro
        cliente ainda pode levar.


        **A reserva é FEFO — sai antes o que vence antes**, e não o que foi produzido antes. São a mesma
        coisa quase sempre, e diferentes justamente quando importa: um lote novo com validade curta
        precisa sair na frente de um velho com validade longa, ou vence na prateleira.


        **O preço é congelado no pedido.** A lista de preço muda — é para isso que ela tem vigência —, e
        se a fatura relesse a lista, um aumento aplicado depois mudaria o valor de um pedido que o
        cliente já aceitou.


        **A reserva aponta para o lote, e não só para o produto.** É o que faz o pedido manter rastreio:
        quando um recall alcança um lote, "quem comprou disto?" precisa ter resposta.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 80}
          description: >-
            Repetir a chamada com a mesma chave devolve **o mesmo pedido**, em vez de criar outro. Sem
            ela, um duplo clique ou um retry de rede reserva o mesmo estoque duas vezes — e o segundo
            pedido tira do próximo comprador uma cerveja que ninguém vai levar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, customerId, channelId, items]
              properties:
                code: {type: string, maxLength: 40}
                customerId: {type: string, format: uuid}
                channelId: {type: string, format: uuid}
                placedOn:
                  type: string
                  format: date
                  nullable: true
                  description: Nulo é hoje. Existe explícito para regularizar pedido tomado por telefone ontem.
                promisedFor:
                  type: string
                  format: date
                  nullable: true
                  description: >-
                    Nulo é "a combinar", e é estado legítimo — inventar uma data para o campo não ficar
                    vazio seria prometer no lugar de quem vende.
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: {type: string, format: uuid}
                      quantity: {type: integer, exclusiveMinimum: 0}
      responses:
        '201':
          description: Pedido registrado — ou o pedido que já existia, quando a chave se repete
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            `insufficient_lot_stock` (extensões `requested` e `available`) — inclusive quando a causa foi
            **perder a corrida** por ele: do ponto de vista de quem chamou, o estoque acabou entre olhar e
            pedir. · `promise_after_shelf_life` (extensões `promisedFor`, `earliestBestBefore`, `lotCode`)
            · `no_price_for_product` — "ainda não precificado" e "de graça" são opostos.
          content:
            application/problem+json:
              schema: {type: object}
  /sales/orders/{id}:
    get:
      tags: [Vendas]
      summary: Um pedido, com os lotes que ele reservou
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SalesOrder'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /sales/orders/{id}/cancel:
    post:
      tags: [Vendas]
      summary: Cancelar pedido e devolver as reservas
      description: >-
        **Não há DELETE.** Apagar a linha faria sumir o fato de que houve uma venda e que ela foi
        desfeita. O cancelamento devolve as reservas **na mesma transação**: separados, existiria um
        instante em que o pedido está cancelado e o estoque continua preso — e uma falha no meio o
        deixaria preso para sempre.


        Pedido já atendido não cancela: devolveria ao estoque unidades que saíram pela porta.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Pedido cancelado e estoque devolvido}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: '`order_not_changeable` — já cancelado ou já atendido'
          content:
            application/problem+json:
              schema: {type: object}
  /sales/orders/{id}/promise:
    put:
      tags: [Vendas]
      summary: Prometer (ou desmarcar) a data de entrega
      description: >-
        **A data é validada contra a validade do lote reservado**, e manda o lote que vence primeiro:
        quem entrega tudo junto entrega o mais velho junto. A validade é o **último dia bom**, então
        prometer exatamente para ela vale.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                promisedFor:
                  type: string
                  format: date
                  nullable: true
                  description: Nulo desmarca a promessa e volta para "a combinar".
      responses:
        '204': {description: Promessa registrada}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: '`promise_after_shelf_life` ou `order_not_changeable`'
          content:
            application/problem+json:
              schema: {type: object}
  /portal/catalog:
    get:
      tags: [Portal do cliente]
      summary: Catálogo do cliente (SAL-003)
      description: >-
        **Árvore separada, e o isolamento é estrutural.** O cliente vem do **vínculo do usuário
        autenticado**, nunca do caminho nem do corpo — se viesse de fora, bastaria trocá-lo para ver o de
        outro. A alternativa considerada era acrescentar `customerId` ao principal e filtrar em cada
        consulta interna; foi recusada porque a proteção passaria a depender de cada endpoint novo
        lembrar do filtro, que é o padrão que a OBS-REL-001 encontrou em dez escritas.


        Os preços são os do **canal do vínculo** — é isto que "preços próprios" significa, e não uma
        lista paralela por cliente, que seria uma segunda verdade sobre o mesmo produto.


        **Produto sem preço ou sem nada disponível não aparece.** Mostrá-lo faria o cliente pedir e ser
        recusado depois, e no portal não há um vendedor por perto para explicar.


        Exige `portal.access` **e** vínculo: a permissão diz que ele pode entrar, o vínculo diz de quem
        ele é.
      responses:
        '200':
          description: Produtos disponíveis para este cliente
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PortalCatalogItem'}}
        '403':
          description: Sem `portal.access`, ou com a permissão e **sem vínculo**
          content:
            application/problem+json:
              schema: {type: object}
  /portal/orders:
    get:
      tags: [Portal do cliente]
      summary: Os pedidos do cliente — e só dele
      responses:
        '200':
          description: Pedidos
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PortalOrder'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Portal do cliente]
      summary: O cliente faz o próprio pedido (SAL-003)
      description: >-
        **Cliente e canal vêm do vínculo, e não do corpo:** aceitar qualquer um dos dois de fora
        permitiria comprar no preço de outro canal, ou em nome de outro cliente.


        **O teto de compromisso é conferido ANTES de reservar.** Recusar depois deixaria o estoque preso
        até alguém perceber, e o cliente veria "sem crédito" num lote que ele mesmo travou.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 80}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, items]
              properties:
                code: {type: string, maxLength: 40}
                promisedFor: {type: string, format: date, nullable: true}
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: {type: string, format: uuid}
                      quantity: {type: integer, exclusiveMinimum: 0}
      responses:
        '201':
          description: Pedido registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            `credit_limit_exceeded` — com `ceiling`, `committed`, `requested` e `currency`, porque um
            número sozinho não resolve. Também `insufficient_lot_stock`, `promise_after_shelf_life` e
            `no_price_for_product`.
          content:
            application/problem+json:
              schema: {type: object}
  /portal/orders/{id}:
    get:
      tags: [Portal do cliente]
      summary: Um pedido do cliente
      description: >-
        Pedido de outro cliente responde **404**, e não 403: distinguir contaria que o identificador
        existe em algum lugar, que é um oráculo entre clientes.


        A resposta **não traz os lotes reservados** — eles são o rastro interno da cervejaria. O cliente
        precisa saber o que comprou e para quando, não de qual brassa saiu.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalOrder'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /portal/orders/{id}/reorder:
    post:
      tags: [Portal do cliente]
      summary: Recompra
      description: >-
        **Repete o que foi pedido, e não o que foi cobrado.** Reaproveitar o preço antigo faria o cliente
        comprar por um valor que não vale mais, e a cervejaria vender abaixo da lista sem ninguém ter
        decidido isso. O que se repete é a intenção; o preço, a disponibilidade e o teto são os de hoje.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 80}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, maxLength: 40}
                promisedFor: {type: string, format: date, nullable: true}
      responses:
        '201':
          description: Pedido novo, com os itens do anterior
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /portal/credit:
    get:
      tags: [Portal do cliente]
      summary: O teto e o que já está comprometido
      description: >-
        **Mede compromisso, e não recebível — limitação declarada, não descuido.** Um limite de crédito
        de verdade compara o teto com o que o cliente *deve*, e isso exige baixa de pagamento, que a
        plataforma não tem (fora do escopo da sprint). O que dá para medir é a soma dos pedidos
        **confirmados e ainda não entregues**.


        A consequência, que ninguém deve descobrir sozinho: **um pedido entregue e não pago sai da
        conta**. Ver `DEB-SAL-002`.


        `ceiling` nulo significa **sem teto**, e sem teto tudo cabe — não recusar por falta de decisão é
        reversível; recusar um pedido bom porque alguém chutou um teto não é.
      responses:
        '200':
          description: Situação de crédito
          content:
            application/json:
              schema:
                type: object
                properties:
                  ceiling: {type: number, nullable: true}
                  currency: {type: string, nullable: true}
                  committed: {type: number}
        '403': {$ref: '#/components/responses/Problem'}
  /sales/portal/access/{userId}:
    put:
      tags: [Vendas]
      summary: Conceder acesso ao portal (SAL-003)
      description: >-
        Alçada `sales.portal.manage`, **crítica**: dar acesso ao portal é abrir a porta para alguém de
        fora. O usuário é um `security_user` comum — mesma autenticação, mesmo MFA, mesmo bloqueio por
        tentativa. Não há identidade separada de propósito: a segunda cópia é a que fica para trás
        quando algo é corrigido.
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, channelId]
              properties:
                customerId: {type: string, format: uuid}
                channelId:
                  type: string
                  format: uuid
                  description: O canal em que este cliente compra — é ele que decide os preços do portal.
      responses:
        '204': {description: Acesso concedido}
        '403': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Vendas]
      summary: Revogar acesso ao portal
      description: >-
        Apaga o **vínculo**, e não o usuário: ele continua existindo, com o histórico que a auditoria
        guarda. O que some é o direito de ver o cliente.
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Acesso revogado}
        '403': {$ref: '#/components/responses/Problem'}
  /sales/portal/credit/{customerId}:
    put:
      tags: [Vendas]
      summary: Definir o teto de compromisso em aberto
      parameters:
        - name: customerId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceiling, currency]
              properties:
                ceiling:
                  type: number
                  exclusiveMinimum: 0
                  description: >-
                    Positivo. Teto zero bloquearia toda compra, o que não é limite de crédito e sim
                    cliente suspenso — e suspender é outra decisão, que se toma desativando o cliente.
                currency: {type: string, pattern: '^[A-Z]{3}$'}
      responses:
        '204': {description: Teto definido}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /forecast/products/{productId}/demand:
    get:
      tags: [Previsão]
      summary: Previsão de demanda do próximo mês (FCST-001)
      description: >-
        **As quatro coisas que o aceite pede viajam juntas — dados, versão, erro e confiança — porque o
        número sozinho mente.** "Vamos vender 400 latas em março" parece um fato e é um resumo: pode vir
        de doze meses estáveis ou de dois que por acaso deram parecido. As duas produzem a mesma média e
        significam coisas opostas para quem vai decidir uma brassa.


        **Abaixo de três meses não há previsão.** `confidence: INSUFFICIENT` com os números nulos não é
        um número baixo, é a **ausência dele** — devolver um número aqui seria o pior resultado possível,
        porque ele viraria plano de produção e a cerveja que não vender vai vencer na prateleira.


        **O erro vem de backtest, e não de fórmula.** Os últimos três meses ficam de fora do treino, são
        previstos e comparados com o que de fato aconteceu — é a única forma de dizer o quanto o método
        erra *neste* produto. `meanAbsolutePercentageError` **nulo** quando não houve histórico para
        separar treino e teste: sem backtest não se sabe o quanto se erra, e um zero diria o contrário.


        **Média móvel, e não algo mais sofisticado.** Com o histórico de uma cervejaria pequena, um
        modelo com sazonalidade ajusta ruído e apresenta o ajuste como conhecimento. A média móvel erra
        de um jeito que se enxerga no backtest.


        **A versão do método viaja com o resultado**, senão duas previsões do mesmo produto em meses
        diferentes não são comparáveis — ninguém saberia se o número mudou porque a demanda mudou ou
        porque o método mudou.


        **Nada aqui cria ordem de produção ou compra**, por critério transversal da sprint: só existe
        `GET`. Quem decide brassar usa o planejamento, olhando este número como informação e não como
        instrução.


        **Regras da janela.** Doze meses fechados; o mês corrente fica **de fora** porque está incompleto
        — incluí-lo faria a previsão baixar todo dia 1º e subir até o dia 31 sem nada mudar na demanda.
        Mês sem venda entra como **zero** e não é omitido: omitir encurtaria a série e faria a média
        descrever só os meses bons. Meses iniciais sem venda nenhuma são cortados, porque são "o produto
        ainda não existia", e não "ninguém quis". Pedido **cancelado não conta**: foi intenção que não
        virou venda.
      parameters:
        - name: productId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Previsão, ou a declaração de que não há previsão
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemandForecast'}
        '403': {$ref: '#/components/responses/Problem'}
  /community/library:
    get:
      tags: [Comunidade]
      summary: A vitrine da biblioteca (COM-001)
      description: >-
        Só o que está **no ar e é público**, de qualquer cervejaria — a biblioteca pública não é de
        ninguém, e filtrar por inquilino mostraria a cada um só o que ele mesmo publicou.


        **A resposta nunca carrega a cervejaria.** O plano de testes é explícito: busca e feed não expõem
        tenant. Também não carrega o identificador da receita — ele permitiria tentar os endpoints
        internos e descobrir, pelo código de resposta, o que existe do outro lado.


        `LINK` e `UNLISTED` **não aparecem aqui**: são alcançáveis por endereço e não anunciados.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, default: 20, maximum: 50}
      responses:
        '200':
          description: Publicações públicas, das mais recentes para as mais antigas
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LibraryPublication'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Comunidade]
      summary: Publicar uma versão de receita (COM-001)
      description: >-
        **Publica-se uma versão, e não uma receita.** A receita continua evoluindo em casa; o que fica lá
        fora é o retrato daquela versão, **congelado**. Uma vista faria a edição privada de amanhã alterar
        em silêncio o que o público já leu — e o autor descobriria ter publicado algo que nunca revisou.


        **O retrato é montado por allowlist, campo a campo.** Ficam de fora, por construção: a cervejaria,
        o identificador do ingrediente (que aponta para o catálogo, onde moram **preço de compra e
        fornecedor**), o equipamento e a linhagem interna. A alternativa — serializar a receita removendo
        o que não pode sair — é blacklist, e blacklist falha do lado errado: um campo novo vazaria **por
        padrão**.


        **Só receita publicada entra.** Um rascunho é trabalho em andamento, e publicá-lo colocaria lá fora
        uma versão que a própria casa ainda não considera pronta.


        Alçada `community.recipe.publish`, **crítica**: o que sai não volta — quem leu, leu, e um fork
        feito enquanto estava público continua legítimo mesmo depois de despublicar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipeId, title, license, visibility]
              properties:
                recipeId: {type: string, format: uuid}
                title: {type: string, maxLength: 160}
                summary: {type: string, maxLength: 1000, nullable: true}
                license: {$ref: '#/components/schemas/RecipeLicense'}
                visibility: {$ref: '#/components/schemas/RecipeVisibility'}
      responses:
        '201':
          description: Publicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            `version_already_published` — duas entradas da mesma versão concorreriam na busca, com
            títulos possivelmente diferentes, e ninguém saberia qual é a boa.
          content:
            application/problem+json:
              schema: {type: object}
  /community/library/mine:
    get:
      tags: [Comunidade]
      summary: A estante do autor
      description: >-
        O que esta cervejaria publicou, em **qualquer** visibilidade, inclusive o que saiu de circulação.
        Aqui o identificador da receita aparece: ele é do próprio autor.
      responses:
        '200':
          description: Publicações da cervejaria
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/OwnedPublication'}}
        '403': {$ref: '#/components/responses/Problem'}
  /community/library/{id}:
    get:
      tags: [Comunidade]
      summary: Ler uma publicação
      description: >-
        A matriz de visibilidade decide: `PRIVATE`, `BREWERY` e **`LINK`** não alcançam quem está de
        fora por este endereço; `UNLISTED` e `PUBLIC` alcançam.


        **`LINK` exige o token** e entra por `/community/shared` (COM-002) — antes dela, `LINK` abria
        aqui para qualquer autenticado que soubesse o identificador, que é semântica de `UNLISTED`.


        **Publicação inacessível responde 404, e nunca 403.** Numa biblioteca, distinguir "não existe" de
        "é privada" permite **enumerar o acervo alheio sem ler nada** — basta contar quais identificadores
        respondem diferente.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: A publicação, com o retrato congelado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryPublication'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /community/library/{id}/visibility:
    put:
      tags: [Comunidade]
      summary: Mudar quem enxerga
      description: Fechar é sempre possível — é o botão de arrependimento.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility: {$ref: '#/components/schemas/RecipeVisibility'}
      responses:
        '204': {description: Visibilidade alterada}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: '`publication_not_live` — já saiu de circulação; republicar é ato novo'
          content:
            application/problem+json:
              schema: {type: object}
  /community/library/{id}/license:
    put:
      tags: [Comunidade]
      summary: Mudar a licença
      description: >-
        **Vale daqui para a frente, e não retroage.** Quem já copiou sob a licença antiga copiou sob a
        licença antiga — fingir que desfaz seria a plataforma prometendo um controle que ela não tem sobre
        o que já saiu.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license]
              properties:
                license: {$ref: '#/components/schemas/RecipeLicense'}
      responses:
        '204': {description: Licença alterada}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /community/library/{id}/unpublish:
    post:
      tags: [Comunidade]
      summary: Tirar de circulação
      description: >-
        **Não apaga.** O que já foi lido não se desfaz, e um fork feito enquanto estava pública continua
        legítimo. A publicação some da busca e do acesso externo, e continua na estante do autor com a
        data de saída.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Fora de circulação}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /community/library/{publicationId}/links:
    get:
      tags: [Comunidade]
      summary: Os links desta publicação (COM-002)
      description: >-
        A lista do autor mostra o **estado de cada link** — rótulo, prazo, se foi revogado e se ainda
        vale. É o que torna a revogação uma decisão informada, em vez de um chute entre seis linhas
        iguais.


        **O token nunca volta aqui.** Ele apareceu uma vez, na criação.
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Links da publicação
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ShareLinkView'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Comunidade]
      summary: Criar um link compartilhável
      description: >-
        **O token aparece uma vez, nesta resposta, e nunca mais.** O banco guarda só o hash — um link
        vazado do banco seria acesso concedido sem que ninguém tivesse compartilhado nada. Quem perder o
        valor cria outro e revoga o primeiro; poder recuperá-lo significaria que ele estava guardado em
        algum lugar.


        **O link não eleva visibilidade.** Ele torna alcançável o que já está em `LINK` — e se o autor
        fechar a publicação, **todos os links param de funcionar no mesmo instante**, sem precisar revogar
        um por um.


        `expiresAt` nulo é "sem prazo", e é legítimo. O que não é opcional é poder cortar.
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission:
                  type: string
                  enum: [READ, COMMENT]
                  description: >-
                    **Nenhum nível permite editar a receita.** Comentar é escrever *sobre* a receita, e
                    não *na* receita — a diferença é o que mantém a autoria intacta.
                label:
                  type: string
                  maxLength: 120
                  nullable: true
                  description: Para o autor lembrar a quem deu — "pro Bruno avaliar".
                expiresAt: {type: string, format: date-time, nullable: true}
      responses:
        '201':
          description: Link criado — **guarde o token, ele não é recuperável**
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  token: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /community/links/{id}/revoke:
    post:
      tags: [Comunidade]
      summary: Revogar um link
      description: >-
        **Revogar é o arrependimento; expirar é o prazo combinado** — as duas coisas existem porque são
        diferentes.


        Revogar duas vezes não é erro e **não muda a data**: quem clica de novo quer o mesmo resultado, e
        a data é o registro de quando o acesso foi cortado. Não há "desrevogar" — o motivo de revogar
        costuma ser que o link chegou a quem não devia.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Link revogado}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /community/shared:
    get:
      tags: [Comunidade]
      summary: Abrir uma publicação por link (COM-002)
      description: >-
        **Exige autenticação como todo o resto:** o link decide *o que* se vê, e não substitui *quem* é.


        **404 para link inexistente, expirado, revogado ou de publicação fechada — sem distinguir.** Dizer
        "expirado" a quem tem um token inventado confirma que aquele token um dia existiu; dizer
        "revogado" conta que houve um compartilhamento e que alguém se arrependeu. O autor, que é quem
        precisa do motivo, vê o estado de cada link na própria lista.


        **Nota de fronteira (correção da COM-001):** a visibilidade `LINK` **não** é mais legível pelo
        endereço da publicação. Ela era, e isso era semântica de `UNLISTED`. A partir da COM-002, `LINK`
        exige o token; `UNLISTED` continua abrindo por endereço direto, sem segredo.
      parameters:
        - name: token
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: A publicação, e se este link autoriza comentar
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedPublication'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: '`share_link_invalid` — inexistente, expirado, revogado ou publicação fechada'
          content:
            application/problem+json:
              schema: {type: object}
  /community/library/{id}/fork:
    post:
      tags: [Comunidade]
      summary: Copiar a receita para a própria cervejaria (COM-003)
      description: >-
        **A cópia sai do retrato congelado, e nunca da receita do autor.** É o que dá sentido a "sem
        acesso futuro ao conteúdo privado": o forkador leva o que estava publicado naquele momento — nem
        mais, nem o que vier depois. Se o autor fechar a publicação amanhã, esta receita continua sendo
        dele e a **atribuição continua correta**.


        **A linhagem é atribuição congelada, e não ponteiro.** Nome do autor, título, licença e versão
        ficam gravados como estavam. O identificador da publicação é guardado para a tela poder oferecer
        o link de volta — abrir aquela publicação continua passando pela matriz de visibilidade.


        **O equipamento é de quem copia:** o do autor nunca saiu no retrato, e quem vai brassar escolhe o
        seu.


        **Sem `name`, a cópia ganha o sufixo "(cópia)".** Reusar o nome do original colide — nome de
        receita é único por cervejaria —, mas o motivo de fundo é outro: duas receitas com o mesmo nome no
        mesmo catálogo fazem o cervejeiro pegar a errada no dia da brassa.


        **Alçada `recipe.create`**, e não uma nova: quem pode criar uma receita do zero pode criar uma
        inspirada na de outro.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equipmentId]
              properties:
                equipmentId: {type: string, format: uuid}
                name: {type: string, maxLength: 160, nullable: true}
      responses:
        '201':
          description: Receita criada, com a atribuição e a obrigação de licença
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForkedRecipe'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: >-
            A publicação não existe **ou não alcança quem pediu** — não se forka o que não se pode ler, e
            isto não é sobre licença: é a matriz de visibilidade.
          content:
            application/problem+json:
              schema: {type: object}
        '409':
          description: >-
            `fork_not_allowed` — a licença não autoriza derivados. · `unmapped_ingredients` — faltam
            ingredientes no catálogo de quem copia, **com a lista em `missing`**. A recusa é inteira: uma
            receita a que faltam três de oito ingredientes não é incompleta, é **errada**, e alguém a
            brassaria achando que é a do outro.
          content:
            application/problem+json:
              schema: {type: object}
  /community/library/{id}/forks:
    get:
      tags: [Comunidade]
      summary: Quantas cópias esta publicação gerou
      description: A pergunta do autor — "quantos copiaram a minha?".
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Contagem de forks
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: {type: integer}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /community/library/{publicationId}/contributions:
    get:
      tags: [Comunidade]
      summary: A conversa sobre uma publicação (COM-004)
      description: >-
        Comentários e sugestões visíveis, do mais recente para o mais antigo. O que foi escondido pela
        moderação não aparece — mas **continua existindo**: moderação precisa poder ser revista, e texto
        apagado não se revisa.


        **A resposta não carrega a cervejaria nem o identificador de quem escreveu.** Quem lê vê o nome, e
        nada que permita cruzar aquela pessoa com outra coisa da plataforma.
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Comentários e sugestões
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Contribution'}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Comunidade]
      summary: Comentar ou sugerir
      description: >-
        **Não se comenta o que não se pode ler** — a mesma matriz de visibilidade de sempre, e não uma
        regra nova.


        `context` é o que torna o comentário **contextual** em vez de um mural: "o lúpulo está alto" sem
        dizer qual lúpulo não ajuda ninguém.


        A diferença entre os dois tipos é o que se espera do autor: um comentário não pede resposta, uma
        sugestão pede decisão.
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, body]
              properties:
                kind: {type: string, enum: [COMMENT, SUGGESTION]}
                body: {type: string, maxLength: 2000}
                context:
                  type: string
                  maxLength: 120
                  nullable: true
                  description: 'Onde na receita — "Malte Pilsen", "fervura".'
      responses:
        '201':
          description: Escrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /community/contributions/{id}/accept:
    post:
      tags: [Comunidade]
      summary: Aceitar uma sugestão (COM-004)
      description: >-
        **Aceitar NÃO altera a receita nem o retrato publicado.** Duas razões, e as duas são estruturais:


        1. O retrato publicado é **congelado** (COM-001) — aplicar uma sugestão nele faria mudar o que o
           público já leu, exatamente o que congelar existe para impedir.
        2. A receita de verdade é **privada** — deixar texto de alguém de fora reescrevê-la daria a
           estranhos uma chave que nem o link de colaboração dá.


        Então aceitar é **registrar concordância**: fica escrito que o autor achou boa, com nome e data.
        Aplicar é ato dele, na receita dele, e vira versão nova — que ele publica quando quiser.


        Alçada `community.recipe.publish`: quem responde pela receita lá fora é quem decide o que sugerem
        sobre ela.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: >-
                    Opcional — obrigar texto faria o autor escrever "ok" para poder seguir.
      responses:
        '204': {description: Concordância registrada}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            `not_decidable` — um comentário não propôs nada, então não há o que aceitar. ·
            `already_decided` — decidir duas vezes reescreveria quem decidiu e quando, e é esse registro
            que torna a conversa auditável.
          content:
            application/problem+json:
              schema: {type: object}
  /community/contributions/{id}/decline:
    post:
      tags: [Comunidade]
      summary: Recusar uma sugestão
      description: >-
        **Recusar não apaga.** A sugestão continua visível, com a decisão ao lado: é isso que evita a
        mesma sugestão voltar três vezes, e o que torna a conversa um histórico em vez de uma caixa de
        entrada.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 500, nullable: true}
      responses:
        '204': {description: Recusa registrada}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /community/contributions/{id}/hide:
    post:
      tags: [Comunidade]
      summary: Esconder da lista pública
      description: >-
        **Esconder não apaga.** O texto continua no banco: moderação precisa poder ser revista, e um texto
        apagado não se revisa.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Escondido}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /community/library/{publicationId}/rating:
    get:
      tags: [Comunidade]
      summary: A nota da publicação (COM-005)
      description: >-
        **A média nunca viaja sem a contagem.** "5,0" de uma avaliação e "5,0" de duzentas são o mesmo
        número e significam coisas opostas — `meaningful` é o que diz à tela quando o número ainda é
        opinião em vez de reputação.


        **Sem votos, `average` vem nulo — e não zero.** Zero é a pior nota possível: uma receita recém
        publicada nasceria parecendo péssima.
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: A nota, com quantos votaram
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RatingSummary'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Comunidade]
      summary: Avaliar de 1 a 5
      description: >-
        **Uma nota por pessoa, e ela se troca em vez de acumular.** Deixar a mesma pessoa avaliar duas
        vezes transformaria a média numa contagem de quem insistiu mais — o jeito mais simples de
        manipular reputação sem robô nenhum.


        Escala fechada de 1 a 5. Zero seria "não avaliou", que é a ausência de nota: permitir zero faria
        "sem opinião" e "péssima" virarem o mesmo número na média.


        **Não se avalia o que não se pode ler** — a mesma matriz de visibilidade de sempre.
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {type: integer, minimum: 1, maximum: 5}
      responses:
        '204': {description: Avaliado}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            `self_rating` — o autor não avalia a própria receita. A nota dele não informa ninguém, e uma
            média que a inclui mede outra coisa.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /community/library/{publicationId}/reports:
    post:
      tags: [Comunidade]
      summary: Denunciar uma publicação (COM-005)
      description: >-
        **Denunciar REGISTRA: não esconde nada.** Uma denúncia que tirasse o conteúdo do ar seria uma
        arma — qualquer pessoa derrubaria a receita de um concorrente escrevendo três linhas. O que ela
        abre é um caso, e o conteúdo continua exatamente onde estava.


        `OTHER` exige explicação: "outro" sem texto não é denúncia, é ruído — ninguém revisa o que não foi
        dito. Os motivos da lista dispensam texto, porque obrigar explicação em "spam" faria a pessoa
        escrever "spam" no campo.


        **A mesma pessoa não denuncia a mesma publicação duas vezes pelo mesmo motivo.** Não é limite de
        opinião: a contagem de denúncias é sinal, e um sinal que a mesma pessoa repete deixa de medir a
        comunidade e passa a medir a insistência.
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, enum: [ABUSE, PLAGIARISM, SPAM, OTHER]}
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
                  description: Obrigatório quando o motivo é OTHER.
      responses:
        '201':
          description: Caso aberto
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            `already_reported` — já denunciada por este motivo. · `self_rating` — se o autor quer tirar do
            ar, o botão é despublicar.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    get:
      tags: [Comunidade]
      summary: As denúncias contra a própria publicação
      description: >-
        **Só o autor vê**, e ele vê porque é o direito de resposta: saber do que se é acusado é o mínimo
        antes de qualquer revisão existir. Ler as denúncias contra a receita do concorrente seria
        inteligência competitiva servida de graça.


        **Sem quem denunciou.** A identidade do denunciante exposta ao denunciado transformaria a denúncia
        em convite à retaliação.


        **Não há endpoint de revisão nesta fatia, e a ausência é decisão registrada** (DUV-COM-001):
        "moderação auditada" pressupõe um papel acima das cervejarias — o autor não pode julgar denúncia
        contra a própria receita, e dar a alguém o poder de esconder publicação de qualquer casa é decisão
        de modelo de segurança. O registro já nasce com os campos da revisão; falta decidir quem pode.
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: As denúncias, da mais recente para a mais antiga
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AbuseReport'}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  schemas:
    Contribution:
      type: object
      description: >-
        Um comentário ou uma sugestão. **Sem cervejaria e sem identificador de usuário** — quem lê vê o
        nome de quem escreveu, e nada que permita cruzar aquela pessoa com outra coisa da plataforma.
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [COMMENT, SUGGESTION]}
        author: {type: string, description: Nome congelado, como a atribuição do fork.}
        body: {type: string, description: Nunca reescrito — aceitar não muda o que foi proposto.}
        context: {type: string, nullable: true}
        status: {type: string, enum: [OPEN, ACCEPTED, DECLINED]}
        createdAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time, nullable: true}
        decisionNote: {type: string, nullable: true}
        pending:
          type: boolean
          description: >-
            Sugestão aberta. Comentário nunca é pendente — ele não propôs nada, e contá-lo faria "3
            pendentes" incluir elogios.
    RatingSummary:
      type: object
      description: A nota média, e nunca sem a contagem ao lado.
      properties:
        average:
          type: number
          nullable: true
          description: >-
            Uma casa decimal. **Nulo quando ninguém votou** — zero é a pior nota, e não a ausência dela.
        count: {type: integer, description: Quantos votaram.}
        meaningful:
          type: boolean
          description: >-
            Falso com menos de 5 votos. A tela mostra o número como opinião, e não como reputação.
        myRating:
          type: integer
          nullable: true
          description: A nota de quem está perguntando; nula se ainda não avaliou.
    AbuseReport:
      type: object
      description: >-
        Uma denúncia, como o autor a vê. **Sem o denunciante:** expô-lo ao denunciado seria convite à
        retaliação.
      properties:
        id: {type: string, format: uuid}
        reason: {type: string, enum: [ABUSE, PLAGIARISM, SPAM, OTHER]}
        note: {type: string, nullable: true}
        reportedAt: {type: string, format: date-time}
        reviewedAt:
          type: string
          format: date-time
          nullable: true
          description: Nulo enquanto não houver quem revise (DUV-COM-001).
        outcome:
          type: string
          nullable: true
          enum: [UPHELD, DISMISSED]
          description: >-
            Julgar procedente **não apaga nem esconde sozinho** — a ação sobre o conteúdo é ato separado.
    ForkedRecipe:
      type: object
      properties:
        recipeId: {type: string, format: uuid, description: A receita nova, que é de quem copiou e evolui sozinha.}
        attribution:
          type: string
          description: 'Pronta para a tela — por exemplo "IPA da Casa, de Ana (CC BY 4.0)".'
        sourceLicense: {$ref: '#/components/schemas/RecipeLicense'}
        requiredLicense:
          type: string
          nullable: true
          description: >-
            Não nulo quando a licença de origem **se propaga** (CC BY-SA existe para que derivados
            continuem abertos). Vem na resposta para o forkador não descobrir a obrigação só na hora de
            publicar.
    ShareLinkView:
      type: object
      description: O estado de um link, na lista do autor. Sem o token — ele apareceu uma vez, na criação.
      properties:
        id: {type: string, format: uuid}
        label: {type: string, nullable: true}
        permission: {type: string, enum: [READ, COMMENT]}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, nullable: true}
        revokedAt: {type: string, format: date-time, nullable: true}
        usable:
          type: boolean
          description: >-
            Se o link, por si, ainda vale. Ele ainda pode não abrir nada, se o autor fechou a
            publicação — a visibilidade manda.
    SharedPublication:
      type: object
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        summary: {type: string, nullable: true}
        author: {type: string}
        license: {$ref: '#/components/schemas/RecipeLicense'}
        licenseLabel: {type: string}
        recipeVersion: {type: integer, format: int64}
        publishedAt: {type: string, format: date-time}
        mayComment: {type: boolean, description: Depende da permissão do link (COM-004).}
        recipe: {$ref: '#/components/schemas/PublicRecipeSnapshot'}
    RecipeLicense:
      type: string
      enum: [CC0, CC_BY, CC_BY_SA, CC_BY_NC, ALL_RIGHTS_RESERVED]
      description: >-
        Lista fechada, ao contrário de canal de venda e atividade de mão de obra, que são cadastro — a
        diferença é efeito jurídico. Quem escrevesse "livre" num campo de texto estaria dizendo nada, e
        quem copiasse acreditando naquilo ficaria exposto. `ALL_RIGHTS_RESERVED` não autoriza fork.
    RecipeVisibility:
      type: string
      enum: [PRIVATE, BREWERY, LINK, UNLISTED, PUBLIC]
      description: >-
        Do mais fechado para o mais aberto. `LINK` e `UNLISTED` são alcançáveis por endereço e **não
        listados**; só `PUBLIC` aparece na vitrine.
    LibraryPublication:
      type: object
      description: >-
        O que o público vê. **Sem cervejaria e sem identificador de receita** — o primeiro é o inquilino,
        o segundo permitiria sondar os endpoints internos.
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        summary: {type: string, nullable: true}
        author: {type: string, description: Nome de exibição congelado na publicação.}
        license: {$ref: '#/components/schemas/RecipeLicense'}
        licenseLabel: {type: string}
        recipeVersion: {type: integer, format: int64}
        publishedAt: {type: string, format: date-time}
        forkable: {type: boolean, description: Depende da licença e de a publicação alcançar quem está de fora.}
        recipe: {$ref: '#/components/schemas/PublicRecipeSnapshot'}
    PublicRecipeSnapshot:
      type: object
      description: >-
        O retrato congelado, montado por **allowlist**. O que não está descrito aqui não sai — inclusive
        o que a receita ganhar de campo novo no futuro.
      properties:
        name: {type: string}
        style: {type: string, nullable: true}
        batchVolumeLiters: {type: number}
        boilTimeMinutes: {type: integer, nullable: true}
        targets: {$ref: '#/components/schemas/PublicRecipeTargets'}
        items:
          type: array
          items: {$ref: '#/components/schemas/PublicRecipeItem'}
    PublicRecipeTargets:
      type: object
      nullable: true
      description: Propriedades da cerveja, e não do negócio. Nulo quando as métricas nunca foram calculadas.
      properties:
        originalGravity: {type: number, nullable: true}
        finalGravity: {type: number, nullable: true}
        ibu: {type: number, nullable: true}
        colorSrm: {type: number, nullable: true}
        abvPercent: {type: number, nullable: true}
    PublicRecipeItem:
      type: object
      properties:
        ingredientName:
          type: string
          description: >-
            O **nome**, e nunca o identificador: ele é a chave do catálogo da cervejaria, onde moram
            preço de compra e fornecedor. O nome é o que outro cervejeiro precisa, e não abre porta.
        stage: {type: string}
        quantity: {type: number}
        unit: {type: string}
        timingMinutes: {type: integer, nullable: true}
        percentage: {type: number, nullable: true}
    OwnedPublication:
      type: object
      description: A visão do autor sobre a própria estante — aqui o id da receita aparece, porque é dele.
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        recipeId: {type: string, format: uuid}
        recipeVersion: {type: integer, format: int64}
        license: {$ref: '#/components/schemas/RecipeLicense'}
        visibility: {$ref: '#/components/schemas/RecipeVisibility'}
        published: {type: boolean, description: Falso quando saiu de circulação — mas continua aqui.}
        publishedAt: {type: string, format: date-time}
    DemandForecast:
      type: object
      properties:
        productId: {type: string, format: uuid}
        forMonth: {type: string, description: 'Mês previsto, no formato YYYY-MM.'}
        hasNumbers:
          type: boolean
          description: Falso quando o histórico não bastou. A tela mostra a ausência, e não um zero.
        expectedUnits: {type: number, nullable: true}
        lowerBound:
          type: number
          nullable: true
          description: >-
            Intervalo em torno da média — o quanto ainda não se sabe sobre ela —, e não a variação
            observada. Nunca desce abaixo de zero, porque demanda negativa não existe.
        upperBound: {type: number, nullable: true}
        sampleMonths:
          type: integer
          description: Quantos meses entraram. Vem mesmo quando não há previsão, porque é o que explica a recusa.
        method:
          type: string
          description: 'Nome e versão, por exemplo "moving-average v1".'
        meanAbsolutePercentageError:
          type: number
          nullable: true
          description: >-
            Erro medido em backtest, em pontos percentuais. Nulo quando não houve histórico para separar
            treino e teste — e nulo é honesto, um zero diria que o método acerta sempre.
        confidence:
          type: string
          enum: [INSUFFICIENT, LOW, MODERATE, HIGH]
          description: >-
            `INSUFFICIENT` é ausência de previsão. `HIGH` só a partir de doze meses, porque é a partir de
            um ciclo anual que a sazonalidade aparece no dado em vez de ser adivinhada.
    PortalCatalogItem:
      type: object
      properties:
        productId: {type: string, format: uuid}
        sku: {type: string}
        name: {type: string}
        unitAmount: {type: number}
        currency: {type: string}
        taxIncluded: {type: boolean}
        availableUnits:
          type: integer
          description: Soma do que está livre nos lotes vendáveis. Item com zero não aparece na lista.
    PortalOrder:
      type: object
      description: O pedido como o cliente o vê — sem os lotes reservados, que são rastro interno.
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        status: {type: string, enum: [PLACED, CANCELLED, FULFILLED]}
        placedOn: {type: string, format: date}
        promisedFor: {type: string, format: date, nullable: true}
        total: {type: number}
        currency: {type: string}
        lines:
          type: array
          items: {$ref: '#/components/schemas/PortalOrderLine'}
    PortalOrderLine:
      type: object
      properties:
        sku: {type: string}
        quantity: {type: integer}
        unitAmount: {type: number}
        currency: {type: string}
    SalesOrder:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        customerId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        status: {type: string, enum: [PLACED, CANCELLED, FULFILLED]}
        placedOn: {type: string, format: date}
        promisedFor: {type: string, format: date, nullable: true}
        total:
          type: number
          description: Arredondado a duas casas no TOTAL, e não por linha — arredondar linha a linha produz um centavo de diferença, que é o que o cliente encontra ao conferir a nota.
        currency: {type: string}
        lines:
          type: array
          items: {$ref: '#/components/schemas/SalesOrderLine'}
    SalesOrderLine:
      type: object
      properties:
        productId: {type: string, format: uuid}
        sku: {type: string, description: Congelado, para o pedido antigo continuar legível se o produto for renomeado.}
        quantity: {type: integer}
        unitAmount: {type: number, description: Preço congelado no pedido.}
        currency: {type: string}
        taxIncluded: {type: boolean}
        reservations:
          type: array
          items: {$ref: '#/components/schemas/SalesLotReservation'}
    SalesLotReservation:
      type: object
      description: O lote que o pedido segura — é o que um recall percorre para saber a quem avisar.
      properties:
        finishedLotId: {type: string, format: uuid}
        lotCode: {type: string}
        units: {type: integer}
        bestBefore:
          type: string
          format: date
          description: Congelada na reserva — é ela que sustentou a promessa de entrega.
    SellableLot:
      type: object
      properties:
        finishedLotId: {type: string, format: uuid}
        code: {type: string}
        batchCode: {type: string}
        units: {type: integer}
        containerVolumeMl: {type: number}
        packagedOn: {type: string, format: date}
        bestBefore: {type: string, format: date}
        freeUnits:
          type: integer
          description: >-
            O que sobrou depois das reservas. Viaja junto de `units` porque respondem perguntas
            diferentes — um lote de 780 com 780 vendidas continua existindo, e mostrar só o total faria
            a tela oferecer cerveja que já tem dono. Lote com zero livre não aparece na lista.
    LotSaleStatus:
      type: object
      properties:
        finishedLotId: {type: string, format: uuid}
        code: {type: string}
        sellable: {type: boolean}
        bestBefore: {type: string, format: date, nullable: true}
        blocker:
          nullable: true
          allOf: [{$ref: '#/components/schemas/LotSaleBlocker'}]
    LotSaleBlocker:
      type: object
      properties:
        code:
          type: string
          enum: [not_released, shelf_life_unknown, expired, quarantined, quarantine_suspected]
        message: {type: string}
    SalesProduct:
      type: object
      properties:
        id: {type: string, format: uuid}
        sku: {type: string, description: Sempre em maiúsculas.}
        name: {type: string}
        recipeId: {type: string, format: uuid}
        containerId: {type: string, format: uuid}
        active: {type: boolean}
    SalesChannel:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        active: {type: boolean}
    SalesPriceSchedule:
      type: object
      properties:
        productId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        entries:
          type: array
          items: {$ref: '#/components/schemas/SalesPriceEntry'}
    SalesPriceEntry:
      type: object
      properties:
        amount: {type: number}
        currency: {type: string}
        taxIncluded:
          type: boolean
          description: A plataforma não calcula imposto; só registra se o número já o contém.
        validFrom: {type: string, format: date}
        validTo:
          type: string
          format: date
          nullable: true
          description: >-
            Nulo é "até segunda ordem". As duas pontas são inclusivas — quem compra no último dia paga o
            preço daquele dia.
    CrmCustomer:
      type: object
      properties:
        id: {type: string, format: uuid}
        legalName: {type: string}
        tradeName: {type: string, nullable: true}
        displayName:
          type: string
          description: Fantasia quando existe, razão social quando não — quem atende o balcão conhece o bar pela fachada.
        taxId: {type: string, nullable: true}
        active: {type: boolean}
    CrmContact:
      type: object
      description: >-
        A pessoa. Separada do cliente porque cliente é dado de negócio e contato é dado pessoal: numa
        entidade só, o primeiro pedido de exclusão obrigaria a escolher entre apagar a pessoa e destruir
        o histórico comercial.
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        name: {type: string, nullable: true, description: Ausente depois da anonimização.}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        role: {type: string, nullable: true}
        anonymized: {type: boolean}
        anonymizedAt: {type: string, format: date-time, nullable: true}
        purposes:
          type: array
          items: {$ref: '#/components/schemas/CrmPurpose'}
        consentHistory:
          type: array
          description: O livro só cresce — é ele que responde "ela aceitava quando mandamos aquilo?".
          items: {$ref: '#/components/schemas/CrmConsentEntry'}
    CrmPurpose:
      type: object
      properties:
        purpose: {type: string, enum: [TRANSACTIONAL, MARKETING, SURVEY]}
        basis:
          type: string
          enum: [CONTRACT, CONSENT]
          description: >-
            `CONTRACT` não é revogável: se revogar oferta comercial derrubasse o aviso de entrega, a
            cervejaria ficaria proibida de cumprir o que vendeu.
        allowedNow: {type: boolean}
    CrmConsentEntry:
      type: object
      properties:
        purpose: {type: string, enum: [MARKETING, SURVEY]}
        decision: {type: string, enum: [GRANTED, REVOKED]}
        decidedAt:
          type: string
          format: date-time
          description: O instante do mundo, e não o da digitação.
        source: {type: string}
    OptimizeRequest:
      type: object
      required: [recipeId, objective]
      properties:
        recipeId: {type: string, format: uuid}
        objective: {type: string, enum: [COST, AVAILABILITY, TECHNICAL_TARGET]}
        constraints:
          type: array
          items: {$ref: '#/components/schemas/OptimizationConstraint'}
    OptimizationConstraint:
      type: object
      required: [kind]
      description: >-
        Restrição não é preferência: violá-la descarta a alternativa em vez de penalizá-la
      properties:
        kind:
          type: string
          enum: [MAX_COST_PER_LITER, IBU_RANGE, COLOR_RANGE, KEEP_INGREDIENT, EXCLUDE_INGREDIENT,
                 STOCK_ONLY]
        minValue: {type: number, nullable: true}
        maxValue: {type: number, nullable: true}
        ingredientId: {type: string, format: uuid, nullable: true}
    OptimizationTradeOff:
      type: object
      description: >-
        O que piorou em relação à receita original. Só o que piorou — listar as melhorias diluiria a
        leitura e faria o custo parecer menor do que é
      properties:
        dimension: {type: string}
        description: {type: string}
        originalValue: {type: number}
        candidateValue: {type: number}
    OptimizationSubstitution:
      type: object
      properties:
        fromIngredientId: {type: string, format: uuid}
        fromLabel: {type: string}
        toIngredientId: {type: string, format: uuid}
        toLabel: {type: string}
        quantity: {type: number}
        unit: {type: string}
    OptimizationCandidate:
      type: object
      properties:
        label: {type: string}
        substitutions:
          type: array
          items: {$ref: '#/components/schemas/OptimizationSubstitution'}
        costPerLiter: {type: number}
        estimatedIbu: {type: number, nullable: true}
        estimatedColorEbc: {type: number, nullable: true}
        score: {type: number}
        tradeOffs:
          type: array
          description: Sempre presente. O ganho sem o custo faz escolher sem saber o que se troca
          items: {$ref: '#/components/schemas/OptimizationTradeOff'}
    OptimizationInfeasible:
      type: object
      description: >-
        Resposta com conteúdo. "Inviável" sozinho manda a pessoa afrouxar tudo ao acaso; saber quais
        restrições se contradizem transforma isso numa decisão
      properties:
        conflictingConstraints: {type: array, items: {type: string}}
        explanation: {type: string}
    OptimizationRun:
      type: object
      description: >-
        Método, versão da receita, marca do catálogo e semente viajam sempre — é o que permite reproduzir
        o número, e um resultado que não se reproduz não se audita
      properties:
        id: {type: string, format: uuid}
        recipeId: {type: string, format: uuid}
        recipeVersion: {type: integer, description: Versão PUBLICADA usada como entrada}
        objective: {type: string}
        constraints:
          type: array
          items: {$ref: '#/components/schemas/OptimizationConstraint'}
        method: {type: string}
        catalogVersion:
          type: string
          description: >-
            Marca derivada do CONTEÚDO do catálogo lido, não da data — uma marca por data diria que a
            entrada mudou todo dia mesmo sem nada ter mudado
        seed: {type: integer, format: int64, nullable: true}
        usesSeed:
          type: boolean
          description: Distingue "método determinístico" de "esqueceram de gravar a semente"
        feasible: {type: boolean}
        candidates:
          type: array
          items: {$ref: '#/components/schemas/OptimizationCandidate'}
        infeasible:
          nullable: true
          allOf: [{$ref: '#/components/schemas/OptimizationInfeasible'}]
        explanation:
          type: string
          nullable: true
          description: Texto da IA, em campo separado das candidatas para não parecer parte do cálculo
        appliedRecipeVersionId: {type: string, format: uuid, nullable: true}
        requestedBy: {type: string, format: uuid}
        requestedAt: {type: string, format: date-time}
    RegisterComplaint:
      type: object
      required: [batchId, category, severity, description]
      properties:
        batchId: {type: string, format: uuid}
        reference: {type: string, maxLength: 80, description: Protocolo do atendimento}
        category:
          type: string
          enum: [OFF_FLAVOR, APPEARANCE, CARBONATION, PACKAGING, FOREIGN_BODY, ILLNESS, OTHER]
        severity: {type: string, enum: [PREFERENCE, QUALITY, SYSTEMIC, SAFETY]}
        description: {type: string, maxLength: 4000}
        storage: {$ref: '#/components/schemas/ComplaintStorage'}
        sample: {$ref: '#/components/schemas/ComplaintSample'}
        contact:
          description: Opcional. Guardado à parte, com permissão própria e acesso auditado
          allOf: [{$ref: '#/components/schemas/ComplainantContactInput'}]
    ComplaintStorage:
      type: object
      description: >-
        Existe para separar defeito de maltrato: uma cerveja a 35 °C por duas semanas desenvolve
        off-flavor sem que nada tenha saído errado na fábrica. Campos nulos significam "ninguém
        perguntou", nunca "estava tudo bem" — ver `conditionsKnown` na resposta
      properties:
        temperatureCelsius: {type: number, nullable: true}
        daysSincePurchase: {type: integer, nullable: true}
        exposedToLight: {type: boolean, nullable: true}
        notes: {type: string, maxLength: 2000, nullable: true}
    ComplaintSample:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [RETAINED, WITH_CONSUMER, UNAVAILABLE, UNKNOWN]}
        location:
          type: string
          maxLength: 200
          description: Obrigatório quando RETAINED — amostra sem lugar declarado ninguém acha depois
    ComplainantContactInput:
      type: object
      description: Ao menos um meio de contato. Contato vazio aumentaria a superfície sem informar nada
      properties:
        name: {type: string, maxLength: 200}
        email: {type: string, maxLength: 200}
        phone: {type: string, maxLength: 40}
        address: {type: string, maxLength: 400}
    ComplainantContact:
      type: object
      description: >-
        Resposta separada, permissão crítica, leitura auditada. Apagado devolve campos vazios com
        `erased: true`
      properties:
        name: {type: string, nullable: true}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        address: {type: string, nullable: true}
        erased: {type: boolean}
        erasedAt: {type: string, format: date-time, nullable: true}
        recordedAt: {type: string, format: date-time}
    ComplaintRequiredAction:
      type: object
      properties:
        code: {type: string, enum: [QUARANTINE, ROOT_CAUSE_ANALYSIS]}
        description: {type: string}
    ComplaintActionOutcome:
      type: object
      description: Atendida aponta para o registro criado; dispensada explica por quê. Nunca as duas
      properties:
        action: {type: string, enum: [QUARANTINE, ROOT_CAUSE_ANALYSIS]}
        fulfilled: {type: boolean}
        referenceId: {type: string, format: uuid, nullable: true}
        justification: {type: string, nullable: true}
        decidedBy: {type: string, format: uuid}
        decidedAt: {type: string, format: date-time}
    FieldComplaint:
      type: object
      description: >-
        **Sem campo para nome, telefone, e-mail ou endereço** — a ausência é a garantia: um contrato que
        não tem o campo não vaza o dado por esquecimento quando alguém adicionar um endpoint novo
      properties:
        id: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        reference: {type: string, nullable: true}
        category: {type: string}
        severity: {type: string}
        description: {type: string}
        storage:
          allOf: [{$ref: '#/components/schemas/ComplaintStorage'}]
          description: Acompanha `conditionsKnown`, que distingue não perguntado de guardado corretamente
        sample: {$ref: '#/components/schemas/ComplaintSample'}
        requiredActions:
          type: array
          description: Derivadas de severidade e categoria; não são escolhidas nem gravadas
          items: {$ref: '#/components/schemas/ComplaintRequiredAction'}
        pendingActions:
          type: array
          description: As exigidas que ainda não têm destino. Enquanto houver, o encerramento é recusado
          items: {type: string}
        outcomes:
          type: array
          items: {$ref: '#/components/schemas/ComplaintActionOutcome'}
        status: {type: string, enum: [OPEN, UNDER_ANALYSIS, CLOSED]}
        closingNote: {type: string, nullable: true}
        closedBy: {type: string, format: uuid, nullable: true}
        closedAt: {type: string, format: date-time, nullable: true}
        registeredBy: {type: string, format: uuid}
        registeredAt: {type: string, format: date-time}
    SimulateBlendOperation:
      type: object
      required: [kind, inputs, reason]
      properties:
        kind:
          type: string
          enum: [MERGE, SPLIT]
          description: >-
            União parte de ao menos dois lotes; divisão parte de um e chega a ao menos dois. A forma é o
            que distingue as duas — sem a checagem, uma "união" com uma origem apareceria no histórico
            descrevendo o oposto do que houve
        inputs:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/BlendMovement'}
        outputs:
          type: array
          items: {$ref: '#/components/schemas/BlendMovement'}
          description: >-
            Lotes que já existem e recebem volume. Pode vir vazio desde a DEC-BLD-003: uma união cujo
            destino é um lote novo não tem nenhuma saída pré-existente. Quem exige ao menos uma saída — de
            qualquer tipo — é o domínio, que conta as duas listas juntas
        results:
          type: array
          items: {$ref: '#/components/schemas/BlendResultPlan'}
          description: >-
            Saídas que ainda não são lote. Cada uma vira um lote na execução, nunca na simulação: antes de
            executar nenhuma cerveja se tocou
        declaredLossLiters:
          type: number
          minimum: 0
          default: 0
          description: >-
            O caminho legítimo para o balanço fechar. Quem perdeu 12 L na transferência declara 12 L; o
            que não se aceita é a conta não fechar sem ninguém dizer por quê
        reason:
          type: string
          maxLength: 500
          description: >-
            Obrigatório. Blend sem motivo é decisão sem rastro: meses depois ninguém sabe se foi correção
            de desvio, ajuste de estilo ou aproveitamento de sobra
    BlendResultPlan:
      type: object
      required: [recipeId, equipmentId, liters]
      properties:
        recipeId:
          type: string
          format: uuid
          description: >-
            A receita publicada que o resultado passa a ser, DECLARADA por quem planeja e não inferida da
            origem predominante. Uma união de 60% de IPA com 40% de Stout não é "uma IPA", e herdar a
            receita da maior parte imprimiria o ABV e o estilo dela no rótulo de outra cerveja
        equipmentId:
          type: string
          format: uuid
          description: >-
            O tanque que recebe o resultado. Cerveja está sempre em algum lugar, e é o tanque que liga
            sensor e fermentação ao lote. Tanque já ocupado é recusado com 409 `vessel_occupied`
        liters:
          type: number
          exclusiveMinimum: 0
    BlendResult:
      type: object
      description: >-
        Saída planejada e, depois da execução, o lote que ela produziu.
      properties:
        seq:
          type: integer
          description: Posição na operação; é por ela que o lote criado se liga de volta ao que foi planejado
        recipeId: {type: string, format: uuid}
        equipmentId: {type: string, format: uuid}
        liters: {type: number}
        batchId:
          type: string
          format: uuid
          nullable: true
          description: >-
            O lote criado. Nulo enquanto a operação não executou é o estado honesto — o lote não existe.
            Omitir o campo faria a tela adivinhar a diferença entre "ainda não" e "não vai ter"
    BlendMovement:
      type: object
      required: [batchId, liters]
      properties:
        batchId: {type: string, format: uuid}
        liters:
          type: number
          exclusiveMinimum: 0
          description: >-
            Sempre positivo. O sentido vem do lado em que o movimento está, nunca do sinal — guardá-lo no
            sinal transformaria todo erro de sinal num balanço que fecha por acidente
    BlendOperation:
      type: object
      description: >-
        As três parcelas do balanço viajam juntas e sempre. Devolver só o total de saída deixaria quem
        consome sem como conferir a conta — e um balanço que ninguém pode conferir é uma afirmação
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [MERGE, SPLIT]}
        inputs: {type: array, items: {$ref: '#/components/schemas/BlendMovement'}}
        outputs: {type: array, items: {$ref: '#/components/schemas/BlendMovement'}}
        results: {type: array, items: {$ref: '#/components/schemas/BlendResult'}}
        inputLiters: {type: number}
        outputLiters: {type: number}
        declaredLossLiters: {type: number}
        reason: {type: string}
        status: {type: string, enum: [SIMULATED, APPROVED, EXECUTED, DISCARDED]}
        contributesLineage:
          type: boolean
          description: >-
            Se esta operação já pesa na genealogia — e portanto no recall. Explícito no contrato porque
            deduzi-lo de `status` exigiria conhecer a regra
        simulatedBy: {type: string, format: uuid}
        simulatedAt: {type: string, format: date-time}
        approvedBy: {type: string, format: uuid, nullable: true}
        approvedAt: {type: string, format: date-time, nullable: true}
        executedBy: {type: string, format: uuid, nullable: true}
        executedAt: {type: string, format: date-time, nullable: true}
    PlanExperiment:
      type: object
      required: [recipeId, hypothesis, controlBatchId, variantBatchId, factors]
      properties:
        recipeId: {type: string, format: uuid}
        hypothesis:
          type: string
          maxLength: 2000
          description: >-
            Declarada antes de existir resultado, e depois imutável. Um experimento cuja hipótese pode ser
            reescrita depois de ver o resultado sempre confirma a hipótese
        controlBatchId: {type: string, format: uuid}
        variantBatchId: {type: string, format: uuid}
        factors:
          type: array
          minItems: 1
          description: Todos os fatores comparados, inclusive os iguais. Exatamente um pode diferir
          items: {$ref: '#/components/schemas/ExperimentFactor'}
        plannedMeasurements:
          type: array
          description: >-
            Grandezas definidas ANTES. Sem elas, a comparação vira escolher depois o número que favorece
            a conclusão — e sempre há alguma grandeza em que a variante ganha
          items: {type: string}
        sensoryPlanned: {type: boolean}
        sensoryBlind:
          type: boolean
          description: >-
            Sensorial não cego vira limitação declarada: quem sabe qual copo é a variante encontra o que
            espera encontrar
    ExperimentFactor:
      type: object
      required: [name, controlValue, variantValue]
      properties:
        name: {type: string, maxLength: 120}
        controlValue: {type: string, maxLength: 200}
        variantValue: {type: string, maxLength: 200}
        differs: {type: boolean, readOnly: true}
    ConcludeExperiment:
      type: object
      required: [supported, observation]
      properties:
        supported:
          type: boolean
          description: >-
            Compatível com a hipótese. Nunca "provado" — um par de lotes não prova nada, e o nome do campo
            é o que impede o relatório de dizer que provou
        observation: {type: string, maxLength: 4000}
    ExperimentLimitation:
      type: object
      description: O que esta conclusão NÃO pode afirmar, derivado do desenho do experimento
      properties:
        code:
          type: string
          enum: [SINGLE_PAIR, SENSORY_NOT_BLIND, NO_SENSORY, NO_PLANNED_MEASUREMENT, SINGLE_METRIC]
        description: {type: string}
    Experiment:
      type: object
      description: >-
        O experimento. `limitations` nunca vem vazio e não é filtrável: um lote dividido é sempre n=1, e
        quem consome a API recebe as restrições junto com o resultado
      properties:
        id: {type: string, format: uuid}
        recipeId: {type: string, format: uuid}
        hypothesis: {type: string}
        controlBatchId: {type: string, format: uuid}
        variantBatchId: {type: string, format: uuid}
        isolatedVariable: {$ref: '#/components/schemas/ExperimentFactor'}
        factors:
          type: array
          items: {$ref: '#/components/schemas/ExperimentFactor'}
        plannedMeasurements: {type: array, items: {type: string}}
        sensoryPlanned: {type: boolean}
        sensoryBlind: {type: boolean}
        status: {type: string, enum: [PLANNED, RUNNING, CONCLUDED, ABANDONED]}
        limitations:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ExperimentLimitation'}
        conclusion:
          nullable: true
          description: Nulo é "ainda não se concluiu", diferente de concluir que não houve efeito
          allOf: [{$ref: '#/components/schemas/ExperimentConclusion'}]
        plannedBy: {type: string, format: uuid}
        plannedAt: {type: string, format: date-time}
    ExperimentConclusion:
      type: object
      properties:
        supported: {type: boolean}
        observation: {type: string}
        concludedBy: {type: string, format: uuid}
        concludedAt: {type: string, format: date-time}
    AnalyzeControlChart:
      type: object
      required: [recipeId, kind, batchIds]
      properties:
        recipeId: {type: string, format: uuid}
        kind: {type: string, enum: [DENSITY, TEMPERATURE, VOLUME, PH, COLOR, IBU, ABV]}
        batchIds:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
    ControlLimits:
      type: object
      description: >-
        Calculados da série, três sigmas em volta da média. Três sigmas não é arbitrário: num processo
        estável ~99,7% dos pontos caem dentro, então um ponto fora tem ~0,3% de chance de ser acaso.
        Limites mais estreitos (2σ) alarmariam a cada vinte medições, e alarme falso frequente treina quem
        opera a ignorar o alarme
      properties:
        centerLine: {type: number}
        lowerControlLimit: {type: number}
        upperControlLimit: {type: number}
        sigma: {type: number}
        sampleSize: {type: integer, description: Mínimo de 20 — abaixo disso os limites oscilam a cada medição}
    ControlSignal:
      type: object
      description: >-
        Um sinal diz que a variação é grande demais para ser acaso — **não** que a cerveja está ruim, e
        muito menos por quê. A causa é investigada por quem conhece o processo
      properties:
        kind: {type: string, enum: [BEYOND_LIMIT, RUN_ON_ONE_SIDE, TREND]}
        description: {type: string}
        firstIndex: {type: integer}
        length: {type: integer}
    ControlChart:
      type: object
      properties:
        kind: {type: string}
        unit: {type: string}
        points:
          type: array
          items:
            type: object
            properties:
              batchId: {type: string, format: uuid}
              value: {type: number}
              measuredAt: {type: string, format: date-time}
          description: Em ordem cronológica, atravessando os lotes
        controlLimits: {$ref: '#/components/schemas/ControlLimits'}
        signals:
          type: array
          items: {$ref: '#/components/schemas/ControlSignal'}
        inControl: {type: boolean, description: Nenhum sinal encontrado}
    ComputeLearnedProfile:
      type: object
      required: [recipeId, batchIds]
      properties:
        recipeId: {type: string, format: uuid}
        batchIds:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
          description: >-
            A amostra. Lotes de outra receita, de outra cervejaria ou ainda não transferidos são
            silenciosamente excluídos — e os que sobraram ficam gravados em `observedBatchIds`
    LearnedProfileEstimate:
      type: object
      description: >-
        **A média nunca viaja sozinha.** Ela vem sempre com `sampleSize`, `confidence` e a faixa — quem
        consome a API não consegue pegar o número sem ver sobre quantas observações ele foi construído.
        "Rendimento de 92%" pode vir de trinta lotes agrupados ou de dois, um de 84 e um de 100
      properties:
        metric: {type: string, enum: [VOLUME_YIELD_PERCENT, TRANSFER_LOSS_LITERS]}
        label:
          type: string
          description: >-
            Descreve uma grandeza OBSERVADA, nunca uma causa. O rendimento não se chama "eficiência":
            quem lê "eficiência 74%" pensa em extração de açúcar do malte, que é outra grandeza
        mean: {type: number, nullable: true, description: Nula quando não houve amostra suficiente}
        standardDeviation:
          type: number
          nullable: true
          description: Dispersão entre os lotes. Amostral (n-1) — uma amostra não é o universo
        lowerBound:
          type: number
          nullable: true
          description: >-
            Intervalo de confiança da MÉDIA (~95%), não a variação observada. É ele que encolhe conforme
            se acumula histórico, e é ele que denuncia que dois lotes não bastam
        upperBound: {type: number, nullable: true}
        sampleSize: {type: integer}
        confidence:
          type: string
          enum: [INSUFFICIENT, LOW, MODERATE, HIGH]
          description: >-
            Existe porque uma faixa numérica não basta: um intervalo estreito sobre três lotes parece
            confiável e não é. INSUFFICIENT (menos de 2) não é confiança baixa — é ausência de estimativa
        usable: {type: boolean}
    LearnedProfile:
      type: object
      properties:
        id: {type: string, format: uuid}
        recipeId: {type: string, format: uuid}
        version: {type: integer, description: Derivada, nunca informada. Versão nova não sobrescreve}
        estimates:
          type: array
          items: {$ref: '#/components/schemas/LearnedProfileEstimate'}
          description: >-
            Todas as métricas conhecidas aparecem, inclusive as sem amostra suficiente. Ausência declarada
            é informação; ausência silenciosa faria alguém concluir que a perda é zero
        observedBatchIds:
          type: array
          items: {type: string, format: uuid}
          description: >-
            Os lotes efetivamente lidos. Não é metadado: é o que torna o número reproduzível, e o que torna
            visível a exclusão de um lote anômalo
        computedAt: {type: string, format: date-time}
        hasAnyUsableEstimate: {type: boolean}
    ScanResolution:
      type: object
      properties:
        type: {type: string, enum: [equipamento, lote, op, embalagem]}
        identifier:
          type: string
          description: >-
            Só letras, dígitos, hífen, sublinhado e ponto. É o que impede uma etiqueta impressa de carregar
            caminho, query ou script para dentro da aplicação — a etiqueta é entrada de terceiro tanto
            quanto um formulário
        route: {type: string, description: Para onde a interface leva depois de resolver}
    WebhookSubscription:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        endpoint: {type: string, format: uri, description: Sempre https}
        events: {type: array, items: {type: string}}
        status: {type: string, enum: [ACTIVE, PAUSED, REVOKED]}
        secretHint:
          type: string
          description: >-
            Os primeiros caracteres do segredo. Serve para conferir "é este mesmo o que configurei do outro
            lado?" sem revelar o valor — mostrar nada tornaria impossível distinguir duas assinaturas mal
            configuradas
        createdAt: {type: string, format: date-time}
        version: {type: integer, format: int64}
    CreateWebhook:
      type: object
      required: [name, endpoint, events]
      properties:
        name: {type: string, maxLength: 120}
        endpoint:
          type: string
          format: uri
          maxLength: 500
          description: Precisa começar com https://
        events:
          type: array
          minItems: 1
          items: {type: string}
          description: Nomes externos da allowlist; ao menos um
    CreatedWebhook:
      type: object
      properties:
        subscription: {$ref: '#/components/schemas/WebhookSubscription'}
        secret:
          type: string
          description: >-
            O segredo do HMAC, em claro. **Aparece apenas nesta resposta** e em nenhuma outra, nunca. Use-o
            para validar o cabeçalho X-Brassia-Signature no destino
        warning: {type: string}
    ChangeWebhookStatus:
      type: object
      required: [status, expectedVersion]
      properties:
        status: {type: string, enum: [ACTIVE, PAUSED, REVOKED]}
        expectedVersion: {type: integer, format: int64}
    WebhookDelivery:
      type: object
      properties:
        id: {type: string, format: uuid}
        eventType: {type: string}
        eventId:
          type: string
          description: >-
            Identidade do fato. Viaja no cabeçalho X-Brassia-Event-Id para que o destino possa deduplicar o
            retry — a garantia deste lado é "ao menos uma vez", e a deduplicação do outro é o que a torna
            "exatamente uma" na prática
        status: {type: string, enum: [PENDING, DELIVERED, EXHAUSTED]}
        attempts: {type: integer}
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
          description: Backoff exponencial (30s, 1min, 2min, 4min). Nulo quando terminal
        deliveredAt: {type: string, format: date-time, nullable: true}
        lastResponseStatus:
          type: integer
          nullable: true
          description: Nulo quando o destino não respondeu — timeout, DNS, conexão recusada
        lastError: {type: string, nullable: true, description: Truncado em 200 caracteres}
        createdAt: {type: string, format: date-time}
    SensorDevice:
      type: object
      properties:
        id: {type: string, format: uuid}
        code:
          type: string
          description: Identidade externa do aparelho, normalizada para maiúsculas
        name: {type: string}
        measure: {type: string, enum: [DENSITY, TEMPERATURE, PRESSURE, FLOW]}
        unit: {type: string, enum: [SG, PLATO, C, F, PSI, BAR, L_MIN, HL_H]}
        equipmentId: {type: string, format: uuid, nullable: true}
        expectedIntervalSeconds:
          type: integer
          nullable: true
          description: Régua do atraso. Nulo = atraso medido e informado, mas não julgado
        payloadFormat:
          type: string
          enum: [CANONICAL, ISPINDEL, TILT]
          description: De que jeito o dispositivo fala (INT-006). Atributo do cadastro, não da mensagem
        status: {type: string, enum: [ACTIVE, PAUSED, REVOKED]}
        registeredAt: {type: string, format: date-time}
        version: {type: integer, format: int64, description: Para o bloqueio otimista}
    RegisterSensorDevice:
      type: object
      required: [code, name, measure, unit]
      properties:
        code: {type: string, maxLength: 40}
        name: {type: string, maxLength: 120}
        measure: {type: string, enum: [DENSITY, TEMPERATURE, PRESSURE, FLOW]}
        unit:
          type: string
          description: Precisa ser compatível com a grandeza; incompatível é recusada
        equipmentId: {type: string, format: uuid, nullable: true}
        expectedIntervalSeconds: {type: integer, minimum: 1, nullable: true}
        payloadFormat:
          type: string
          enum: [CANONICAL, ISPINDEL, TILT]
          default: CANONICAL
          description: Ausente = formato da casa
    ChangeSensorDeviceStatus:
      type: object
      required: [status, expectedVersion]
      properties:
        status: {type: string, enum: [ACTIVE, PAUSED, REVOKED]}
        expectedVersion: {type: integer, format: int64}
    IngestSensorReading:
      type: object
      required: [deviceCode, messageId, measure, value, unit, measuredAt]
      properties:
        deviceCode: {type: string, maxLength: 40}
        messageId:
          type: string
          maxLength: 80
          description: >-
            Identidade da mensagem, carimbada pelo dispositivo. É o que torna a repetição reconhecível.
            Não deve ser derivada do conteúdo
        measure: {type: string, enum: [DENSITY, TEMPERATURE, PRESSURE, FLOW]}
        value:
          type: number
          description: Decimal; fora da faixa plausível é sinalizado, não recusado
        unit: {type: string}
        measuredAt:
          type: string
          format: date-time
          description: Relógio do DISPOSITIVO. Datado no futuro vira quality=FUTURE_CLOCK
    SensorReading:
      type: object
      properties:
        id: {type: string, format: uuid}
        deviceId: {type: string, format: uuid}
        messageId: {type: string}
        measure: {type: string, enum: [DENSITY, TEMPERATURE, PRESSURE, FLOW]}
        value: {type: number}
        unit: {type: string}
        measuredAt: {type: string, format: date-time, description: Relógio do dispositivo}
        receivedAt: {type: string, format: date-time, description: Nosso relógio}
        quality:
          type: string
          enum: [GOOD, OUT_OF_RANGE, FUTURE_CLOCK]
          description: >-
            Nenhum destes valores significa "recusada". FUTURE_CLOCK tem precedência sobre OUT_OF_RANGE:
            quando o instante não é confiável, o problema da leitura não é o número, é que ela não pode
            ser posicionada na série
        qualityReason:
          type: string
          nullable: true
          description: Nulo quando GOOD; sempre presente quando não é
        delaySeconds:
          type: integer
          format: int64
          description: >-
            receivedAt menos measuredAt. Negativo quando o relógio do dispositivo está adiantado, e o
            negativo é preservado — normalizar para zero apagaria a evidência
        late:
          type: boolean
          description: >-
            Atraso maior que o intervalo esperado do dispositivo. Independente de `quality`: uma leitura
            pode ter valor perfeito e ter chegado tarde. Negativo nunca é atrasado
    SensorIngestResponse:
      type: object
      properties:
        reading: {$ref: '#/components/schemas/SensorReading'}
        duplicate:
          type: boolean
          description: >-
            Verdadeiro quando a mensagem já estava registrada. Permite distinguir "o gateway está
            reenviando demais" de "estou recebendo o dobro de leituras" — mesmo sintoma no gráfico,
            soluções opostas
    CleaningPolicy:
      type: object
      required: [expiresByTime]
      properties:
        validityHours:
          type: integer
          nullable: true
          description: Ausente significa que a liberação não expira por tempo
        expiresByTime: {type: boolean}
    GasPolicy:
      type: object
      required: [derivesDueDate]
      properties:
        requalificationMonths: {type: integer, nullable: true}
        derivesDueDate:
          type: boolean
          description: Verdadeiro quando há periodicidade e o vencimento pode ser derivado
    CalibrationPolicy:
      type: object
      required: [monthsByType]
      properties:
        monthsByType:
          type: object
          description: Periodicidade em meses por tipo; tipo ausente não deriva vencimento
          additionalProperties: {type: integer, minimum: 1, maximum: 120}
    CapaDeadlines:
      type: object
      required: [containmentDays, investigationDays, verificationDays]
      properties:
        containmentDays: {type: integer, minimum: 1}
        investigationDays: {type: integer, minimum: 1}
        verificationDays: {type: integer, minimum: 1}
    CapaPolicy:
      type: object
      required: [bySeverity]
      properties:
        bySeverity:
          type: object
          description: Prazos em dias da abertura, por severidade; ausente exige prazo informado
          additionalProperties: {$ref: '#/components/schemas/CapaDeadlines'}
    SensoryPolicy:
      type: object
      required: [maxScore, appliesToNewSessionsOnly]
      properties:
        maxScore: {type: integer, minimum: 3, maximum: 100}
        appliesToNewSessionsOnly:
          type: boolean
          description: Sempre verdadeiro — a escala é congelada em cada sessão
    SensoryAttribute:
      type: string
      description: Atributos da ficha, nota de 0 a 10
      enum: [APPEARANCE, AROMA, FLAVOR, BODY, OVERALL]
    CreateSensorySession:
      type: object
      required: [code, purpose, scheduledFor]
      properties:
        code: {type: string, maxLength: 40}
        purpose: {type: string, maxLength: 200}
        scheduledFor: {type: string, format: date}
    SensorySample:
      type: object
      required: [id, blindCode]
      properties:
        id: {type: string, format: uuid}
        blindCode:
          type: string
          pattern: '^[0-9]{3}$'
          description: Três dígitos aleatórios sorteados pelo sistema
        batchId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Nulo enquanto a sessão não é encerrada. O vínculo nunca é apagado — apenas não é
            revelado antes do fechamento.
        note: {type: string, nullable: true}
    SensorySession:
      type: object
      required: [id, code, purpose, scheduledFor, status, statusLabel, resultsAvailable,
                 evaluationCount, samples]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        purpose: {type: string}
        scheduledFor: {type: string, format: date}
        status: {type: string, enum: [DRAFT, OPEN, CLOSED]}
        statusLabel: {type: string}
        resultsAvailable: {type: boolean}
        evaluationCount:
          type: integer
          description: O único número público enquanto a sessão está aberta
        samples: {type: array, items: {$ref: '#/components/schemas/SensorySample'}}
        openedAt: {type: string, format: date-time, nullable: true}
        closedAt: {type: string, format: date-time, nullable: true}
    SubmitSensoryEvaluation:
      type: object
      required: [sampleId, scores]
      properties:
        sampleId: {type: string, format: uuid}
        scores:
          type: object
          description: Todos os cinco atributos, de 0 a 10; faltando um, a ficha é recusada
          additionalProperties: {type: integer, minimum: 0, maximum: 10}
        descriptors: {type: array, items: {type: string}}
        note: {type: string, maxLength: 1000, nullable: true}
    SensorySampleResult:
      type: object
      required: [sampleId, blindCode, batchId, evaluations, averages, overallAverage, spread,
                 descriptors]
      properties:
        sampleId: {type: string, format: uuid}
        blindCode: {type: string}
        batchId: {type: string, format: uuid}
        evaluations: {type: integer}
        averages:
          type: object
          additionalProperties: {type: number}
        overallAverage: {type: number}
        spread:
          type: number
          description: Diferença entre a maior e a menor nota global; painel disperso pede calibração
        descriptors: {type: array, items: {type: string}}
    BatchConsistency:
      type: object
      required: [batchId, blindCodes, difference]
      properties:
        batchId: {type: string, format: uuid}
        blindCodes: {type: array, items: {type: string}}
        difference:
          type: number
          description: >-
            Diferença entre médias de amostras do mesmo lote. A cerveja era a mesma, então o valor
            mede o viés do painel.
    SensoryResults:
      type: object
      required: [samples, consistency]
      properties:
        samples: {type: array, items: {$ref: '#/components/schemas/SensorySampleResult'}}
        consistency: {type: array, items: {$ref: '#/components/schemas/BatchConsistency'}}
    NonConformitySource:
      type: string
      enum: [DEVIATION, COMPLAINT, AUDIT, SUPPLIER, OTHER]
    NonConformityStatus:
      type: string
      description: Fases em ordem; pular etapa responde 409 `nc_phase_out_of_order`
      enum: [OPEN, CONTAINED, INVESTIGATED, ACTION_PLANNED, VERIFIED, CLOSED]
    CapaActionKind:
      type: string
      description: Corretiva trata a ocorrência; preventiva trata a causa
      enum: [CORRECTIVE, PREVENTIVE]
    OpenNonConformity:
      type: object
      required: [title, description, source, severity]
      properties:
        code:
          type: string
          maxLength: 40
          description: >-
            Opcional desde a DEB-AIA-003. Em branco, o sistema numera como NC-AAAA-NNNN — por ano, porque
            é assim que se referencia não conformidade numa auditoria. Deixou de ser obrigatório porque um
            comando executado a partir de uma proposta do copiloto não tem quem digite
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 2000}
        source: {$ref: '#/components/schemas/NonConformitySource'}
        deviationId:
          type: string
          format: uuid
          nullable: true
          description: Obrigatório quando a origem é DEVIATION
        batchId:
          type: string
          format: uuid
          nullable: true
          description: >-
            O lote de que a NC fala (DEB-AIA-003). Nulo é legítimo e permanece: NC de auditoria, de
            fornecedor ou de processo não tem lote — exigir o vínculo forçaria a inventar um lote para a
            não conformidade de um treinamento vencido
        severity: {$ref: '#/components/schemas/QualitySeverity'}
        containmentDueOn:
          type: string
          format: date
          nullable: true
          description: >-
            Os três prazos são opcionais: omitidos os três, saem da política de severidade da casa
            (PRM-001). Sem política configurada a abertura é RECUSADA, e isso é regra e não lacuna — prazo
            de contenção é decisão da cervejaria com quem a audita, não padrão técnico
        investigationDueOn: {type: string, format: date, nullable: true}
        verificationDueOn: {type: string, format: date, nullable: true}
    PlanCapaAction:
      type: object
      required: [kind, description, owner, dueOn]
      properties:
        kind: {$ref: '#/components/schemas/CapaActionKind'}
        description: {type: string, maxLength: 1000}
        owner: {type: string, maxLength: 120}
        dueOn: {type: string, format: date}
    CapaAction:
      type: object
      required: [id, kind, kindLabel, description, owner, dueOn, completed, overdue]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/CapaActionKind'}
        kindLabel: {type: string}
        description: {type: string}
        owner: {type: string}
        dueOn: {type: string, format: date}
        completedAt: {type: string, format: date-time, nullable: true}
        completed: {type: boolean}
        overdue: {type: boolean, description: Derivado do prazo e da data da consulta}
    NcVerification:
      type: object
      required: [effective, evidence, verifiedAt]
      properties:
        effective: {type: boolean}
        evidence: {type: string}
        verifiedAt: {type: string, format: date-time}
    NonConformity:
      type: object
      required: [id, code, title, description, source, sourceLabel, severity, severityLabel, status,
                 statusLabel, containmentDueOn, investigationDueOn, verificationDueOn, overduePhases,
                 overdue, closable, actions, verifications, openedAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        title: {type: string}
        description: {type: string}
        source: {$ref: '#/components/schemas/NonConformitySource'}
        sourceLabel: {type: string}
        deviationId: {type: string, format: uuid, nullable: true}
        severity: {$ref: '#/components/schemas/QualitySeverity'}
        severityLabel: {type: string}
        status: {$ref: '#/components/schemas/NonConformityStatus'}
        statusLabel: {type: string}
        containmentDueOn: {type: string, format: date}
        investigationDueOn: {type: string, format: date}
        verificationDueOn: {type: string, format: date}
        overduePhases:
          type: array
          description: Fases vencidas, derivadas na data da consulta
          items: {type: string}
        overdue: {type: boolean}
        closable: {type: boolean, description: Verdadeiro só após verificação eficaz}
        containment:
          type: object
          nullable: true
          properties:
            description: {type: string}
            takenAt: {type: string, format: date-time}
        investigation:
          type: object
          nullable: true
          properties:
            rootCause: {type: string}
            method: {type: string}
            investigatedAt: {type: string, format: date-time}
        actions: {type: array, items: {$ref: '#/components/schemas/CapaAction'}}
        verifications:
          type: array
          description: Histórico completo; a negativa fica como evidência
          items: {$ref: '#/components/schemas/NcVerification'}
        openedAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time, nullable: true}
    ProcessStage:
      type: string
      enum: [BREWING, FERMENTATION, MATURATION, PACKAGING, STORAGE]
    QualitySeverity:
      type: string
      description: Severidade do ponto, herdada pelo desvio que ele abre
      enum: [MINOR, MAJOR, CRITICAL]
    FrequencyKind:
      type: string
      enum: [PER_BATCH, PER_HOURS, PER_SHIFT, PER_PACKAGING_RUN]
      description: >-
        **Só `PER_HOURS` é fiscalizada** (QLT-001-A): uma varredura de hora em hora abre alerta na central
        do lote quando a medição passa da janela. É alerta e não bloqueio — parar a produção por um
        controle atrasado pararia a fábrica por causa de uma medição, e quem opera passaria a burlar a
        regra.


        As outras três continuam declaradas e não fiscalizadas, com motivo: `PER_BATCH` só está atrasada
        quando o lote acaba sem a medição, e não há instante durante o lote em que ela esteja; `PER_SHIFT`
        exigiria um calendário de turnos que a plataforma não tem, e inventá-lo produziria atraso onde a
        cervejaria não vê nenhum; `PER_PACKAGING_RUN` se refere à corrida de envase, não ao lote em
        produção.


        O aviso não se repete enquanto ninguém mede — a janela perdida é a mesma, e repetir esvaziaria a
        central. Depois de medir, atrasar outra vez é fato novo e avisa de novo.
    CreateControlPlan:
      type: object
      required: [code, name, stage]
      properties:
        code: {type: string, maxLength: 40}
        name: {type: string, maxLength: 120}
        recipeId:
          type: string
          format: uuid
          nullable: true
          description: Ausente vale para todas as receitas (controles de casa)
        stage: {$ref: '#/components/schemas/ProcessStage'}
    AmendControlPlan:
      type: object
      required: [name, stage]
      properties:
        name: {type: string, maxLength: 120}
        recipeId: {type: string, format: uuid, nullable: true}
        stage: {$ref: '#/components/schemas/ProcessStage'}
    AddControlPoint:
      type: object
      required: [parameter, unit, frequencyKind, action, severity]
      properties:
        parameter: {type: string, maxLength: 120}
        min: {type: number, nullable: true}
        max: {type: number, nullable: true}
        target: {type: number, nullable: true}
        unit: {type: string, maxLength: 20}
        frequencyKind: {$ref: '#/components/schemas/FrequencyKind'}
        everyHours:
          type: integer
          nullable: true
          description: Obrigatório em PER_HOURS e proibido no resto
        action: {type: string, maxLength: 500}
        severity: {$ref: '#/components/schemas/QualitySeverity'}
        critical: {type: boolean, default: false}
    ControlPoint:
      type: object
      required: [id, parameter, unit, limits, frequencyKind, frequency, action, severity,
                 severityLabel, critical]
      properties:
        id: {type: string, format: uuid}
        parameter: {type: string}
        min: {type: number, nullable: true}
        max: {type: number, nullable: true}
        target: {type: number, nullable: true}
        unit: {type: string}
        limits: {type: string, description: Texto pronto da faixa, incluindo limite unilateral}
        frequencyKind: {$ref: '#/components/schemas/FrequencyKind'}
        everyHours: {type: integer, nullable: true}
        frequency: {type: string}
        action: {type: string}
        severity: {$ref: '#/components/schemas/QualitySeverity'}
        severityLabel: {type: string}
        critical: {type: boolean, description: Ponto crítico exige instrumento apto para medir}
    ControlPlan:
      type: object
      required: [id, code, name, stage, stageLabel, status, version, points]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        recipeId: {type: string, format: uuid, nullable: true}
        stage: {$ref: '#/components/schemas/ProcessStage'}
        stageLabel: {type: string}
        status: {type: string, enum: [DRAFT, PUBLISHED]}
        version: {type: integer}
        points: {type: array, items: {$ref: '#/components/schemas/ControlPoint'}}
    RecordQualityMeasurement:
      type: object
      required: [planId, pointId, value]
      properties:
        planId: {type: string, format: uuid}
        pointId: {type: string, format: uuid}
        batchId: {type: string, format: uuid, nullable: true}
        instrumentId: {type: string, format: uuid, nullable: true}
        value: {type: number}
        note: {type: string, maxLength: 500, nullable: true}
        measuredAt: {type: string, format: date-time, nullable: true}
    QualityMeasurement:
      type: object
      required: [id, planId, planVersion, pointId, parameter, value, unit, withinSpec,
                 instrumentQuestionable, measuredAt]
      properties:
        id: {type: string, format: uuid}
        planId: {type: string, format: uuid}
        planVersion: {type: integer, description: Versão do plano pela qual foi julgada}
        pointId: {type: string, format: uuid}
        parameter: {type: string}
        batchId: {type: string, format: uuid, nullable: true}
        instrumentId: {type: string, format: uuid, nullable: true}
        instrumentFitness: {type: string, nullable: true}
        instrumentQuestionable: {type: boolean}
        value: {type: number}
        unit: {type: string}
        withinSpec: {type: boolean}
        note: {type: string, nullable: true}
        measuredAt: {type: string, format: date-time}
    Deviation:
      type: object
      required: [id, measurementId, planId, pointId, parameter, severity, severityLabel, bound,
                 limitValue, measuredValue, excess, unit, action, status, description, openedAt]
      properties:
        id: {type: string, format: uuid}
        measurementId: {type: string, format: uuid}
        planId: {type: string, format: uuid}
        pointId: {type: string, format: uuid}
        parameter: {type: string}
        severity: {$ref: '#/components/schemas/QualitySeverity'}
        severityLabel: {type: string}
        bound: {type: string, enum: [BELOW_MIN, ABOVE_MAX]}
        limitValue: {type: number}
        measuredValue: {type: number}
        excess: {type: number, description: O quanto passou do limite}
        unit: {type: string}
        action: {type: string, description: Copiada do ponto na abertura do desvio}
        status: {type: string, enum: [OPEN, CLOSED]}
        description: {type: string}
        openedAt: {type: string, format: date-time}
    MeasurementOutcome:
      type: object
      required: [measurementId, withinSpec]
      properties:
        measurementId: {type: string, format: uuid}
        withinSpec: {type: boolean}
        deviationId: {type: string, format: uuid, nullable: true}
        deviation:
          allOf: [{$ref: '#/components/schemas/Deviation'}]
          nullable: true
    CurvePoint:
      type: object
      required: [reference, measured]
      properties:
        reference: {type: number, description: Valor verdadeiro conferido contra o padrão}
        measured: {type: number, description: Valor que o instrumento indicou}
    CorrectionStep:
      type: object
      required: [name, method, version]
      properties:
        name: {type: string, enum: [temperature, curve]}
        method: {type: string, description: A fórmula aplicada}
        version: {type: string, description: Versão do cálculo; para a curva, o certificado de origem}
    CorrectReading:
      type: object
      required: [instrumentId, rawValue, unit]
      properties:
        instrumentId: {type: string, format: uuid}
        sourceReadingId:
          type: string
          format: uuid
          nullable: true
          description: Leitura de origem em outro módulo, como referência opaca
        rawValue: {type: number}
        unit: {type: string, maxLength: 20}
        sampleTempC: {type: number, nullable: true}
        calibrationTempC: {type: number, nullable: true}
        applyCurve: {type: boolean, default: false}
    ReadingCorrection:
      type: object
      required: [id, instrumentId, rawValue, correctedValue, delta, unit, steps, instrumentFitness,
                 trustworthy, caveats, appliedAt]
      properties:
        id: {type: string, format: uuid}
        instrumentId: {type: string, format: uuid}
        sourceReadingId: {type: string, format: uuid, nullable: true}
        rawValue: {type: number, description: Imutável — a correção nasce ao lado da medição}
        correctedValue: {type: number}
        delta: {type: number, description: Corrigido menos bruto}
        unit: {type: string}
        sampleTempC: {type: number, nullable: true}
        calibrationTempC: {type: number, nullable: true}
        steps:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/CorrectionStep'}
        instrumentFitness: {$ref: '#/components/schemas/Fitness'}
        trustworthy:
          type: boolean
          description: Falso quando o instrumento não estava apto ou o certificado tem restrição
        caveats: {type: array, items: {type: string}}
        appliedAt: {type: string, format: date-time}
    RegisterInstrument:
      type: object
      required: [code, name, type, rangeMin, rangeMax, resolution, accuracy, unit, location]
      properties:
        code: {type: string, maxLength: 40}
        name: {type: string, maxLength: 120}
        type: {$ref: '#/components/schemas/InstrumentType'}
        rangeMin: {type: number}
        rangeMax: {type: number}
        resolution: {type: number, description: Menor divisão que o instrumento mostra}
        accuracy: {type: number, description: Erro máximo admitido pelo certificado}
        unit: {type: string, maxLength: 20}
        location: {type: string, maxLength: 120}
    AmendInstrument:
      type: object
      required: [name, rangeMin, rangeMax, resolution, accuracy, unit, location]
      properties:
        name: {type: string, maxLength: 120}
        rangeMin: {type: number}
        rangeMax: {type: number}
        resolution: {type: number}
        accuracy: {type: number}
        unit: {type: string, maxLength: 20}
        location: {type: string, maxLength: 120}
    InstrumentType:
      type: string
      enum: [THERMOMETER, HYDROMETER, PH_METER, SCALE, PRESSURE_GAUGE, OXYGEN_METER, FLOW_METER]
    Fitness:
      type: string
      description: >-
        Aptidão derivada do estado cadastral, da última calibração e da data — nunca armazenada.
        Bloqueio e baixa precedem o vencimento.
      enum: [FIT, EXPIRED, UNCALIBRATED, REJECTED, BLOCKED, RETIRED]
    Instrument:
      type: object
      required: [id, code, name, type, typeLabel, rangeMin, rangeMax, resolution, accuracy, unit,
                 location, state, criticalUse, fitness, fitForCriticalUse]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        type: {$ref: '#/components/schemas/InstrumentType'}
        typeLabel: {type: string}
        rangeMin: {type: number}
        rangeMax: {type: number}
        resolution: {type: number}
        accuracy: {type: number}
        unit: {type: string}
        location: {type: string}
        state: {type: string, enum: [ACTIVE, BLOCKED, RETIRED]}
        blockReason: {type: string, nullable: true}
        criticalUse: {type: boolean, description: Designado para ponto crítico de controle}
        fitness: {$ref: '#/components/schemas/Fitness'}
        fitForCriticalUse:
          type: boolean
          description: Serve para medir em ponto crítico na data da consulta
        calibrationDueOn: {type: string, format: date, nullable: true}
        lastCalibration:
          allOf: [{$ref: '#/components/schemas/Calibration'}]
          nullable: true
    RecordCalibration:
      type: object
      required: [standardId, performedOn, dueOn, performedBy, certificateNumber, result, maxDeviation]
      properties:
        standardId: {type: string, format: uuid}
        performedOn: {type: string, format: date}
        dueOn: {type: string, format: date, description: Vem do certificado, não de regra fixa}
        performedBy: {type: string, maxLength: 120}
        certificateNumber: {type: string, maxLength: 60}
        result: {$ref: '#/components/schemas/CalibrationResult'}
        maxDeviation: {type: number, minimum: 0}
        restriction:
          type: string
          maxLength: 200
          nullable: true
          description: Obrigatória quando o resultado é APPROVED_WITH_RESTRICTION, proibida no resto
        note: {type: string, maxLength: 500, nullable: true}
        curve:
          type: array
          nullable: true
          description: >-
            Pontos conferidos pelo certificado. Sem eles o certificado diz a incerteza mas não
            permite corrigir leitura. Certificado reprovado não aceita curva.
          items: {$ref: '#/components/schemas/CurvePoint'}
    CalibrationResult:
      type: string
      enum: [APPROVED, APPROVED_WITH_RESTRICTION, REJECTED]
    Calibration:
      type: object
      required: [id, standardId, standardCode, performedOn, dueOn, performedBy, certificateNumber,
                 result, resultLabel, maxDeviation]
      properties:
        id: {type: string, format: uuid}
        standardId: {type: string, format: uuid}
        standardCode: {type: string}
        performedOn: {type: string, format: date}
        dueOn: {type: string, format: date}
        performedBy: {type: string}
        certificateNumber: {type: string}
        result: {$ref: '#/components/schemas/CalibrationResult'}
        resultLabel: {type: string}
        maxDeviation: {type: number}

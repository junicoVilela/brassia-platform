        cycleCount: {type: integer}
        avgWaterLiters: {type: number, nullable: true}
        minWaterLiters: {type: number, nullable: true}
        maxWaterLiters: {type: number, nullable: true}
        avgEnergyKwh: {type: number, nullable: true}
        minEnergyKwh: {type: number, nullable: true}
        maxEnergyKwh: {type: number, nullable: true}
        avgProductKg: {type: number, nullable: true}
        minProductKg: {type: number, nullable: true}
        maxProductKg: {type: number, nullable: true}
    CycleVerificationView:

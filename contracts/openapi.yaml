                 lineEquipmentId, plannedStart, plannedEnd, status, checklist, checklistComplete]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        batchId: {type: string, format: uuid}
        containerId: {type: string, format: uuid, description: "Ingrediente do tipo PACKAGING"}
        containerVolumeMl: {type: number, description: "Volume da embalagem congelado no plano"}
        plannedUnits: {type: integer, minimum: 1}
        plannedVolumeLiters: {type: number, description: "Derivado de unidades × volume; nunca informado"}

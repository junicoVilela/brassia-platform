        plannedStart: {type: string, format: date-time}
        plannedEnd: {type: string, format: date-time}
        status:
          type: string
          enum: [PLANNED, RESERVED, EXECUTED, CANCELLED]
          description: >
            Os dois estados terminais não se equivalem: CANCELLED devolve a embalagem reservada,
            EXECUTED a consumiu. Plano executado não é cancelável.

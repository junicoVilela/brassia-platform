        note: {type: string, maxLength: 300}
        realizedValue: {type: number, description: "Valor realizado (opcional); planejado = efeito estimado do motor"}
    RecordMeasurement:
      type: object
      required: [kind, value, unit, source]
      properties:
        stepId: {type: string, format: uuid, description: "Etapa do roteiro (opcional; se informada, deve ser do lote)"}
        kind:
          type: string
          enum: [DENSITY, TEMPERATURE, VOLUME, PH, COLOR, IBU, ABV]
          description: >-
            `ABV` é a exceção da regra "medição exige lote em andamento" (PKG-004-B): mede-se álcool na
            cerveja **pronta**, depois de fermentar. As demais são medições de brassa, e acrescentá-las a
            um lote encerrado descreveria um dia que já acabou
        value: {type: number}
        unit: {type: string, description: "Unidade compatível com a grandeza (ex.: SG/PLATO, C/F, L/ML, PH, EBC/SRM, IBU, %ABV)"}
        temperatureC: {type: number}
        method: {type: string, maxLength: 120}
        source: {type: string, enum: [MANUAL, DEVICE, IMPORTED]}
        clientRequestId:
          type: string
          maxLength: 80
          description: >-
            **Identidade do apontamento (PWA-002).** Gerada no aparelho no instante em que a pessoa
            registrou — não no envio. É o que permite ao servidor reconhecer o reenvio da fila offline como
            o mesmo fato: uma chave gerada no envio seria diferente a cada tentativa e criaria duas medições
            da mesma leitura.


            Com a chave, o reenvio responde **200 com `duplicate: true`** e devolve a medição já gravada, em
            vez de criar outra. Sem a chave (registro pela tela, com rede), todo envio é um registro novo —
            a requisição é síncrona e quem a fez viu a resposta.


            A garantia deste lado é "ao menos uma vez"; a chave é o que a transforma em "exatamente uma".

                 requiredNotDrawn]
      properties:
        templateCode: {type: string}
        templateVersion: {type: integer}
        printable: {type: boolean}
        lines:
          type: array
          items:
            type: object
            required: [field, required, present]
            properties:
              field: {$ref: '#/components/schemas/LabelFieldCode'}
              value: {type: string, nullable: true}
              source:
                type: string
                nullable: true
                description: "Origem rastreável do valor; nula quando não há fonte"
              required: {type: boolean}
              present: {type: boolean}
        missingRequired:
          type: array
          description: "Obrigatórios desenhados no layout, mas sem valor resolvido"
          items: {$ref: '#/components/schemas/LabelFieldCode'}
        missingOptional:
          type: array
          description: "Sem valor, mas não exigidos: apenas aviso"
          items: {$ref: '#/components/schemas/LabelFieldCode'}
        requiredNotDrawn:
          type: array
          description: "Exigidos pela regra que o layout sequer desenha: o template precisa mudar"
          items: {$ref: '#/components/schemas/LabelFieldCode'}
    LabelPrint:
      type: object
      required: [id, templateCode, templateVersion, quantity, reprint, printedBy, printedAt]
      properties:
        id: {type: string, format: uuid}
        templateCode: {type: string}
        templateVersion: {type: integer, description: "Versão usada; congelada na impressão"}
        quantity: {type: integer}
        reprint: {type: boolean}
        reason: {type: string, nullable: true}
        printedBy: {type: string, format: uuid}
        printedAt: {type: string, format: date-time}
    LabelNotPrintableProblem:
      type: object
      description: "Problem Details do rótulo incompleto; a correção difere por causa."
      properties:
        code: {type: string, enum: [label_not_printable]}
        label:
          type: object
          properties:
            missingRequired:
              type: array
              items: {$ref: '#/components/schemas/LabelFieldCode'}
            requiredNotDrawn:
              type: array
              items: {$ref: '#/components/schemas/LabelFieldCode'}
    ShelfLifePolicy:
      type: object
      required: [tiers, fallbackDays]
      properties:
        tiers:
          type: array
          minItems: 1
          description: Faixas por TPO máximo, aplicadas da mais limpa para a mais suja
          items:
            type: object
            required: [maxTpoPpb, shelfLifeDays]
            properties:
              maxTpoPpb: {type: number, exclusiveMinimum: 0}
              shelfLifeDays: {type: integer, minimum: 1}
        fallbackDays:
          type: integer
          minimum: 1
          description: Validade quando o TPO medido passa de todas as faixas (pior caso da casa)
    RecordFreshness:
      type: object
      required: [dissolvedOxygenPpb, totalPackageOxygenPpb, purgeMethod, purgeVerified, sealCheckMethod,
                 sealCheckPassed]
      properties:
        dissolvedOxygenPpb: {type: number, minimum: 0, description: "Oxigênio dissolvido na cerveja (DO)"}
        totalPackageOxygenPpb:
          type: number
          minimum: 0
          description: "Oxigênio total da embalagem (TPO); inclui o dissolvido, então TPO ≥ DO"
        purgeMethod: {type: string, maxLength: 120}
        purgeVerified: {type: boolean}
        sealCheckMethod: {type: string, maxLength: 120}
        sealCheckPassed: {type: boolean}
    ShelfLifeRecommendation:
      type: object
      required: [shelfLifeDays, bestBefore, totalPackageOxygenPpb, withinPolicyTiers, factors, caveats]
      properties:
        shelfLifeDays: {type: integer}
        bestBefore: {type: string, format: date}
        totalPackageOxygenPpb: {type: number}
        matchedTierMaxTpoPpb: {type: number, nullable: true}
        withinPolicyTiers: {type: boolean, description: Falso quando caiu no pior caso}
        factors:
          type: array
          description: Evidência que sustenta o número, fator a fator
          items:
            type: object
            required: [name, trustworthy, explanation]
            properties:
              name: {type: string, enum: [tpo, dissolvedOxygen, purge, seal]}
              trustworthy: {type: boolean}
              explanation: {type: string}
        caveats:
          type: array
          items: {type: string}
          description: Ressalvas que reduzem a confiança na recomendação, sem mudar o número
    Freshness:
      type: object
      required: [packagedOn, dissolvedOxygenPpb, totalPackageOxygenPpb, headspaceOxygenPpb, purgeMethod,
                 purgeVerified, sealCheckMethod, sealCheckPassed, evidenceComplete]
      properties:
        packagedOn: {type: string, format: date}
        dissolvedOxygenPpb: {type: number}
        totalPackageOxygenPpb: {type: number}
        headspaceOxygenPpb: {type: number, description: "O que o TPO tem além do já dissolvido"}
        purgeMethod: {type: string}
        purgeVerified: {type: boolean}
        sealCheckMethod: {type: string}
        sealCheckPassed: {type: boolean}
        evidenceComplete: {type: boolean, description: "Purga conferida e vedação aprovada"}
        recommendedShelfLifeDays: {type: integer, nullable: true}
        recommendedBestBefore: {type: string, format: date, nullable: true}
        overrideShelfLifeDays: {type: integer, nullable: true}
        overrideBestBefore: {type: string, format: date, nullable: true}
        overrideReason: {type: string, nullable: true}
        overriddenBy: {type: string, format: uuid, nullable: true}
        overriddenAt: {type: string, format: date-time, nullable: true}
        extendsBeyondRecommendation:
          type: boolean
          description: Override que estende a validade além do que a evidência sustentava
        effectiveShelfLifeDays: {type: integer, nullable: true, description: "A sobreposta, senão a recomendada"}
        effectiveBestBefore: {type: string, format: date, nullable: true}
    GasTubing:
      type: object
      required: [id, material, internalDiameterMm, resistanceBarPerMeter, referenceFlowLpm]
      properties:
        id: {type: string, format: uuid}
        material: {type: string}
        internalDiameterMm: {type: number}
        resistanceBarPerMeter: {type: number}
        referenceFlowLpm:
          type: number
          description: Vazão em que o fabricante mediu a resistência; base do escalonamento
    RegisterGasTubing:
      type: object
      required: [material, internalDiameterMm, resistanceBarPerMeter, referenceFlowLpm]
      properties:
        material: {type: string, maxLength: 60}
        internalDiameterMm: {type: number, exclusiveMinimum: 0}
        resistanceBarPerMeter: {type: number, exclusiveMinimum: 0}
        referenceFlowLpm: {type: number, exclusiveMinimum: 0}
    ServiceLine:
      type: object
      required: [id, code, name, pointOfUseEquipmentId, currentRevision, everApplied]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        pointOfUseEquipmentId: {type: string, format: uuid}
        currentRevision: {type: integer, description: "Zero enquanto nenhuma montagem foi aplicada"}
        everApplied: {type: boolean}
    ServiceLineRevision:
      type: object
      required: [revision, material, internalDiameterMm, appliedLengthMeters, recommendedLengthMeters,
                 lengthDeviationMeters, appliedPressureBar, elevationMeters, residualPressureBar,
                 targetFlowLpm, servingTempC, targetCo2Volumes, calculationMethod, calculatorVersion,
                 appliedBy, appliedAt]
      properties:
        revision: {type: integer, minimum: 1}
        material: {type: string}
        internalDiameterMm: {type: number}
        appliedLengthMeters: {type: number, description: "O que foi montado de fato"}
        recommendedLengthMeters: {type: number}
        lengthDeviationMeters: {type: number, description: "Montado − recomendado; registrado, não corrigido"}
        appliedPressureBar: {type: number}
        elevationMeters: {type: number}
        residualPressureBar: {type: number}
        targetFlowLpm: {type: number}
        servingTempC: {type: number}
        targetCo2Volumes: {type: number}
        calculationMethod: {type: string}
        calculatorVersion: {type: string}
        note: {type: string, nullable: true}
        appliedBy: {type: string, format: uuid}
        appliedAt: {type: string, format: date-time}
    ApplyServiceLineRevision:
      type: object
      required: [targetCo2Volumes, servingTempC, elevationMeters, residualPressureBar, targetFlowLpm,
                 resistanceId, appliedLengthMeters]
      properties:
        targetCo2Volumes: {type: number, exclusiveMinimum: 0}
        servingTempC: {type: number}
        elevationMeters: {type: number, description: "Pode ser negativo: torneira abaixo do barril"}
        residualPressureBar: {type: number, minimum: 0}
        targetFlowLpm: {type: number, exclusiveMinimum: 0}
        resistanceId: {type: string, format: uuid}
        appliedLengthMeters: {type: number, exclusiveMinimum: 0}
        note: {type: string, maxLength: 200}
    LineBalance:
      type: object
      required: [appliedPressureBar, recommendedLengthMeters, hydrostaticBar,
                 effectiveResistanceBarPerMeter, targetFlowLpm, servingTempC, targetCo2Volumes, material,
                 internalDiameterMm, calculationMethod, calculatorVersion, feasible, warnings]
      properties:
        appliedPressureBar: {type: number, description: "Vem do equilíbrio de carbonatação na temperatura"}
        recommendedLengthMeters: {type: number, description: "Zero quando a montagem é impossível"}
        hydrostaticBar: {type: number, description: "Pressão consumida (ou devolvida) pelo desnível"}
        effectiveResistanceBarPerMeter: {type: number, description: "Resistência do tubo escalada pela vazão"}
        targetFlowLpm: {type: number}
        servingTempC: {type: number}
        targetCo2Volumes: {type: number}
        material: {type: string}
        internalDiameterMm: {type: number}
        calculationMethod: {type: string}
        calculatorVersion: {type: string}
        feasible: {type: boolean}
        warnings:
          type: array
          description: "Sempre inclui manual_adjustment_only: o sistema não ajusta válvula nem regulador"
          items:
            type: object
            required: [code, message, safety]
            properties:
              code:
                type: string
                enum: [manual_adjustment_only, no_balance_possible, above_network_limit, calculation_alert]
              message: {type: string}
              safety: {type: boolean}
    GasCylinder:
      type: object
      required: [id, code, gasType, capacityKg, tareKg, contentKg, requalificationDueOn, expired, status,
                 allocatable, location]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        gasType: {type: string, enum: [CO2, N2, MIX]}
        capacityKg: {type: number}
        tareKg: {type: number}
        contentKg: {type: number, description: "Massa restante; o gás não é medido por pressão"}
        requalificationDueOn: {type: string, format: date}
        expired: {type: boolean, description: "Requalificação vencida hoje"}
        status: {type: string, enum: [AVAILABLE, CONNECTED, EMPTY, BLOCKED]}
        allocatable:
          type: boolean
          description: "Sem impedimento para ser conectado; a tela não reimplementa a regra"
        blockReason: {type: string, nullable: true}
        location: {type: string}
    RegisterGasCylinder:
      type: object
      required: [code, gasType, capacityKg, tareKg, contentKg, requalificationDueOn, location]
      properties:
        code: {type: string, maxLength: 40}
        gasType: {type: string, enum: [CO2, N2, MIX]}
        capacityKg: {type: number, exclusiveMinimum: 0}
        tareKg: {type: number, exclusiveMinimum: 0}
        contentKg: {type: number, minimum: 0}
        requalificationDueOn: {type: string, format: date}
        location: {type: string, maxLength: 120}
    GasComponent:
      type: object
      required: [id, kind, code, name, maxPressureBar, active]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [REGULATOR, MANIFOLD]}
        code: {type: string}
        name: {type: string}
        maxPressureBar: {type: number}
        setPressureBar: {type: number, nullable: true, description: "Só regulador tem ajuste"}
        active: {type: boolean}
    RegisterGasComponent:
      type: object
      required: [kind, code, name, maxPressureBar]
      properties:
        kind: {type: string, enum: [REGULATOR, MANIFOLD]}
        code: {type: string, maxLength: 40}
        name: {type: string, maxLength: 120}
        maxPressureBar: {type: number, exclusiveMinimum: 0}
        setPressureBar:
          type: number
          nullable: true
          description: "Obrigatório no regulador (≤ maxPressureBar); proibido no manifold"
    ConnectGas:
      type: object
      required: [cylinderId, regulatorId, pointOfUseEquipmentId, workingPressureBar]
      properties:
        cylinderId: {type: string, format: uuid}
        regulatorId: {type: string, format: uuid}
        manifoldId: {type: string, format: uuid, nullable: true}
        pointOfUseEquipmentId: {type: string, format: uuid}
        workingPressureBar: {type: number, exclusiveMinimum: 0}
    GasLeakTest:
      type: object
      required: [passed, method, pressureDropBar]
      properties:
        passed: {type: boolean}
        method: {type: string, maxLength: 120}
        pressureDropBar: {type: number, minimum: 0}
        note: {type: string, maxLength: 200, description: "Obrigatório quando reprovado"}
    GasConnection:
      type: object
      required: [id, cylinderId, regulatorId, pointOfUseEquipmentId, workingPressureBar,
                 networkMaxPressureBar, status, connectedAt]
      properties:
        id: {type: string, format: uuid}
        cylinderId: {type: string, format: uuid}
        regulatorId: {type: string, format: uuid}
        manifoldId: {type: string, format: uuid, nullable: true}
        pointOfUseEquipmentId: {type: string, format: uuid}
        workingPressureBar: {type: number}
        networkMaxPressureBar:
          type: number
          description: "Menor limite entre os componentes, congelado na montagem da linha"
        status: {type: string, enum: [PENDING_TEST, SERVING, BLOCKED, DISCONNECTED]}
        connectedAt: {type: string, format: date-time}
        leakTest:
          type: object
          nullable: true
          properties:
            passed: {type: boolean}
            method: {type: string}
            pressureDropBar: {type: number}
            note: {type: string, nullable: true}
            testedAt: {type: string, format: date-time}
        disconnectedAt: {type: string, format: date-time, nullable: true}
        disconnectReason: {type: string, nullable: true}
    GasConnectionDetail:
      type: object
      required: [connection, pressureReadings, consumption, consumedKg]
      properties:
        connection: {$ref: '#/components/schemas/GasConnection'}
        pressureReadings:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              bar: {type: number}
              tempC: {type: number, nullable: true}
              overPressure: {type: boolean}
              at: {type: string, format: date-time}
        consumption:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              kg: {type: number}
              reason: {type: string, nullable: true}
              at: {type: string, format: date-time}
        consumedKg: {type: number, description: "Soma do consumo registrado nesta linha"}
    FinishedLot:
      type: object
      description: "Lote de produto acabado (TRC-001-B): o que saiu da linha e o que um recall recolhe."
      properties:
        id: {type: string, format: uuid}
        code:
          type: string
          description: "Derivado do lote de produção mais a ordem do envase (`LOTE-100/1`), para levar de volta à origem sem consulta."
        runId: {type: string, format: uuid}
        planId: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        batchCode: {type: string, description: "Código do lote de produção congelado no momento do envase."}
        containerId: {type: string, format: uuid}
        containerVolumeMl: {type: number}
        units: {type: integer, description: "Somente unidades boas; rejeito não é produto."}
        volumeLiters: {type: number}
        packagedOn: {type: string, format: date}
    Genealogy:
      type: object
      description: "Grafo derivado (TRC-001). Nós e arestas alcançados, mais os elos ausentes."
      properties:
        root: {$ref: '#/components/schemas/LineageNode'}
        direction: {type: string, enum: [BACKWARD, FORWARD, BOTH]}
        depth: {type: integer}
        truncated:
          type: boolean
          description: "Verdadeiro quando o corte de profundidade escondeu parte do grafo."
        nodes:
          type: array
          items: {$ref: '#/components/schemas/LineageNode'}
        edges:
          type: array
          items: {$ref: '#/components/schemas/LineageEdge'}
        gaps:
          type: array
          description: "Elos que deveriam existir e não existem, com o motivo."
          items: {$ref: '#/components/schemas/LineageGap'}
    Quarantine:
      type: object
      description: "Quarentena (FDS-002). Guarda a origem; o alcance é derivado a cada leitura."
      properties:
        id: {type: string, format: uuid}
        origin: {$ref: '#/components/schemas/LineageNode'}
        reason: {type: string}
        status: {type: string, enum: [OPEN, RELEASED]}
        openedAt: {type: string, format: date-time}
        releasedAt: {type: string, format: date-time, nullable: true}
        releaseJustification: {type: string, nullable: true}
    QuarantineDetail:
      type: object
      properties:
        quarantine: {$ref: '#/components/schemas/Quarantine'}
        truncated:
          type: boolean
          description: "Verdadeiro quando o corte de profundidade escondeu parte do alcance."
        affected:
          type: array
          items:
            type: object
            properties:
              node: {$ref: '#/components/schemas/LineageNode'}
              suspected:
                type: boolean
                description: >-
                  O caminho até este nó passa por intenção, não por fato registrado. Bloqueia igual —
                  num recall, o custo de bloquear a mais é estoque parado, e o de bloquear a menos é
                  produto na rua —, mas quem investiga precisa saber onde apertar primeiro.
    Shipment:
      type: object
      description: "Saída de um lote de produto acabado (TRC-001-D)."
      properties:
        id: {type: string, format: uuid}
        finishedLotId: {type: string, format: uuid}
        destination: {type: string}
        contact: {type: string, nullable: true}
        units: {type: integer}
        shippedOn: {type: string, format: date}
        note: {type: string, nullable: true}
        reversedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Preenchido quando a expedição foi estornada (FDS-003-A). Ela continua na listagem, marcada:
            sumir da tela seria indistinguível de nunca ter existido, e o histórico precisa mostrar que
            alguém registrou errado e corrigiu. Estornada não conta no escopo de um recall
        reversalReason: {type: string, nullable: true}
    Recall:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string, description: "REC-<ano>-<sequência>, por cervejaria."}
        origin: {$ref: '#/components/schemas/LineageNode'}
        reason: {type: string}
        status: {type: string, enum: [OPEN, CLOSED]}
        openedAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time, nullable: true}
        closingSummary: {type: string, nullable: true}
    RecallDossier:
      type: object
      properties:
        recall: {$ref: '#/components/schemas/Recall'}
        notifications:
          type: array
          description: "Destinos alcançados na abertura — pendentes primeiro, porque a lista é para trabalhar."
          items: {$ref: '#/components/schemas/RecallNotification'}
        pending: {type: integer}
        coverage:
          type: integer
          description: >-
            Percentual dos destinos conhecidos já comunicados. Mede o que se conhece: `gaps` diz o
            que falta conhecer, e ler um sem o outro superestima a cobertura.
        truncated: {type: boolean}
        scope:
          type: array
          items:
            type: object
            properties:
              node: {$ref: '#/components/schemas/LineageNode'}
              suspected: {type: boolean}
        newDestinations:
          type: array
          description: "Expedições que entraram no escopo depois da abertura: o lote saiu depois."
          items:
            type: object
            properties:
              shipmentId: {type: string, format: uuid}
              destination: {type: string}
              contact: {type: string, nullable: true}
              units: {type: integer}
        gaps:
          type: array
          description: "Lotes do escopo sem expedição registrada — não se sabe onde estão."
          items: {$ref: '#/components/schemas/LineageGap'}
    RecallNotification:
      type: object
      properties:
        id: {type: string, format: uuid}
        shipmentId: {type: string, format: uuid}
        finishedLotCode: {type: string}
        destination: {type: string}
        contact: {type: string, nullable: true}
        units: {type: integer}
        status: {type: string, enum: [PENDING, NOTIFIED]}
        channel: {type: string, nullable: true}
        note: {type: string, nullable: true}
        notifiedAt: {type: string, format: date-time, nullable: true}
    RecallDrill:
      type: object
      description: "Simulado de recall (FDS-004). Mede sem afetar estoque real."
      properties:
        id: {type: string, format: uuid}
        code: {type: string, description: "SIM-<ano>-<sequência>, por cervejaria."}
        origin: {$ref: '#/components/schemas/LineageNode'}
        note: {type: string, nullable: true}
        status: {type: string, enum: [RUNNING, FINISHED]}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time, nullable: true}
        unitsInScope: {type: integer, nullable: true, description: "Unidades que saíram da fábrica."}
        unitsLocated: {type: integer, nullable: true}
        locatedPercent:
          type: integer
          nullable: true
          description: >-
            Nulo quando não havia nada no escopo: não localizar o que não existe não é cobertura
            perfeita, é simulado sem objeto.
        destinationsReached: {type: integer, nullable: true}
        gapsFound: {type: integer, nullable: true}
        summary: {type: string, nullable: true}
        correctiveActions: {type: string, nullable: true}
        elapsedSeconds:
          type: integer
          description: "Tempo da cervejaria, do início ao encerramento — não o do servidor."
    RecallDrillReport:
      type: object
      properties:
        drill: {$ref: '#/components/schemas/RecallDrill'}
        unitsInScope: {type: integer}
        destinationsReached: {type: integer}
        destinations:
          type: array
          items:
            type: object
            properties:
              reference: {type: string, format: uuid}
              destination: {type: string}
              contact: {type: string, nullable: true}
              units: {type: integer}
        gaps:
          type: array
          items: {$ref: '#/components/schemas/LineageGap'}
        findings:
          type: array
          description: "Ações corretivas sugeridas: as lacunas viradas do avesso."
          items: {type: string}
    BrewConsumptionProposal:
      type: object
      properties:
        orderId: {type: string, format: uuid}
        alreadyRegistered:
          type: boolean
          description: "Verdadeiro depois do registro: a proposta serve só para conferência."
        reserved:
          type: array
          items:
            type: object
            properties:
              lotId: {type: string, format: uuid}
              ingredientId: {type: string, format: uuid}
              ingredientName: {type: string, nullable: true}
              supplierLotCode:
                type: string
                nullable: true
                description: "Como o operador reconhece o saco no chão."
              reserved: {type: number}
              unit: {type: string}
    BatchCost:
      type: object
      description: "Custo realizado do lote (CST-001): derivado enquanto aberto, congelado ao fechar."
      properties:
        batchId: {type: string, format: uuid}
        batchCode: {type: string}
        closed:
          type: boolean
          description: "Falso enquanto o custo é derivado: ele ainda muda se a produção mudar."
        incomplete:
          type: boolean
          description: "Verdadeiro quando alguma parcela conhecida ficou de fora; leia com `gaps`."
        volumeLiters:
          type: number
          description: >-
            Divisor do custo por litro: o volume transferido ao fermentador, não o planejado.
            Dividir pelo planejado embelezaria justamente o lote que rendeu menos.
        total: {type: number}
        costPerLiter: {type: number}
        totalByCategory:
          type: object
          additionalProperties: {type: number}
          description: "Quanto foi insumo, quanto foi embalagem."
        lines:
          type: array
          items:
            type: object
            properties:
              category: {type: string, enum: [INGREDIENT, PACKAGING, UTILITY, LABOR]}
              description: {type: string}
              source:
                type: string
                description: "De onde o número veio, em texto legível — a origem é rastreável por parcela."
              quantity: {type: number}
              unit: {type: string}
              unitCost: {type: number}
              total: {type: number}
        gaps:
          type: array
          description: "Parcelas que ficaram de fora, com o motivo. Somá-las como zero mentiria."
          items:
            type: object
            properties:
              category: {type: string, enum: [INGREDIENT, PACKAGING, UTILITY, LABOR]}
              reason: {type: string}
        closedAt: {type: string, format: date-time, nullable: true}
        note: {type: string, nullable: true}
    SavedReport:
      type: object
      description: "Definição de relatório salvo (RPT-003): um acordo, e por isso guardado."
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [DASHBOARD, BATCH_REPORT]}
        definitionVersion:
          type: integer
          description: "Versão da definição. Sobe a cada redefinição, e a execução guarda contra qual rodou."
        filters: {type: object, additionalProperties: {type: string}}
        timezone:
          type: string
          description: "Fuso da definição, não do servidor: 'todo dia às 6h' é 6h na fábrica."
        format: {type: string, enum: [JSON]}
        schedule: {type: string, enum: [MANUAL, DAILY, WEEKLY, MONTHLY]}
        retentionDays:
          type: integer
          description: "Por quantos dias o artefato fica disponível. É decisão de quem define."
        ownerUserId:
          type: string
          format: uuid
          description: "Proprietário técnico: a execução roda com a alçada dele, resolvida na hora."
        recipients:
          type: array
          description: "Usuários da plataforma. Não há e-mail livre: só de usuário se sabe a alçada."
          items: {type: string, format: uuid}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
    SavedReportRequest:
      type: object
      required: [name, kind, timezone, format, schedule, retentionDays, ownerUserId]
      properties:
        name: {type: string, maxLength: 120}
        kind: {type: string, enum: [DASHBOARD, BATCH_REPORT]}
        filters: {type: object, additionalProperties: {type: string}}
        timezone: {type: string, example: "America/Sao_Paulo"}
        format: {type: string, enum: [JSON]}
        schedule: {type: string, enum: [MANUAL, DAILY, WEEKLY, MONTHLY]}
        retentionDays: {type: integer, minimum: 1, maximum: 3650}
        ownerUserId: {type: string, format: uuid}
        recipients: {type: array, items: {type: string, format: uuid}}
    ReportRun:
      type: object
      description: "Uma execução: o que saiu, sob qual alçada e para quem foi."
      properties:
        id: {type: string, format: uuid}
        reportId: {type: string, format: uuid}
        definitionVersion: {type: integer}
        status: {type: string, enum: [SUCCEEDED, REFUSED, FAILED]}
        refusalReason:
          type: string
          nullable: true
          description: "Por que não rodou. O caso que importa: o dono perdeu a alçada."
        periodFrom: {type: string, format: date-time, nullable: true}
        periodTo: {type: string, format: date-time, nullable: true}
        expiresAt: {type: string, format: date-time, nullable: true}
        executedAt: {type: string, format: date-time}
        expired: {type: boolean}
        deliveries:
          type: array
          items:
            type: object
            properties:
              userId: {type: string, format: uuid}
              status: {type: string, enum: [PENDING, DELIVERED, REFUSED]}
              detail: {type: string, nullable: true}
              attempts:
                type: integer
                description: "Sobe a cada tentativa; é o que distingue 'ainda não' de 'nunca vai'."
              lastAttemptAt: {type: string, format: date-time, nullable: true}
        downloadToken:
          type: string
          nullable: true
          description: "Só vem para destinatário ou dono — o link é pessoal."
    Dashboard:
      type: object
      description: "Painel operacional (RPT-002): derivado, sem tabela própria."
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        sources:
          type: integer
          description: >-
            Quantos módulos contribuíram. Vai no contrato porque um painel com dois blocos a menos
            parece um painel normal, e este número é o que permite notar que ele encolheu.
        indicators:
          type: array
          items: {$ref: '#/components/schemas/OperationalIndicator'}
    OperationalIndicator:
      type: object
      properties:
        code:
          type: string
          description: "Identificador estável, em ponto. É por ele que a tela reconhece o indicador."
        group: {type: string, enum: [PRODUCTION, STOCK, QUALITY, FERMENTATION, COST]}
        label: {type: string}
        definition:
          type: string
          description: "O que o número quer dizer. Nunca vazio — o domínio não constrói sem."
        value: {type: number}
        unit: {type: string}
        from:
          type: string
          format: date-time
          nullable: true
          description: "Nulo significa posição, não ausência: é a foto do instante `to`."
        to: {type: string, format: date-time}
        positional: {type: boolean}
        drillDown:
          type: object
          description: "Recurso e filtro onde o número se abre. A rota é da interface."
          properties:
            resource: {type: string}
            filter:
              type: object
              additionalProperties: {type: string}
        gap:
          type: string
          nullable: true
          description: "O que este número não cobre; nulo quando não há o que ressalvar."
    BatchReport:
      type: object
      description: "Dossiê do lote (RPT-001): consolidação derivada, sem tabela própria."
      properties:
        batchId: {type: string, format: uuid}
        batchCode: {type: string}
        recipeName: {type: string}
        recipeVersion: {type: integer}
        status: {type: string}
        generatedAt:
          type: string
          format: date-time
          description: "Quando o documento foi montado. Relatório derivado sem data é indefensável."
        incomplete: {type: boolean}
        plan:
          type: object
          properties:
            volumeLiters: {type: number}
            materials:
              type: array
              description: "Vazio quando não há plano confiável; a lacuna correspondente diz por quê."
              items:
                type: object
                properties:
                  ingredientId: {type: string, format: uuid}
                  quantity: {type: number}
                  unit: {type: string}
        execution:
          type: object
          properties:
            transferredVolumeLiters: {type: number, nullable: true}
            transferLossesLiters: {type: number, nullable: true}
            transferred: {type: boolean}
            packaged: {type: boolean}
            packaging:
              type: array
              items:
                type: object
                properties:
                  planCode: {type: string}
                  plannedVolumeLiters: {type: number}
                  packagedVolumeLiters: {type: number}
                  rejectedVolumeLiters: {type: number}
                  lossesLiters: {type: number}
        quality:
          type: object
          properties:
            measurements: {type: integer}
            withinSpec: {type: integer}
            unmeasured:
              type: boolean
              description: "Ninguém mediu nada — que não é o mesmo que o lote ter passado."
            outOfSpec:
              type: array
              items:
                type: object
                properties:
                  parameter: {type: string}
                  value: {type: number}
                  unit: {type: string}
                  measuredAt: {type: string, format: date-time}
            deviations:
              type: array
              items:
                type: object
                properties:
                  parameter: {type: string}
                  severity: {type: string, enum: [MINOR, MAJOR, CRITICAL]}
                  status: {type: string, enum: [OPEN, CLOSED]}
                  limitValue: {type: number}
                  measuredValue: {type: number}
                  unit: {type: string}
                  openedAt: {type: string, format: date-time}
            nonConformities:
              type: array
              items:
                type: object
                properties:
                  code: {type: string}
                  title: {type: string}
                  severity: {type: string}
                  status: {type: string}
        cost:
          type: object
          nullable: true
          description: "Nulo quando o custo não pôde ser apurado; a lacuna diz por quê."
          properties:
            total: {type: number}
            costPerLiter: {type: number}
            volumeLiters: {type: number}
            closed: {type: boolean}
            incomplete: {type: boolean}
            gaps: {type: array, items: {type: string}}
        lineage:
          type: object
          properties:
            origins:
              type: array
              items: {$ref: '#/components/schemas/LineageReportEntry'}
            destinations:
              type: array
              items: {$ref: '#/components/schemas/LineageReportEntry'}
            gaps: {type: array, items: {type: string}}
            truncated: {type: boolean}
            complete:
              type: boolean
              description: "Falso com elo faltando ou travessia truncada: não prova rastreabilidade."
        gaps:
          type: array
          description: "O que não pôde ser afirmado. Silêncio aqui seria lido como 'não houve'."
          items: {type: string}
    LineageReportEntry:
      type: object
      properties:
        type: {type: string}
        label: {type: string}
    BatchVariance:
      type: object
      description: "Planejado versus real do lote (CST-002): derivado, sem tabela própria."
      properties:
        batchId: {type: string, format: uuid}
        batchCode: {type: string}
        plannedCost:
          type: number
          description: "Só dos insumos comparáveis: quem não tem base não entra no total."
        actualCost: {type: number}
        priceVariance:
          type: number
          description: "`(preço real − preço planejado) × quantidade real`. Positivo é desfavorável."
        consumptionVariance:
          type: number
          description: "`(quantidade real − planejada) × preço planejado`. Positivo é desfavorável."
        totalVariance: {type: number}
        reconciles:
          type: boolean
          description: >-
            Verdadeiro quando preço + consumo explicam a diferença inteira. Exposto de propósito:
            um relatório de variação que não fecha faz desconfiar até dos números certos.
        incomplete:
          type: boolean
          description: "Verdadeiro quando há lacuna; leia com `gaps`."
        materials:
          type: array
          items: {$ref: '#/components/schemas/MaterialVariance'}
        volumes:
          type: array
          items: {$ref: '#/components/schemas/VolumeVariance'}
        gaps:
          type: array
          description: "O que não deu para comparar, e por quê. Sem isso, silêncio viraria 'sem desvio'."
          items:
            type: object
            properties:
              what: {type: string}
              reason: {type: string}
    MaterialVariance:
      type: object
      properties:
        ingredientId: {type: string, format: uuid}
        name: {type: string}
        unit: {type: string, description: "Unidade canônica: KG, L ou UNIT."}
        plannedQuantity:
          type: number
          nullable: true
          description: "Nulo é 'não se sabe o que a receita pedia'; zero é 'não pedia nada'."
        actualQuantity:
          type: number
          nullable: true
          description: "Nulo enquanto o consumo não foi confirmado — o lote pode estar na panela."
        quantityVariance: {type: number, nullable: true}
        plannedUnitCost:
          type: number
          nullable: true
          description: "Preço médio dos lotes que a ordem separou; nulo quando ela não separou nada."
        actualUnitCost: {type: number, nullable: true}
        plannedCost: {type: number, nullable: true}
        actualCost: {type: number, nullable: true}
        priceVariance: {type: number, nullable: true}
        consumptionVariance: {type: number, nullable: true}
        totalVariance: {type: number, nullable: true}
        comparable:
          type: boolean
          description: "Falso quando falta algum dos quatro números; os campos nulos dizem qual."
    VolumeVariance:
      type: object
      properties:
        kind: {type: string, enum: [YIELD, LOSS]}
        what: {type: string}
        planned:
          type: number
          nullable: true
          description: "Nulo quando ninguém definiu o esperado — perda é assim hoje (CST-002-A)."
        actual: {type: number}
        variance: {type: number, nullable: true}
        variancePercent: {type: number, nullable: true}
        comparable: {type: boolean}
        unfavorable:
          type: boolean
          description: >-
            Render menos ou perder mais. O sinal sozinho não diz isso: −10 L de rendimento é ruim,
            −2 L de perda é bom.
    UtilityReport:
      type: object
      description: "Consumo de utilidades por litro envasado num período (UTL-001)."
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        packagedLiters:
          type: number
          description: >-
            Divisor do indicador: o volume das execuções de envase, não o dos planos. Dividir pelo
            planejado daria um número que melhora quando a fábrica planeja demais.
        indicators:
          type: array
          description: "Uma entrada por utilidade que alguém mediu — as outras não aparecem zeradas."
          items: {$ref: '#/components/schemas/UtilityIndicator'}
    UtilityIndicator:
      type: object
      properties:
        type: {type: string, enum: [WATER, ENERGY, CO2, CLEANING_PRODUCT]}
        unit: {type: string, description: "`L` para água, `kWh` para energia, `kg` para CO₂ e produto."}
        measured: {type: number, description: "Somatório do que foi lido em instrumento."}
        estimated: {type: number, description: "Somatório do que foi estimado por regra. Não se soma ao medido num número só."}
        total: {type: number}
        perLiter:
          type: number
          nullable: true
          description: "Nulo quando nada foi envasado no período — zero diria que a fábrica foi eficiente."
        measuredPerLiter:
          type: number
          nullable: true
          description: "Só a parte lida de instrumento, por litro: é a que se leva a auditoria."
        fullyMeasured:
          type: boolean
          description: "Falso também quando ninguém declarou cobertura; ver `coverage`."
        coverage:
          type: array
          description: "Por qual parte da fábrica o número fala, declarado por quem mede."
          items:
            type: object
            properties:
              what: {type: string, description: "O que são os eventos contados, ex.: \"ciclos de limpeza encerrados\"."}
              reported: {type: integer}
              expected: {type: integer}
              complete: {type: boolean}
        sources:
          type: array
          description: "De onde vieram as medições, em texto legível — número de sustentabilidade sem procedência não prova nada."
          items: {type: string}
    LineageNode:
      type: object
      properties:
        type:
          type: string
          enum: [STOCK_LOT, BREW_ORDER, BATCH, YEAST_HARVEST, PACKAGING_PLAN, PACKAGING_RUN, FINISHED_LOT, SHIPMENT]
        id: {type: string, format: uuid}
        label: {type: string, nullable: true}
    LineageEdge:
      type: object
      description: "Aresta dirigida no sentido do tempo: `from` deu origem a `to`."
      properties:
        from: {$ref: '#/components/schemas/LineageNode'}
        to: {$ref: '#/components/schemas/LineageNode'}
        kind:
          type: string
          description: "O elo em termos de negócio: reserva de insumo, ordem executada, envase executado…"
        strength:
          type: string
          enum: [CONFIRMED, INTENDED]
          description: >-
            `INTENDED` é intenção registrada, não fato. Tratar intenção como fato num recall é
            recolher o lote errado.
        recordedAt: {type: string, format: date-time, nullable: true}
    LineageGap:
      type: object
      properties:
        from: {$ref: '#/components/schemas/LineageNode'}
        expectedLink: {type: string}
        reason:
          type: string
          description: "Por que o elo não existe — o que falta na plataforma para que exista."
    Allergen:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
    AllergenDeclarationRequest:
      type: object
      description: "A lista enviada passa a ser a vigente; lista vazia é declaração de isenção."
      properties:
        allergens:
          type: array
          items: {type: string}
    AllergenProfile:
      type: object
      description: "Perfil derivado do lote (FDS-001), com as lacunas que impedem afirmá-lo."
      properties:
        allergens:
          type: array
          items: {type: string}
        complete:
          type: boolean
          description: >-
            Falso quando algum ingrediente da composição não tem declaração. Perfil incompleto não
            vira alerta discreto: ele barra o campo do rótulo e barra a troca de produto, porque
            "não sei" nunca pode valer como "não tem".
        gaps:
          type: array
          items: {$ref: '#/components/schemas/AllergenGap'}
    AllergenGap:
      type: object
      properties:
        ingredientId:
          type: string
          format: uuid
          nullable: true
          description: "Nulo quando o que falta é a própria composição, e não um ingrediente."
        label: {type: string}
    ChangeoverVerdict:
      type: object
      properties:
        allowed: {type: boolean}
        outcome:
          type: string
          enum: [CLEAR, DEDICATED, CLEANED, UNDECLARED, DEDICATION_VIOLATED, CHANGEOVER_REQUIRED]
        code:
          type: string
          enum: [allergen_clear, allergen_undeclared, allergen_dedication_violated, allergen_changeover_required]
          description: "Motivo estável; é o mesmo código que aparece em `blockers` na recusa do envase."
        detail: {type: string}
        allergens:
          type: array
          description: "Os alergênicos em questão — sem eles o operador não sabe qual POP resolve."
          items: {type: string}
        gaps:
          type: array
          items: {$ref: '#/components/schemas/AllergenGap'}
    AllergenMatrix:
      type: object
      properties:
        allergens:
          type: array
          items: {$ref: '#/components/schemas/Allergen'}
        ingredients:
          type: array
          items:
            type: object
            properties:
              ingredientId: {type: string, format: uuid}
              code: {type: string}
              name: {type: string}
              declared:
                type: boolean
                description: "Falso é lacuna, não isenção."
              allergens: {type: array, items: {type: string}}
        dedications:
          type: array
          description: "Só os equipamentos dedicados; os ausentes são compartilhados."
          items:
            type: object
            properties:
              equipmentId: {type: string, format: uuid}
              allergens: {type: array, items: {type: string}}
        procedures:
          type: array
          items:
            type: object
            properties:
              procedureCode: {type: string}
              allergens: {type: array, items: {type: string}}
    KnowledgeDocument:
      type: object
      description: >-
        Documento indexado. Imutável depois de indexado — corrigir o texto apagaria a base de uma resposta
        já dada. Versão nova é documento novo; a única coisa que muda depois é `effectiveTo`.
      required: [id, type, code, title, version, effectiveFrom, current, requiredPermission, chunks, indexedAt]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/DocumentType'}
        code:
          type: string
          description: "Estável entre versões: é o que liga a versão nova à antiga."
        title: {type: string}
        version: {type: integer, minimum: 1}
        effectiveFrom: {type: string, format: date}
        effectiveTo:
          type: string
          format: date
          nullable: true
          description: "Nulo é *ainda vigente*, não *desconhecido*."
        current: {type: boolean, description: "Verdadeiro quando a vigência está aberta."}
        requiredPermission:
          type: string
          description: "Sem esta permissão o documento não é recuperado nem listado."
        equipmentId:
          type: string
          format: uuid
          nullable: true
          description: "Nulo quando não se refere a equipamento específico."
        sourceUri: {type: string, nullable: true}
        chunks: {type: integer, description: "Quantos trechos recuperáveis o documento produziu."}
        indexedAt: {type: string, format: date-time}
    IndexDocument:
      type: object
      required: [type, code, title, effectiveFrom, requiredPermission, text]
      properties:
        type: {$ref: '#/components/schemas/DocumentType'}
        code: {type: string, maxLength: 60}
        title: {type: string, maxLength: 200}
        effectiveFrom:
          type: string
          format: date
          description: "A versão anterior é encerrada no dia anterior a esta data."
        requiredPermission: {type: string, maxLength: 80}
        equipmentId: {type: string, format: uuid, nullable: true}
        sourceUri: {type: string, maxLength: 500, nullable: true}
        text:
          type: string
          maxLength: 500000
          description: "Texto do documento; o corte em trechos respeita parágrafo e frase."
    Evidence:
      type: object
      description: >-
        Trecho recuperado, com o suficiente para ser citado e conferido. Tipo, versão e vigência viajam
        junto do texto porque mudam a autoridade da citação: "a FISPQ vigente diz" e "uma FISPQ substituída
        dizia" são afirmações diferentes sobre a mesma frase.
      required: [documentId, code, title, type, version, effectiveOnDate, ordinal, text, score, untrusted]
      properties:
        documentId: {type: string, format: uuid}
        code: {type: string}
        title: {type: string}
        type: {$ref: '#/components/schemas/DocumentType'}
        version: {type: integer}
        effectiveOnDate: {type: boolean, description: "Se o documento vale na data consultada."}
        ordinal:
          type: integer
          description: "Posição do trecho no documento, para localizar a conferência."
        text:
          type: string
          description: "**Não confiável.** Texto de terceiro; pode conter instrução endereçada ao modelo."
        score:
          type: number
          description: "Relevância relativa dentro desta consulta. Não é probabilidade de nada."
        untrusted:
          type: boolean
          enum: [true]
          description: "Sempre verdadeiro. Existe para que nenhum consumidor esqueça a origem do texto."
    DocumentType:
      type: string
      description: >-
        A espécie do documento muda como a citação deve ser lida. POP de limpeza **não** está aqui: ele já é
        estrutura versionada no módulo `sanitation` e o sistema responde sobre ele deterministicamente —
        passá-lo por recuperação textual transformaria um fato em um palpite.
      enum: [EQUIPMENT_MANUAL, SAFETY_DATA_SHEET, LAB_REPORT, OPERATING_PROCEDURE, TECHNICAL_NOTE]
    BatchAssessment:
      type: object
      description: >-
        A avaliação de risco de um lote. `facts` não é anexo: é o que permite conferir cada afirmação sem sair
        da tela. Uma avaliação sem os números ao lado pediria confiança; com eles, pede leitura.
      required: [usable, summary, risks, assumptions, facts, discarded]
      properties:
        usable:
          type: boolean
          description: >-
            Falso quando nada do que o modelo escreveu resistiu à conferência de números. Os `facts` continuam
            presentes — eles são do domínio.
        summary:
          type: string
          description: "Vazio quando o resumo não resistiu à conferência. O texto descartado não é devolvido."
        risks:
          type: array
          items: {$ref: '#/components/schemas/AssessedRisk'}
        assumptions:
          type: array
          description: >-
            O que o modelo supôs. Não declara fatos, e por isso **não pode conter número** — uma suposição com
            número é o número inventado no seu disfarce mais convincente.
          items: {type: string}
        facts:
          type: array
          description: "Todos os fatos calculados, inclusive os que o modelo não usou."
          items: {$ref: '#/components/schemas/CalculatedFact'}
        discarded:
          type: array
          description: >-
            Afirmações descartadas por número inventado ou fato inexistente, com o motivo. Chega ao cliente de
            propósito: é o sinal de que o modelo tentou calcular em vez de interpretar.
          items: {type: string}
    CommandProposal:
      type: object
      description: >-
        Um comando que o copiloto propôs e que ninguém executou. Ela existe como registro justamente para
        separar o momento em que a IA sugere do momento em que uma pessoa decide — e para que o segundo seja
        auditável depois.
      required: [id, action, label, parameters, rationale, requiredPermission, executionRoute,
                 executedOnConfirm, proposedBy, proposedAt, expiresAt, status, expired, canConfirm]
      properties:
        id: {type: string, format: uuid}
        action: {$ref: '#/components/schemas/ProposedAction'}
        label: {type: string, description: "A ação em português, como a pessoa que decide vai ler."}
        parameters:
          type: object
          additionalProperties: {type: string}
          description: >-
            Exatamente as chaves que a ação exige, nenhuma faltando e nenhuma a mais. Fechado de propósito:
            parâmetro inesperado é sinal de que o modelo entendeu a ação de outra forma, e adivinhar o que ele
            quis dizer num comando que altera custo ou qualidade não é um risco que valha correr.
        rationale:
          type: string
          maxLength: 1000
          description: >-
            Obrigatória. Uma proposta sem o motivo não dá a quem decide o que ele precisa para decidir, e "a IA
            sugeriu" não é motivo.
        requiredPermission:
          type: string
          description: >-
            A alçada exigida para confirmar — a do comando de verdade, não a de propor. `ai.command.propose`
            nunca aparece aqui.
        executionRoute:
          type: string
          description: >-
            Onde o comando vive de fato — onde ver o resultado quando o aceite executa, e onde praticá-lo à
            mão quando não executa.
        executedOnConfirm:
          type: boolean
          description: >-
            Se confirmar dispara o comando ou apenas registra a decisão. Existe para a tela dizer o que vai
            acontecer: prometer "leva ao comando" numa ação que executa faria a pessoa consentir com uma coisa
            e outra acontecer.
        proposedBy:
          type: string
          format: uuid
          description: "Quem **pediu** a proposta. A IA não propõe sozinha."
        proposedAt: {type: string, format: date-time}
        expiresAt:
          type: string
          format: date-time
          description: "12 horas após a proposta. Vencer é o que impede uma sugestão esquecida de virar comando no mês seguinte."
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED]
          description: >-
            Não há `EXPIRED` nem `EXECUTED`. Vencimento é derivado do prazo — uma proposta não muda de estado
            porque o tempo passou, ela só deixa de ser aceitável — e execução não acontece aqui.
        expired:
          type: boolean
          description: "Calculado na leitura a partir de `expiresAt`. Não é coluna."
        canConfirm:
          type: boolean
          description: >-
            Conveniência de apresentação: pendente, no prazo, e quem consulta tem `requiredPermission`. A
            verificação que vale é a do aceite.
        decidedBy:
          type: string
          format: uuid
          nullable: true
          description: "Quem **confirmou**, que não é necessariamente quem pediu — e é o campo que a história existe para produzir."
        decidedAt: {type: string, format: date-time, nullable: true}
        decisionNote: {type: string, nullable: true, maxLength: 500}
    ProposedAction:
      type: string
      description: >-
        A allowlist fechada. Um modelo que devolva qualquer coisa fora daqui não produz proposta: produz erro de
        contrato, e a resposta é recusada inteira.
      enum: [CLOSE_BATCH_COST, OPEN_NON_CONFORMITY, SCHEDULE_CLEANING_CYCLE]
    ProposalDecision:
      type: object
      description: >-
        Só a observação — e nada mais. Nem a ação, nem os parâmetros, nem quem decide: tudo isso já está na
        proposta gravada e no contexto autenticado. Aceitar ação ou parâmetro no corpo abriria o caminho exato
        que esta história existe para fechar.
      properties:
        note: {type: string, maxLength: 500}
    AssessedRisk:
      type: object
      required: [statement, severity, factRefs]
      properties:
        statement: {type: string}
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          description: "Juízo do modelo, não medição — a interface diz isso para que ninguém leia como cálculo."
        factRefs:
          type: array
          description: "Fatos que sustentam o risco. Todo número da afirmação foi conferido contra estes."
          items: {type: string}
    CalculatedFact:
      type: object
      description: "Um número calculado por um serviço de domínio — nunca pelo modelo."
      required: [id, label, unit, source, available]
      properties:
        id:
          type: string
          pattern: "^[a-z_]+$"
          description: >-
            Só letras e sublinhado, sem dígito: a conferência varre o texto do modelo procurando número, e um
            identificador com dígito seria lido como número inventado.
        label: {type: string}
        value:
          type: number
          nullable: true
          description: "Nulo quando o fato é ausência — e ausência não é zero."
        unit: {type: string, description: "Vazia quando o número é contagem."}
        source:
          type: string
          description: >-
            O serviço que calculou — `production`, `recipe`, `quality`, `costing`, ou com sufixo `(derivado)`.
            Viaja até a tela porque é o que faz "cálculos referenciam serviço de domínio" ser verificável por
            quem lê, em vez de uma promessa de arquitetura.
        available:
          type: boolean
          description: "Falso é ausência declarada: ninguém mediu, não houve transferência."
    GroundedAnswer:
      type: object
      description: >-
        A resposta com a fonte de cada afirmação. Os três blocos de texto são deliberadamente distintos e
        **não devem ser juntados na apresentação**: "o documento diz", "daí se conclui" e "isto não está em
        fonte nenhuma" têm pesos diferentes para quem vai agir sobre a resposta — que é justamente a
        informação mais importante quando o assunto é concentração química ou torque de aperto.
      required: [answered, answer, citations, inferences, limitations, consultedSources, discarded]
      properties:
        answered:
          type: boolean
          description: >-
            Falso quando as fontes não sustentam resposta. Com `consultedSources: 0` significa que não havia
            fonte; com `consultedSources` maior que zero significa que havia e a resposta não se sustentou —
            e as duas pedem providências opostas.
        answer:
          type: string
          description: "Vazio quando `answered` é falso. O texto descartado nunca é devolvido."
        citations:
          type: array
          description: "Citações **conferidas** contra os trechos que foram ao prompt."
          items: {$ref: '#/components/schemas/VerifiedCitation'}
        inferences:
          type: array
          description: "O que o modelo concluiu e não está escrito em fonte nenhuma."
          items: {type: string}
        limitations:
          type: array
          description: "O que a resposta não cobre, e por quê."
          items: {type: string}
        consultedSources:
          type: integer
          description: "Quantos trechos foram consultados — inclusive quando nada sustentou a resposta."
        discarded:
          type: array
          description: >-
            Citações que o modelo alegou e não conferiram, com o motivo. Chega ao cliente de propósito: é
            informação sobre a confiabilidade daquela resposta, e esconder deixaria uma resposta enfraquecida
            com a mesma aparência de uma sólida. Vazio é o caso normal.
          items: {type: string}
    VerifiedCitation:
      type: object
      description: >-
        Uma citação que existe e confere. Os metadados vêm **da fonte**, não da resposta do modelo — deixá-lo
        informar o título do que citou seria dar a ele a chance de errar sobre um dado que o sistema já sabe.
      required: [documentCode, title, type, version, effectiveOnDate, ordinal, quote]
      properties:
        documentCode: {type: string}
        title: {type: string}
        type: {$ref: '#/components/schemas/DocumentType'}
        version: {type: integer}
        effectiveOnDate:
          type: boolean
          description: >-
            Falso é aviso, não erro: a citação vem de versão substituída, e "a ficha vigente diz" não é a
            mesma afirmação que "uma ficha substituída dizia".
        ordinal: {type: integer, description: "Trecho citado, para localizar a conferência."}
        quote:
          type: string
          description: "A frase do documento, conferida contra o trecho — não uma paráfrase."
    AiGatewayStatus:
      type: object
      description: "Estado do gateway de modelos (AIA-001)."
      required: [provider, enabled, models, timeoutSeconds, budget, recent]
      properties:
        provider: {type: string, description: "Provedor configurado, ex.: `anthropic`."}
        enabled:
          type: boolean
          description: "Falso é estado normal: o sistema opera sem IA."
        models:
          type: array
          description: "Ordenada: o primeiro é o preferido, os seguintes são o fallback. Vazia quando desligado."
          items: {type: string}
        timeoutSeconds: {type: integer, description: "Prazo máximo de uma chamada."}
        budget: {$ref: '#/components/schemas/AiBudget'}
        recent:
          type: array
          items: {$ref: '#/components/schemas/AiInvocation'}
    AiBudget:
      type: object
      description: >-
        Teto do mês e consumo. O teto é guardado porque é decisão de alguém; o gasto é somado do
        ledger a cada consulta, porque dois números sobre o mesmo fato divergem.
      required: [monthlyLimit, spentThisMonth, remaining, exhausted, currency, version]
      properties:
        monthlyLimit: {type: number}
        spentThisMonth: {type: number}
        remaining:
          type: number
          minimum: 0
          description: "Nunca negativo: baixar o teto abaixo do gasto devolve zero, não dívida."
        exhausted:
          type: boolean
          description: "Verdadeiro quando novas chamadas serão recusadas antes de gastar."
        currency: {type: string}
        version:
          type: integer
          format: int64
          description: "Devolver em `PUT /ai/gateway/budget`. `0` = ainda sob o teto padrão da instalação."
    AiInvocation:
      type: object
      description: >-
        Uma chamada registrada. Sem prompt, sem resposta e sem trecho de documento — este registro
        explica custo e disponibilidade, não guarda texto.
      required: [purpose, model, status, inputTokens, outputTokens, cost, currency, latencyMillis, occurredAt]
      properties:
        purpose: {type: string, enum: [CONNECTIVITY_PROBE]}
        model:
          type: string
          description: "Modelo desta tentativa; `-` quando não houve chamada."
        status:
          type: string
          enum: [SUCCEEDED, PROVIDER_DISABLED, PROVIDER_FAILED, REJECTED_CONTRACT, BUDGET_EXCEEDED]
        inputTokens: {type: integer, format: int64}
        outputTokens: {type: integer, format: int64}
        cost:
          type: number
          description: >-
            Seis casas decimais. Zero quando não houve geração (provedor desligado, orçamento
            esgotado); maior que zero numa recusa por contrato, porque gerar já custou.
        currency: {type: string}
        latencyMillis: {type: integer, format: int64}
        failureReason:
          type: string
          nullable: true
          description: "Motivo por extenso, sem conteúdo. Nulo — e só — quando `status` é `SUCCEEDED`."
        occurredAt: {type: string, format: date-time}
    AiProbeResult:
      type: object
      description: "Resposta da verificação, já validada contra o contrato."
      required: [ready, note]
      properties:
        ready: {type: boolean}
        note:
          type: string
          maxLength: 200
          description: "Frase curta gerada pelo modelo — prova que houve geração, não só conexão."
    GasConnectionProblem:
      type: object
      description: "Problem Details da recusa de conexão; `blockers` acompanha gas_connection_blocked."
      properties:
        code: {type: string, enum: [gas_connection_blocked]}
        blockers:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                enum: [cylinder_blocked, cylinder_in_use, cylinder_empty, cylinder_expired,
                       regulator_unknown, regulator_inactive, manifold_unknown, manifold_inactive,
                       point_of_use_occupied, working_pressure_above_network]
              message: {type: string}
  responses:
    Problem:
      description: Problem Details
      content:
        application/problem+json:
          schema: {type: object}

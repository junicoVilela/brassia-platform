              lotId: {type: string, format: uuid}
              countedQuantity: {type: number, minimum: 0}
    ReserveStock:
      type: object
      required: [ingredientId, quantity, unit]
      properties:
        ingredientId: {type: string, format: uuid}
        quantity: {type: number, exclusiveMinimum: 0}
        unit: {type: string, enum: [KG, G, MG, L, ML, UNIT]}

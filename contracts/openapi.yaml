          type: array
          description: "Todos os itens, inclusive os pendentes (confirmed = false)"
          items:
            type: object
            required: [item, confirmed]
            properties:
              item: {type: string, enum: [CONTAINER_INSPECTED, SEAL_TEST, GAS_SUPPLY]}
              confirmed: {type: boolean}
              confirmedBy: {type: string, format: uuid, nullable: true}
              confirmedAt: {type: string, format: date-time, nullable: true}

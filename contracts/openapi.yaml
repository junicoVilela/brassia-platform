          type: string
          enum: [STABLE, INSUFFICIENT_READINGS, WINDOW_NOT_COVERED, VARIATION_ABOVE_TOLERANCE]
          description: "WINDOW_NOT_COVERED é o FG falso estável: leituras próximas demais no tempo"
        policy: {$ref: '#/components/schemas/FgStabilityPolicy'}
        spanHours: {type: integer, description: "Intervalo coberto pelas leituras consideradas"}
        amplitudeSg: {type: number, description: "Diferença entre a maior e a menor leitura considerada"}
        readings:

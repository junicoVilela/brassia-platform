        sequence: {type: integer, minimum: 1}
        method: {type: string, maxLength: 120}
        product: {type: string, maxLength: 120}
        concentrationMinPct: {type: number}
        concentrationMaxPct: {type: number}
        tempMinC: {type: number}
        tempMaxC: {type: number}
        timeMinutes: {type: integer, minimum: 0}
        flow: {type: string, maxLength: 120}
        ppe: {type: string, maxLength: 200}
        alternative: {type: string, maxLength: 200}
        prohibition: {type: string, maxLength: 200}
        evidenceRequired: {type: boolean}
    CreateProcedure:
      type: object
      required: [code, name, steps]
      properties:
        code: {type: string, maxLength: 40}
        name: {type: string, maxLength: 160}
        steps: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ProcedureStep'}}
    UpdateProcedure:
      type: object
      required: [name, steps]
      properties:
        name: {type: string, maxLength: 160}
        steps: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ProcedureStep'}}
    CompatibilityRule:
      type: object
      required: [id, material, soiling, risk, method]
      properties:
        id: {type: string, format: uuid}
        material: {type: string, enum: [INOX, ALUMINIO, PLASTICO, MADEIRA, VIDRO, BORRACHA]}
        soiling: {type: string, enum: [LEVE, MODERADA, PESADA]}
        risk: {type: string, enum: [BAIXO, MEDIO, ALTO]}
        previousProduct: {type: string, nullable: true, description: "Produto anterior normalizado; nulo = regra genérica"}
        procedureCode: {type: string, nullable: true, description: "Código de POP publicado referenciado"}
        method: {type: string}
        alternative: {type: string, nullable: true}
        restriction: {type: string, nullable: true}
    CreateCompatibilityRule:
      type: object
      required: [material, soiling, risk, method]
      properties:
        material: {type: string, enum: [INOX, ALUMINIO, PLASTICO, MADEIRA, VIDRO, BORRACHA]}
        soiling: {type: string, enum: [LEVE, MODERADA, PESADA]}
        risk: {type: string, enum: [BAIXO, MEDIO, ALTO]}
        previousProduct: {type: string, maxLength: 120, description: "Opcional; vazio = regra genérica"}
        procedureCode: {type: string, maxLength: 40, description: "Opcional; se informado, o POP deve estar PUBLISHED"}
        method: {type: string, maxLength: 200}
        alternative: {type: string, maxLength: 200}
        restriction: {type: string, maxLength: 200}
    RecommendCleaning:
      type: object
      required: [material, soiling, risk]
      properties:
        material: {type: string, enum: [INOX, ALUMINIO, PLASTICO, MADEIRA, VIDRO, BORRACHA]}
        soiling: {type: string, enum: [LEVE, MODERADA, PESADA]}
        risk: {type: string, enum: [BAIXO, MEDIO, ALTO]}
        previousProduct: {type: string, maxLength: 120}
    StartCleaningCycle:
      type: object

        id: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        inputVolumeLiters: {type: number}
        producedUnits: {type: integer}
        rejectedUnits: {type: integer}
        packagedVolumeLiters: {type: number}
        rejectedVolumeLiters: {type: number}
        lossesLiters: {type: number, description: "Derivada; entrada − envasado − rejeitado"}
        lossPercent: {type: number}
        containersConsumed: {type: integer, description: "Boas + rejeitadas"}
        note: {type: string, nullable: true}
        executedAt: {type: string, format: date-time}
        executedBy: {type: string, format: uuid}
    PackagingRunProblem:
      type: object
      description: "Problem Details da recusa de execução; a extensão depende do `code`."
      properties:
        code:
          type: string
          enum: [volume_balance, batch_volume_exceeded, insufficient_packaging_stock, conflict]
        balance:
          type: object
          description: Acompanha volume_balance
          properties:
            inputVolumeLiters: {type: number}
            packagedVolumeLiters: {type: number}
            rejectedVolumeLiters: {type: number}
            shortfallLiters: {type: number}
        batchVolume:
          type: object
          description: Acompanha batch_volume_exceeded
          properties:
            batchVolumeLiters: {type: number}
            alreadyPackagedLiters: {type: number}
            remainingLiters: {type: number}
            requestedLiters: {type: number}
        shortfall:
          type: object
          description: Acompanha insufficient_packaging_stock
          properties:
            containerId: {type: string, format: uuid}
            requested: {type: number}
            available: {type: number}
            unit: {type: string}
    RecordCarbonation:
      type: object
      required: [method, targetVolumes, referenceTempC, confirmed]
      properties:
        method: {type: string, enum: [PRIMING, FORCED]}
        targetVolumes: {type: number, exclusiveMinimum: 0}
        referenceTempC: {type: number}
        primingSugar:
          type: string
          enum: [SUCROSE, DEXTROSE_MONOHYDRATE, DRY_MALT_EXTRACT]
          description: Obrigatório quando o método é PRIMING

        measuredAt: {type: string, format: date-time}
    FgStabilityPolicy:
      type: object
      description: "Critério de estabilidade de FG congelado na versão publicada do perfil"
      properties:
        windowHours: {type: integer, minimum: 1, description: "Janela que a série precisa cobrir (padrão 48)"}
        minReadings: {type: integer, minimum: 2, description: "Leituras mínimas na janela (padrão 3)"}
        toleranceSg: {type: number, description: "Variação máxima entre a menor e a maior leitura (padrão 0,0020)"}
    FgStability:
      type: object
      required: [stable, verdict, policy, spanHours, amplitudeSg, readings]
      properties:
        stable: {type: boolean}

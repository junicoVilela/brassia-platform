    SimulateBlend:
      type: object
      required: [inputs]
      properties:
        inputs:
          type: array
          minItems: 1
          items:
            type: object
            required: [sourceId, volumeLiters]
            properties:
              sourceId: {type: string, format: uuid}
              volumeLiters: {type: number}
        targetProfileId: {type: string, format: uuid}
    CreateRecipe:
      type: object
      required: [name, equipmentId, batchVolumeLiters, items]
      properties:
        name: {type: string, maxLength: 120}
        equipmentId: {type: string, format: uuid}
        batchVolumeLiters: {type: number}
        targetOgPoints: {type: number}
        targetIbu: {type: number}
        targetColorEbc: {type: number}
        targetAbv: {type: number}
        boilTimeMinutes: {type: integer}
        transferLossPercent:
          type: number
          minimum: 0
          exclusiveMaximum: 100
          nullable: true
          description: >-
            Quanto esta cerveja admite perder na transferência ao fermentador, em % do volume planejado
            (CST-002-A). **Percentual e não litros**: perda de trub e absorção de lúpulo escalam com o
            tamanho da brassa, e um valor absoluto ficaria errado — em silêncio — no dia em que a
            cervejaria dobrasse o lote.


            Nulo é legítimo: quem ainda não mediu a própria perda não tem esperado, e a variação
            (CST-002) volta a mostrar a perda como fato, sem desvio. Assumir zero faria toda perda parecer
            desvio.
        packagingLossPercent:
          type: number
          minimum: 0
          exclusiveMaximum: 100
          nullable: true
          description: Mesma ideia, para a perda de linha no envase.
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [ingredientId, stage, quantity, unit]
            properties:
              ingredientId: {type: string, format: uuid}
              stage: {type: string, enum: [MASH, BOIL, WHIRLPOOL, FERMENTATION, PACKAGING]}
              quantity: {type: number}
              unit: {type: string, enum: [KG, G, MG, L, ML, UNIT]}
              timingMinutes: {type: integer}
              percentage: {type: number}

    <div class="container-fluid">
      <div class="main-content d-flex flex-column p-0">
        <div class="m-auto w-100 py-5" style="max-width: 460px;">
          <div class="card bg-white border rounded-10 border-white">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <img src="assets/fila/images/logo-icon.png" alt="BrassIA" width="40" height="40" class="mb-3">
                <h1 class="h4 fw-semibold mb-1">Recuperar acesso</h1>
                <p class="text-secondary mb-0">Enviaremos instruções para o seu e-mail</p>
              </div>

              @if (sent()) {
                <div class="alert alert-success" role="alert">
                  Se houver uma conta com esse e-mail, enviamos as instruções para redefinir a senha.
                </div>
                <a routerLink="/login" class="btn btn-outline-secondary w-100 py-2">Voltar ao login</a>
              } @else {
                <form [formGroup]="form" (ngSubmit)="submit()">
                  <div class="mb-4">
                    <label class="form-label" for="email">E-mail</label>
                    <input id="email" type="email" class="form-control" formControlName="email"
                           autocomplete="username" placeholder="voce@cervejaria.com">
                  </div>
                  <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="form.invalid || submitting()">
                    @if (submitting()) {
                      <span class="spinner-border spinner-border-sm me-2"></span>
                    }
                    Enviar instruções
                  </button>
                  <a routerLink="/login" class="btn btn-link w-100 mt-2">Voltar ao login</a>
                </form>
              }
            </div>
          </div>
        </div>
      </div>
    </div>

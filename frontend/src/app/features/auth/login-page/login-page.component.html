    <div class="container-fluid">
      <div class="main-content d-flex flex-column p-0">
        <div class="m-auto w-100 py-5" style="max-width: 460px;">
          <div class="card bg-white border rounded-10 border-white">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <img src="assets/fila/images/logo-icon.png" alt="BrassIA" width="40" height="40" class="mb-3">
                <h1 class="h4 fw-semibold mb-1">{{ mfaRequired() ? 'Verificação em duas etapas' : 'Entrar' }}</h1>
                <p class="text-secondary mb-0">
                  {{ mfaRequired() ? 'Informe o código do seu segundo fator' : 'Acesse a plataforma BrassIA' }}
                </p>
              </div>

              @if (error()) {
                <div class="alert alert-danger" role="alert">{{ error() }}</div>
              }

              @if (!mfaRequired()) {
                <form [formGroup]="form" (ngSubmit)="submit()">
                  <div class="mb-3">
                    <label class="form-label" for="email">E-mail</label>
                    <input id="email" type="email" class="form-control" formControlName="email"
                           autocomplete="username" placeholder="voce@cervejaria.com">
                  </div>
                  <div class="mb-4">
                    <label class="form-label" for="password">Senha</label>
                    <input id="password" type="password" class="form-control" formControlName="password"
                           autocomplete="current-password" placeholder="Sua senha">
                  </div>
                  <button type="submit" class="btn btn-primary w-100 py-2"
                          [disabled]="form.invalid || submitting()">
                    @if (submitting()) {
                      <span class="spinner-border spinner-border-sm me-2"></span>
                    }
                    Entrar
                  </button>
                </form>
              } @else {
                <form [formGroup]="mfaForm" (ngSubmit)="confirmMfa()">
                  <div class="mb-3">
                    <label class="form-label" for="mfaMethod">Método</label>
                    <select id="mfaMethod" class="form-select" formControlName="method">
                      @for (m of methods(); track m) {
                        <option [value]="m">{{ m === 'TOTP' ? 'Aplicativo autenticador (TOTP)' : 'Código de recuperação' }}</option>
                      }
                    </select>
                  </div>
                  <div class="mb-4">
                    <label class="form-label" for="mfaCode">Código</label>
                    <input id="mfaCode" type="text" class="form-control" formControlName="code"
                           inputmode="numeric" autocomplete="one-time-code" placeholder="000000" autofocus>
                  </div>
                  <button type="submit" class="btn btn-primary w-100 py-2"
                          [disabled]="mfaForm.invalid || submitting()">
                    @if (submitting()) {
                      <span class="spinner-border spinner-border-sm me-2"></span>
                    }
                    Verificar
                  </button>
                  <button type="button" class="btn btn-link w-100 mt-2" (click)="cancelMfa()" [disabled]="submitting()">
                    Voltar
                  </button>
                </form>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
